async function easyEmailOnlyLogin(){
  const emailInput=document.getElementById('email');
  const email=emailInput.value.trim().toLowerCase();
  const msg=document.getElementById('msg');
  msg.style.display='block';
  if(!email||!email.includes('@')||!email.includes('.')){msg.innerText='❌ Enter valid email - e.g. you@gmail.com'; msg.style.background='#ff0000'; msg.style.color='#fff'; return;}
  msg.style.background='#000'; msg.style.color='gold';
  msg.innerText='⏳ Checking email... Creating your ₦5,000 account tonight...';
  try{
    // 1. Check if email exists in profiles
    const {data:existingProfiles}=await supabaseClient.from('profiles').select('*').eq('email',email).limit(1);
    let profile=existingProfiles&&existingProfiles[0];
    let userId;
    
    if(profile){
      userId=profile.id;
      msg.innerText='✅ Welcome back! Logging you in with email only tonight...';
    }else{
      // Create new profile with random UUID - No auth needed for email-only launch
      const newId=crypto.randomUUID();
      userId=newId;
      const displayName=email.split('@')[0];
      const {error:profErr}=await supabaseClient.from('profiles').insert([{
        id:newId,
        email:email,
        display_name:displayName,
        total_words:0,
        recordings_count:0,
        status:'active',
        is_chairman:false,
        last_login_at:new Date().toISOString()
      }]);
      if(profErr){
        // If RLS blocks, try with supabase auth signup with dummy password hidden from user
        const dummyPass='EmailOnly_'+Math.random().toString(36).substring(2,12)+'Launch!';
        const {data:authData,error:authErr}=await supabaseClient.auth.signUp({email:email,password:dummyPass});
        if(authData?.user){
          userId=authData.user.id;
          await supabaseClient.from('profiles').insert([{id:userId,email:email,display_name:displayName,status:'active',is_chairman:false}]);
        }else if(authErr&&authErr.message.includes('already registered')){
          const {data:signInData}=await supabaseClient.auth.signInWithPassword({email:email,password:dummyPass});
          if(signInData?.user){userId=signInData.user.id;}
        }
      }
      msg.innerText='✅ New account created tonight!';
    }
    
    // 2. Check / Create API Key - Automatic credit
    const {data:existingKeys}=await supabaseClient.from('api_keys').select('*').eq('email',email).limit(1);
    if(!existingKeys||existingKeys.length===0){
      const fullKey='mnp_'+Math.random().toString(36).substring(2,10)+Math.random().toString(36).substring(2,10)+Math.random().toString(36).substring(2,8);
      const keyHash=await hashKeyClient(fullKey);
      await supabaseClient.from('api_keys').insert([{
        email:email,
        name:email.split('@')[0],
        api_key:fullKey,
        key_hash:keyHash,
        key_prefix:fullKey.substring(0,12),
        credits_remaining:100,
        credits_total:100,
        credits_used:0,
        is_active:true,
        payment_ref:'EMAIL-ONLY-100-TONIGHT'
      }]);
      msg.innerText='✅ 100 FREE credits added! Redirecting to earn ₦5,000...';
    }else{
      msg.innerText=`✅ You have ${existingKeys[0].credits_remaining} credits! Redirecting...`;
    }
    
    // 3. Save easy session - Email only - No password!
    localStorage.setItem('easy_email',email);
    localStorage.setItem('easy_user_id',userId);
    localStorage.setItem('easy_login_time',new Date().toISOString());
    localStorage.setItem('is_email_only_login','true');
    
    // 4. Try to also create Supabase session for storage upload (hidden from user)
    try{
      const dummyPass='EmailOnly_'+Math.random().toString(36).substring(2,12)+'Launch!';
      await supabaseClient.auth.signInWithPassword({email:email,password:dummyPass}).catch(()=>{});
    }catch(e){}
    
    setTimeout(()=>{location.pathname='/user/dashboard';},1200);
    
  }catch(e){
    msg.innerText='❌ '+e.message;
    msg.style.background='#ff0000';
    msg.style.color='#fff';
    console.error(e);
    // Fallback: Even if error, allow easy login with local storage for launch
    localStorage.setItem('easy_email',email);
    localStorage.setItem('easy_user_id','temp_'+Date.now());
    setTimeout(()=>{location.pathname='/user/dashboard';},1500);
  }
}

            <button onclick="approveRecording('${r.id}')" style="background:#00ff88;color:#000;padding:14px;border:none;border-radius:10px;font-weight:900">✅ APPROVE + ₦50</button>
            <button onclick="rejectRecording('${r.id}')" style="background:#ff3b3b;color:#fff;padding:14px;border:none;border-radius:10px;font-weight:900">Reject</button>
            <button onclick="copyVoiceId('${r.file_name}')" style="background:gold;color:#000;padding:14px;border:none;border-radius:10px;font-weight:900">ID CODE</button>
          </div>
          <button onclick="deleteRecording('${r.id}','${r.file_name}')" style="width:100%;background:#000;color:#ff3b3b;border:2px solid #ff3b3b;padding:14px;border-radius:30px;margin-top:8px;font-weight:900">DELETE BUTTON</button>
        </div>
      </div>`).join('')||'No recordings'}
    </div>`;
  window.togglePanel=function(id){const el=document.getElementById(id); el.style.display=el.style.display==='none'?'block':'none';};
  window.toggleRec=function(id){const el=document.getElementById('rec-'+id); el.style.display=el.style.display==='none'?'block':'none';};
  setTimeout(()=>loadAllSignedVoices(),800);
}

async function renderUserDashboardReal(){

  if(user.profile?.is_chairman){location.pathname='/admin/dashboard'; return;}
  const {data:recs}=await supabaseClient.from('recordings').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
  const {data:keys}=await supabaseClient.from('api_keys').select('*').eq('email',user.email).order('created_at',{ascending:false});
  const records=recs||[];

    <div class="card" style="background:linear-gradient(135deg,#00ff88,#00aa55);color:#000;border:3px solid gold;padding:12px">
      <h2 style="margin:4px;text-align:center">💰 RECORD VOICE & RECEIVE ₦5,000</h2>
      <div style="background:#000;color:#00ff88;padding:14px;border-radius:12px;margin:8px 0;text-align:center">
        <p style="margin:2px;font-size:12px">YOUR EARNINGS - Email: ${user.email}</p>
        <h1 style="margin:4px;font-size:38px;color:gold">₦${earnings.toLocaleString()}</h1>
        <p>${approved} approved x ₦50</p>
        <div style="background:#333;height:14px;border-radius:20px;margin:10px 0;overflow:hidden"><div style="background:gold;height:100%;width:${progress}%"></div></div>
        <p>${progress}% to ₦5,000</p>

    </div>
    <div class="card" style="border:2px solid #00ff88"><h3>WORKER - ${user.email} - Email Only Login ✅</h3><p>Total: ${records.length} | Approved: ${approved} | Pending: ${pending}</p><button class="btn gray" onclick="localStorage.clear(); supabaseClient.auth.signOut().then(()=>location.pathname='/user/login')">Logout - Email Only</button></div>
    <div class="card" style="border:2px solid gold"><h3>MY KEYS - Email: ${user.email}</h3>${(keys||[]).map(k=>`<div style="background:#1a1500;padding:10px;border-radius:10px;margin:5px 0;display:flex;justify-content:space-between"><code>${k.key_prefix}...</code><span style="background:#00ff88;color:#000;padding:4px 10px;border-radius:20px;font-weight:900">${k.credits_remaining}</span></div>`).join('')||'No key - Will auto create'}<button class="btn gold" onclick="location.pathname='/buy'">Buy More</button></div>
    <div class="card" style="border:3px solid #00ff88"><h3>READ - Earn ₦50 - Email Only Tonight</h3><div class="textbox" id="curTxt">${current}</div><button id="readBtn" class="btn green" onclick="startReadRecord()">🎙️ START RECORD</button><button id="stopReadBtn" class="btn red" style="display:none" onclick="stopReadRecord()">STOP</button><div id="readStatus" style="display:none;background:black;padding:12px;border-radius:10px;margin-top:10px"><p>Recording <span id="readTimer">0s</span></p><audio id="readAudioPreview" controls style="width:100%;display:none"></audio><button id="saveReadBtn" class="btn gold" style="display:none" onclick="saveReadRecord()">💾 SAVE & HIDE - Earn ₦50</button><p id="saveReadMsg"></p></div></div>
    <div class="card"><h3>My Recordings ${records.length}</h3>${records.slice(0,20).map((r,i)=>`<div style="background:#181818;padding:10px;border-radius:10px;margin:6px 0"><b>#${r.recording_number} ${r.admin_status.toUpperCase()} ${r.admin_status==='approved'?'💰 ₦50':''}</b><br><small>${(r.pidgin_text||'').substring(0,80)}</small><br><audio id="user-audio-${i}" data-file="${r.file_name}" controls style="width:100%"></audio></div>`).join('')||'No recordings yet'}</div>`;

async function renderKeysPage(){
  const {data:{session}}=await supabaseClient.auth.getSession(); if(!session){location.pathname='/admin/login'; return;}
  const {data:keys}=await supabaseClient.from('api_keys').select('*').order('created_at',{ascending:false});
  document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid gold"><h2>KEYS - Email Only System Tonight</h2><button class="btn gold" onclick="location.pathname='/admin/dashboard'">Dashboard</button></div><div class="card"><h3>All Keys ${keys?.length||0} - Email Only - Automatic</h3>${(keys||[]).map(k=>`<div style="background:#181818;padding:14px;border-radius:12px;margin:10px 0"><div style="display:flex;justify-content:space-between"><div><b>${k.name}</b><br><small>${k.email} - ${k.key_prefix}...</small></div><small style="background:${!k.is_active?'gold':'#00ff88'};color:#000;padding:4px 8px;border-radius:10px">${!k.is_active?'PENDING':'ACTIVE - '+k.credits_remaining}</small></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:10px"><button onclick="deductCredit('${k.id}',10)" style="background:#ff8c00;color:#fff;padding:10px;border:none;border-radius:8px">-10</button><button onclick="addCredit('${k.id}',100)" style="background:#00ff88;color:#000;padding:10px;border:none;border-radius:8px">+100</button><button onclick="resetTo100('${k.id}')" style="background:gold;color:#000;padding:10px;border:none;border-radius:8px">SET 100</button><button onclick="deleteKey('${k.id}')" style="background:#000;color:#ff3b3b;border:2px solid #ff3b3b;padding:10px;border-radius:8px">DEL</button></div></div>`).join('')||'No keys'}</div>`;
  window.resetTo100=async function(id){await supabaseClient.from('api_keys').update({credits_remaining:100,credits_total:100,credits_used:0}).eq('id',id); location.reload();};
  window.deleteKey=async function(id){if(!confirm('DEL?'))return; await supabaseClient.from('api_keys').delete().eq('id',id); location.reload();};
}
function renderBuyPage(){
document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid gold;text-align:center"><h1 style="color:gold">BUY API KEY - Email Only Tonight</h1></div><div class="card" style="border:3px solid #00ff88"><h2 style="color:#00ff88;text-align:center">FREE - Email Only</h2><input id="buy_name_free" placeholder="Your Name"><input id="buy_email_free" placeholder="Your Email Only"><button class="btn green" onclick="doBuyFreeSecure()">COLLECT FREE 100 - Email Only BUTTON</button><p id="buy_free_msg"></p><div id="buyFreeBox" style="display:none;background:#fff;color:#000;padding:16px;border-radius:12px"><code id="buyFreeKeyText" style="word-break:break-all;background:#000;color:#00ff88;padding:8px;display:block;border-radius:6px"></code><button onclick="copyLink(document.getElementById('buyFreeKeyText').innerText)" style="padding:12px;background:#000;color:#00ff88;border:none;border-radius:30px;width:100%;font-weight:900">COPY</button></div></div>`;
window.doBuyFreeSecure=async function(){
  const name=document.getElementById('buy_name_free').value.trim()||'EmailOnly User'; const email=document.getElementById('buy_email_free').value.trim(); const msg=document.getElementById('buy_free_msg');
  if(!email||!email.includes('@')){msg.innerText='Valid email'; return;} msg.innerText='Collecting...';
  const {data:exists}=await supabaseClient.from('api_keys').select('id, api_key').eq('email',email).limit(1);
  if(exists&&exists.length>0){document.getElementById('buyFreeKeyText').innerText=exists[0].api_key; document.getElementById('buyFreeBox').style.display='block'; msg.innerText='You already get key'; return;}
  const fullKey='mnp_'+Math.random().toString(36).substring(2,10)+Math.random().toString(36).substring(2,10); const keyHash=await hashKeyClient(fullKey);
  await supabaseClient.from('api_keys').insert([{email:email,name:name,api_key:fullKey,key_hash:keyHash,key_prefix:fullKey.substring(0,12),credits_remaining:100,credits_total:100,credits_used:0,is_active:true,payment_ref:'EMAIL-ONLY-FREE'}]);
  document.getElementById('buyFreeKeyText').innerText=fullKey; document.getElementById('buyFreeBox').style.display='block'; msg.innerText='✅ FREE 100 - Email Only Tonight!';
};
}

async function router(){
const path=location.pathname;
if(path==='/user/login'){renderLoginUser(); return;}
if(path==='/admin/login'){renderLoginAdmin(); return;}
if(path==='/buy'){renderBuyPage(); return;}
if(path==='/admin/keys'){renderKeysPage(); return;}
if(path==='/admin/dashboard'){renderAdminDashboard(); return;}
if(path==='/user/dashboard'){renderUserDashboardReal(); return;}
// Auto redirect if already logged in with email only
const easyEmail=localStorage.getItem('easy_email');
if(easyEmail){location.pathname='/user/dashboard'; return;}
const {data:{session}}=await supabaseClient.auth.getSession();
if(session){const {data:prof}=await supabaseClient.from('profiles').select('is_chairman').eq('id',session.user.id).single(); if(prof?.is_chairman){location.pathname='/admin/dashboard';}else{location.pathname='/user/dashboard';}} else {renderLoginUser();}
}
router();
})();
</script>
