<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Main Naija Pidgin English</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:12px 12px 40px;
  background:#080808;color:white;
  font-family:system-ui,Arial,sans-serif
}
.card{
  background:#151515;border:1px solid #333;
  border-radius:16px;padding:18px;margin:12px 0
}
h1,h2,h3{overflow-wrap:anywhere}
input,textarea{
  width:100%;padding:15px;margin:8px 0;
  border:1px solid #444;border-radius:12px;
  background:#242424;color:white;font-size:16px
}
button{
  width:100%;padding:16px;margin:7px 0;
  border:0;border-radius:14px;font-size:16px;
  font-weight:800;cursor:pointer
}
.green{background:#00ee88;color:#000}
.gold{background:#ffd700;color:#000}
.gray{background:#333;color:white}
.red{background:#e53935;color:white}
.small{font-size:13px;color:#ccc}
.textbox{
  background:#222;padding:16px;border-left:5px solid #00ee88;
  border-radius:10px;font-size:18px;line-height:1.7;
  overflow-wrap:anywhere
}
.progress{
  height:14px;background:#333;border-radius:20px;overflow:hidden
}
.fill{height:100%;background:#00ee88}
.header{
  border:2px solid #00ee88;border-radius:16px;
  padding:16px;text-align:center
}
.row{
  padding:14px;background:#222;border-radius:12px;
  margin:10px 0;overflow-wrap:anywhere
}
audio{width:100%;margin-top:10px}
a{color:#00ee88}
.hidden{display:none}
</style>
</head>

<body>
<div id="app" class="card">Loading app...</div>

<script>
/* =========================================
   1. SUPABASE CONNECTION
   Replace the placeholder with your real
   PUBLIC key from the correct Supabase project.
========================================= */

const SUPABASE_URL =
  "https://rupuxvpupdhlhxgjrbsh.supabase.co";

const SUPABASE_KEY =
  "PASTE_YOUR_REAL_PUBLIC_KEY_HERE";

const app = document.getElementById("app");

if (!window.supabase) {
  app.innerHTML = "<h2>Connection library failed to load.</h2>";
  throw new Error("Supabase library failed to load");
}

if (
  !SUPABASE_KEY ||
  SUPABASE_KEY === "PASTE_YOUR_REAL_PUBLIC_KEY_HERE"
) {
  app.innerHTML = `
    <h2>⚙️ Finish Supabase Setup</h2>
    <p>Open Supabase and copy your project's public API key.</p>
    <p>Then replace PASTE_YOUR_REAL_PUBLIC_KEY_HERE in this file.</p>
  `;
  throw new Error("Supabase public API key is missing");
}

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY.trim()
);

/* =========================================
   2. PIDGIN TEXT TASKS
========================================= */

const TEXTS = [
"Abeg make we start today. I wan tell you say this work na important one, and everybody suppose do am well.",
"Today na another beautiful day for this country. Sun dey shine and people dey go about their daily work.",
"Chairman, I don finish the work wey you give me yesterday. Make you check am make you confirm.",
"How you dey? I dey come your side now now. No comot for house, I dey road already.",
"Abeg give me small time, I dey road. Traffic hold me for Lekki but I dey move small small.",
"Omo, this thing sweet die! I never see this kain sweet thing for my life before.",
"No worry, I go sort am now now. Just give me five minutes make I arrange everything.",
"Shey you don chop? Make we go eat for that new buka wey dem open for junction.",
"Wetin dey sup? Abeg no vex for me. I know say I late small but make you no vex.",
"For this Lagos, if you no shine your eye, dem go carry you go where you no know.",
"My brother, hustle must continue. Even if rain fall, we must still dey go.",
"Abeg comot for road, make I pass. I get important meeting for Island by 2pm.",
"Na God hand we dey. Everything wey we dey do, na God dey run am for us.",
"You no fit understand this life if you never waka for street. Street na school.",
"Make we talk true, this Naija Pidgin na sweet language wey everybody dey enjoy.",
"Every day na new story for this town. You go hear something wey go shock you.",
"I wan tell you something wey dey my mind since. I no fit hide am again.",
"As I dey waka for road today, I see one fine girl wey make my head scatter.",
"Work no dey finish, but man must chop. So make we go find food first.",
"Last last, everything go better. Na just time we dey wait for this country."
];

function wordCount(text){
  return text.trim().split(/\s+/).filter(Boolean).length;
}

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function message(text){
  const el = document.getElementById("message");
  if(el) el.textContent = text;
}

/* =========================================
   3. AUTHENTICATION
========================================= */

function loginScreen(admin){
  app.innerHTML = `
    <div class="card" style="border:2px solid ${admin?"gold":"#00ee88"}">
      <h2>${admin?"👑 CHAIRMAN LOGIN":"🎙️ WORKER LOGIN"}</h2>

      <form id="loginForm">
        <input id="email" type="email" placeholder="Email address"
          autocomplete="email" required>

        <input id="password" type="password" placeholder="Password"
          autocomplete="current-password" required>

        ${admin ? "" : `
          <input id="displayName" placeholder="Your name (new workers)">
        `}

        <button class="${admin?"gold":"green"}" type="submit">
          ${admin?"LOGIN AS CHAIRMAN":"LOGIN"}
        </button>
      </form>

      ${admin ? "" : `
        <button class="gray" id="signupButton">SIGN UP AS WORKER</button>
      `}

      <p id="message"></p>
      <p>${admin
        ? 'Worker? <a href="/user/login">Worker Login</a>'
        : 'Chairman? <a href="/admin/login">Chairman Login</a>'}</p>

      <p class="small">Use your registered email and password.</p>
    </div>
  `;

  document.getElementById("loginForm").onsubmit = async e => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message("Checking login...");

    const {data,error} = await db.auth.signInWithPassword({
      email,password
    });

    if(error){
      message("Login failed: " + error.message);
      return;
    }

    await route();
  };

  const signup = document.getElementById("signupButton");

  if(signup){
    signup.onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const displayName =
        document.getElementById("displayName").value.trim();

      if(!email || password.length < 6 || !displayName){
        message("Enter your name, email and a password of at least 6 characters.");
        return;
      }

      message("Creating account...");

      const {data,error} = await db.auth.signUp({
        email,password,
        options:{
          data:{display_name:displayName}
        }
      });

      if(error){
        message("Signup failed: " + error.message);
        return;
      }

      if(data.session){
        message("Account created. Opening your dashboard...");
        await route();
      }else{
        message("Account created. Check your email to confirm it, then log in.");
      }
    };
  }
}

/* =========================================
   4. USER DASHBOARD
========================================= */

let recorder = null;
let chunks = [];
let audioBlob = null;
let audioUrl = null;
let currentText = "";
let currentNumber = 1;
let mediaStream = null;
let saving = false;

async function getMyRecordings(userId){
  const {data,error} = await db
    .from("recordings")
    .select("id,recording_number,pidgin_text,word_count,audio_path,file_name,created_at")
    .eq("user_id",userId)
    .order("recording_number");

  if(error) throw error;
  return data || [];
}

async function userDashboard(session){
  const {data:profile,error:profileError} = await db
    .from("profiles")
    .select("display_name,is_chairman")
    .eq("id",session.user.id)
    .single();

  if(profileError){
    app.innerHTML = `
      <div class="card">
        <h2>Profile setup needed</h2>
        <p>${esc(profileError.message)}</p>
        <p>Check that the profiles table and its policies are configured.</p>
      </div>`;
    return;
  }

  if(profile.is_chairman){
    location.replace("/admin/dashboard");
    return;
  }

  let recordings;

  try{
    recordings = await getMyRecordings(session.user.id);
  }catch(e){
    app.innerHTML = `<div class="card"><h2>Cannot load recordings</h2><p>${esc(e.message)}</p></div>`;
    return;
  }

  const total = recordings.reduce((sum,r)=>sum+(Number(r.word_count)||0),0);
  currentNumber = recordings.length + 1;
  currentText = TEXTS[(currentNumber-1)%TEXTS.length];

  const pct = Math.min(100,total/1000*100);

  app.innerHTML = `
    <div class="header">
      <h2>🎙️ MAIN NAIJA PIDGIN ENGLISH</h2>
      <p>Welcome, ${esc(profile.display_name || session.user.email)}</p>
      <h2>${total} / 1,000 WORDS</h2>
      <div class="progress"><div class="fill" style="width:${pct}%"></div></div>
      <p>${Math.max(0,1000-total)} words remaining</p>
    </div>

    <div class="card">
      <h3>Task ${currentNumber}</h3>
      <div class="textbox">${esc(currentText)}</div>
      <p class="small">${wordCount(currentText)} words in this text</p>

      <button class="green" id="recordButton">🎙️ START RECORDING</button>
      <button class="red hidden" id="stopButton">⏹️ STOP RECORDING</button>

      <div id="preview" class="hidden">
        <audio id="audioPreview" controls></audio>
        <button class="gray" id="againButton">🔄 RECORD AGAIN</button>
        <button class="green" id="saveButton">💾 SAVE RECORDING</button>
      </div>

      <p id="message"></p>
    </div>

    <div class="card">
      <h3>My Account</h3>
      <button class="gray" id="recordingsButton">📁 MY RECORDINGS (${recordings.length})</button>
      <button class="gray" id="logoutButton">LOG OUT</button>
    </div>
  `;

  document.getElementById("recordButton").onclick = startRecording;
  document.getElementById("stopButton").onclick = stopRecording;
  document.getElementById("againButton").onclick = resetRecording;
  document.getElementById("saveButton").onclick = saveRecording;
  document.getElementById("recordingsButton").onclick = () => location.href="/user/recordings";
  document.getElementById("logoutButton").onclick = logout;
}

async function startRecording(){
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error("Microphone recording needs HTTPS and a supported browser.");
    }

    mediaStream = await navigator.mediaDevices.getUserMedia({audio:true});
    chunks = [];
    audioBlob = null;

    recorder = new MediaRecorder(mediaStream);
    recorder.ondataavailable = e => {
      if(e.data.size) chunks.push(e.data);
    };

    recorder.onstop = () => {
      audioBlob = new Blob(chunks,{type:recorder.mimeType || "audio/webm"});

      if(audioUrl) URL.revokeObjectURL(audioUrl);
      audioUrl = URL.createObjectURL(audioBlob);

      document.getElementById("audioPreview").src = audioUrl;
      document.getElementById("preview").classList.remove("hidden");
      document.getElementById("recordButton").classList.add("hidden");
      message("Recording ready. Listen before saving.");
    };

    recorder.start();
    document.getElementById("recordButton").classList.add("hidden");
    document.getElementById("stopButton").classList.remove("hidden");
    message("Recording in progress...");
  }catch(e){
    message("Microphone error: " + e.message);
  }
}

function stopRecording(){
  if(recorder && recorder.state !== "inactive") recorder.stop();

  if(mediaStream){
    mediaStream.getTracks().forEach(track=>track.stop());
    mediaStream = null;
  }

  document.getElementById("stopButton").classList.add("hidden");
}

function resetRecording(){
  if(audioUrl) URL.revokeObjectURL(audioUrl);
  audioUrl = null;
  audioBlob = null;

  document.getElementById("audioPreview").removeAttribute("src");
  document.getElementById("preview").classList.add("hidden");
  document.getElementById("recordButton").classList.remove("hidden");
  message("");
}

async function saveRecording(){
  if(saving) return;

  if(!audioBlob){
    message("Record your voice first.");
    return;
  }

  saving = true;
  const button = document.getElementById("saveButton");
  button.disabled = true;
  button.textContent = "Saving...";

  try{
    const {data:{session}} = await db.auth.getSession();

    if(!session) throw new Error("Please log in again.");

    const userId = session.user.id;
    const filename = `${String(currentNumber).padStart(3,"0")}_pidgin.webm`;
    const path = `${userId}/${crypto.randomUUID()}_${filename}`;

    const {error:uploadError} = await db.storage
      .from("pidgin-recordings")
      .upload(path,audioBlob,{
        contentType:audioBlob.type || "audio/webm",
        upsert:false
      });

    if(uploadError) throw uploadError;

    const {error:insertError} = await db.from("recordings").insert({
      user_id:userId,
      recording_number:currentNumber,
      pidgin_text:currentText,
      word_count:wordCount(currentText),
      audio_path:path,
      file_name:filename
    });

    if(insertError){
      message("Recording uploaded but database save failed: "+insertError.message+
        ". Contact the app administrator before trying again.");
      return;
    }

    message("✅ Recording saved successfully.");
    setTimeout(()=>userDashboard(session),1000);

  }catch(e){
    message("Save failed: "+e.message);
  }finally{
    saving = false;
    const b = document.getElementById("saveButton");
    if(b) {
      b.disabled = false;
      b.textContent = "💾 SAVE RECORDING";
    }
  }
}

/* =========================================
   5. PRIVATE RECORDING PLAYBACK
========================================= */

async function playRecording(path){
  const {data,error} = await db.storage
    .from("pidgin-recordings")
    .createSignedUrl(path,300);

  if(error){
    alert("Cannot open recording: "+error.message);
    return;
  }

  const audio = new Audio(data.signedUrl);
  audio.play().catch(()=>alert("Tap Play again to start audio."));
}

async function userRecordings(session){
  let recordings;

  try{
    recordings = await getMyRecordings(session.user.id);
  }catch(e){
    app.innerHTML = `<div class="card"><h2>Unable to load recordings</h2><p>${esc(e.message)}</p></div>`;
    return;
  }

  app.innerHTML = `
    <div class="card">
      <h2>📁 MY RECORDINGS</h2>
      <button class="gray" id="backButton">⬅️ DASHBOARD</button>
      ${recordings.map(r=>`
        <div class="row">
          <b>${esc(r.file_name)}</b>
          <p>${esc(r.pidgin_text)}</p>
          <p class="small">${r.word_count} words</p>
          <button class="green playButton" data-path="${esc(r.audio_path)}">▶️ PLAY</button>
        </div>
      `).join("") || "<p>No recordings saved yet.</p>"}
      <button class="gray" id="logoutButton">LOG OUT</button>
    </div>
  `;

  document.getElementById("backButton").onclick = () => location.href="/user/dashboard";
  document.getElementById("logoutButton").onclick = logout;

  document.querySelectorAll(".playButton").forEach(button=>{
    button.onclick = () => playRecording(button.dataset.path);
  });
}

/* =========================================
   6. CHAIRMAN DASHBOARD
========================================= */

async function chairmanCheck(session){
  const {data,error} = await db
    .from("profiles")
    .select("is_chairman")
    .eq("id",session.user.id)
    .single();

  if(error) throw error;
  if(!data?.is_chairman) throw new Error("Chairman access only.");
}

async function adminDashboard(session){
  try{
    await chairmanCheck(session);

    const {data:users,error} = await db
      .from("profiles")
      .select("id,email,display_name,total_words,recordings_count,status,created_at")
      .order("display_name");

    if(error) throw error;

    const list = users || [];
    const completed = list.filter(u=>(u.total_words||0)>=1000).length;
    const words = list.reduce((s,u)=>s+(Number(u.total_words)||0),0);

    app.innerHTML = `
      <div class="card" style="border:2px solid gold">
        <h2>👑 CHAIRMAN DASHBOARD</h2>
        <p>Total workers: <b>${list.length}</b></p>
        <p>Completed: <b>${completed}</b></p>
        <p>Total words: <b>${words}</b></p>
        <button class="gold" id="refreshButton">🔄 REFRESH WORKERS</button>
        <button class="gray" id="logoutButton">LOG OUT</button>
      </div>

      <div class="card">
        <h3>Workers</h3>
        ${list.map(u=>`
          <div class="row">
            <b>${esc(u.display_name || "Worker")}</b>
            <p>${esc(u.email)}</p>
            <p>${Number(u.total_words)||0} / 1000 words</p>
            <p>${Number(u.recordings_count)||0} recordings</p>
            <button class="green detailsButton" data-id="${esc(u.id)}">VIEW RECORDINGS</button>
          </div>
        `).join("") || "<p>No workers found.</p>"}
      </div>
    `;

    document.getElementById("refreshButton").onclick = () => adminDashboard(session);
    document.getElementById("logoutButton").onclick = logout;

    document.querySelectorAll(".detailsButton").forEach(b=>{
      b.onclick = () => adminUserRecordings(session,b.dataset.id);
    });

  }catch(e){
    app.innerHTML = `
      <div class="card">
        <h2>⛔ Chairman access unavailable</h2>
        <p>${esc(e.message)}</p>
        <button class="gray" onclick="logout()">LOG OUT</button>
      </div>`;
  }
}

async function adminUserRecordings(session,userId){
  try{
    await chairmanCheck(session);

    const {data:user,error:userError} = await db
      .from("profiles")
      .select("id,email,display_name,total_words")
      .eq("id",userId)
      .single();

    if(userError) throw userError;

    const {data:recs,error:recError} = await db
      .from("recordings")
      .select("id,recording_number,pidgin_text,word_count,audio_path,file_name,created_at")
      .eq("user_id",userId)
      .order("recording_number");

    if(recError) throw recError;

    app.innerHTML = `
      <div class="card">
        <h2>👤 ${esc(user.display_name || user.email)}</h2>
        <p>${esc(user.email)}</p>
        <p>Progress: ${Number(user.total_words)||0} / 1000 words</p>
        <button class="gold" id="backButton">⬅️ ALL WORKERS</button>
      </div>

      <div class="card">
        <h3>Worker recordings</h3>
        ${(recs||[]).map(r=>`
          <div class="row">
            <b>${esc(r.file_name)}</b>
            <p>${esc(r.pidgin_text)}</p>
            <p>${r.word_count} words</p>
            <button class="green playButton" data-path="${esc(r.audio_path)}">▶️ PLAY AUDIO</button>
          </div>
        `).join("") || "<p>No recordings yet.</p>"}
      </div>
    `;

    document.getElementById("backButton").onclick = () => adminDashboard(session);

    document.querySelectorAll(".playButton").forEach(b=>{
      b.onclick = () => playRecording(b.dataset.path);
    });

  }catch(e){
    app.innerHTML = `<div class="card"><h2>Error</h2><p>${esc(e.message)}</p></div>`;
  }
}

/* =========================================
   7. LOGOUT AND ROUTES
========================================= */

async function logout(){
  await db.auth.signOut();
  location.replace("/user/login");
}

async function route(){
  const path = location.pathname;

  if(path === "/admin/login"){
    loginScreen(true);
    return;
  }

  if(path === "/user/login" || path === "/login"){
    loginScreen(false);
    return;
  }

  const {data:{session},error} = await db.auth.getSession();

  if(error || !session){
    location.replace(path.startsWith("/admin")
      ? "/admin/login"
      : "/user/login");
    return;
  }

  if(path.startsWith("/admin/")){
    if(path === "/admin/dashboard"){
      await adminDashboard(session);
    }else{
      await adminDashboard(session);
    }
    return;
  }

  if(path === "/user/recordings"){
    await userRecordings(session);
  }else{
    await userDashboard(session);
  }
}

window.addEventListener("popstate",route);

route().catch(e=>{
  app.innerHTML = `
    <div class="card">
      <h2>Something went wrong</h2>
      <p>${esc(e.message)}</p>
      <button class="gray" onclick="location.reload()">TRY AGAIN</button>
    </div>`;
});
</script>
</body>
</html>
