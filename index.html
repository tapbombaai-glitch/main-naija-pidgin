      <div class="card"><h3>📋 Your Progress - ${(recs||[]).length}/100 - Filter: ${selectedLang}</h3>${(recs||[]).map(r=>`<div style="background:#181818;padding:8px;border-radius:6px;margin:4px 0;display:flex;justify-content:space-between"><span>#${r.recording_number} - ${r.word_count} words - ✅</span><span class="lang-badge ${r.language||'pidgin'}">${(r.language||'pidgin').toUpperCase()}</span></div>`).join('')||'<p>No recording yet - Select language and start! 4 Tribes Ready! ✅</p>'}</div>`;
  }
  window.changeLanguage = function(lang){ setSelectedLang(lang); location.reload(); }

  async function renderAdminDashboard(session){
    const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single();
    if(!profile?.is_chairman){ showChairmanBlockScreen(); return; }
    const {data:users}=await supabaseClient.from('profiles').select('*').order('total_words',{ascending:false});const list=users||[];const totalW=list.reduce((s,u)=>s+(u.total_words||0),0);const completed=list.filter(u=>u.total_words>=1000).length;
    const anns = await fetchAllAnnouncements();
    document.getElementById('app').innerHTML=`
      <div class="card" style="border:3px solid gold;background:#1a1a00"><h2>👑 CHAIRMAN DASHBOARD - 4 TRIBES LIVE! ✅</h2>
      <div class="announce">${anns[0]?.title||'💃 MAIN NAIJA PIDGIN NOW 4 TRIBES TOGETHER!'}<br><small>${anns[0]?.message?.substring(0,200)||'Hausa, Igbo, Yoruba, Pidgin together! Filter ?language=hausa,igbo,yoruba,pidgin'}</small></div>
      <p>Chairman: ${profile?.display_name||'Chairman'} - Users: ${list.length} - Words: ${totalW} - Completed: ${completed} - Announcements: ${anns.length}</p>
      <div class="nav"><button class="btn gold" onclick="location.pathname='/admin/keys'">🔑 Keys - 4 Tribes</button><button class="btn green" onclick="location.pathname='/api/login'">🔑 API Own Link - 4 Tribes Filter</button><button class="btn gray" onclick="copyLink(window.location.origin + '/api/login', 'copyDash')" id="copyDash">📋 COPY API LINK</button><button class="btn gray" onclick="supabaseClient.auth.signOut().then(()=>location.pathname='/admin/login')">🚪 Logout</button></div></div>
      
      <div class="card" style="border:2px solid #00ff88"><h3>📢 CREATE ANNOUNCEMENT - 4 Tribes</h3><input id="annTitle" placeholder="Title e.g. 💃 MAIN NAIJA PIDGIN NOW 4 TRIBES!"><textarea id="annMessage" placeholder="Message: Hausa, Igbo, Yoruba, Pidgin together! Payment ₦5k for 1000 words, FREE 100 once, Filter ?language=hausa,igbo,yoruba,pidgin, CREDIT HAS FINISHED!" rows="4"></textarea><button class="btn green" onclick="createAnnouncement()">🚀 POST ANNOUNCEMENT - All Workers Go See Am!</button><p id="annMsg"></p></div>

      <div class="card"><h3>📢 All Announcements - ${anns.length} - 4 Tribes</h3>${anns.map(a=>`<div class="announce-small"><b>${a.title}</b><br><small>${a.message.substring(0,150)}...</small><br><small>${new Date(a.created_at).toLocaleString()}</small><br><button class="btn gray" style="padding:6px;font-size:11px;margin-top:6px;background:red;color:white" onclick="deleteAnnouncement('${a.id}')">🗑️ DELETE</button></div>`).join('')||'No announcements yet - Create one!'}</div>

      <div class="card"><h3>📊 Users - ${list.length} - 4 Tribes Breakdown</h3>${list.slice(0,20).map((u,i)=>`<div class="user-row"><div><b>${i+1}. ${u.display_name}</b><br><small>${u.email} - ${u.total_words||0}/1000 = ₦${(u.recordings_count||0)*PRICE_PER_RECORDING}</small></div><div>➡️</div></div>`).join('')||'No users'}<button class="btn gray" onclick="location.pathname='/admin/users'">View All Users</button></div>
    `;
  }
  window.createAnnouncement = async function(){
    const title=document.getElementById('annTitle').value.trim();
    const message=document.getElementById('annMessage').value.trim();
    const msgEl=document.getElementById('annMsg');
    if(!title||!message){ msgEl.innerText='Fill title and message!'; return; }
    msgEl.innerText='⏳ Posting...';
    const {error} = await supabaseClient.from('announcements').insert([{title:title, message:message}]);
    if(error){ msgEl.innerText='❌ '+error.message; } else { msgEl.innerText='✅ Announcement posted! All workers go see am!'; setTimeout(()=>location.reload(),1000); }
  }
  window.deleteAnnouncement = async function(id){
    if(!confirm('Delete announcement?')) return;
    await supabaseClient.from('announcements').delete().eq('id',id);
    location.reload();
  }

  (async function boot(){
    try{
      const path=location.pathname;
      if(path==='/api/login' || path==='/api-login'){await renderApiKeyLogin();return;}
      if(path==='/api/dashboard'){renderApiDashboard();return;}
      if(path==='/admin/login'){await renderLoginAdmin();return;}
      if(path==='/user/login'){await renderLoginUser();return;}
      if(path==='/api-docs'){renderApiDocsPage();return;}
      const {data:{session}}=await supabaseClient.auth.getSession();
      if(!session){
        if(path.startsWith('/admin')){location.pathname='/admin/login';return;}
        if(path==='/api/dashboard'){location.pathname='/api/login';return;}
        location.pathname='/user/login';return;
      }
      if(path==='/admin/keys'){await renderKeysPage(session);return;}
      if(path==='/admin/dashboard'){await renderAdminDashboard(session);return;}
      if(path==='/user/dashboard'){await renderUserDashboard(session);return;}
      if(path==='/'||path==='/user'){location.pathname='/user/dashboard';return;}
      if(path==='/admin'){location.pathname='/admin/dashboard';return;}
      location.pathname='/user/dashboard';
    }catch(err){document.getElementById('app').innerHTML='<div class="card"><h2>Error</h2><p>'+err.message+'</p></div>';}
  })();
})();
</script>
</body>
</html>
