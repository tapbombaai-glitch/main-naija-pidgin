        <button style="background:#111;border:2px solid gold;color:#fff;padding:16px;border-radius:14px;text-align:left"><b>${pending}</b><br>Pending - ₦50 each - More Better</button>
        <button style="background:#002b18;border:2px solid #00ff88;color:#fff;padding:16px;border-radius:14px;text-align:left"><b>${approved}</b><br>Approved - Paid ₦${approved*50} - More Better</button>
        <button style="background:#111;border:2px solid #333;color:#fff;padding:16px;border-radius:14px;text-align:left"><b>${allRecs?.length||0}</b><br>Total Recs - More Better</button>
      </div>
      <div id="workersPanel" style="display:none;background:#1a1a1a;padding:12px;border-radius:12px;margin-top:10px;border:2px solid #00ff88">${(users||[]).filter(u=>!u.is_chairman).map(u=>`<div style="background:#222;padding:10px;margin:4px 0;border-radius:8px">👤 ${u.display_name} - ${u.email} - More Better</div>`).join('')||'No workers yet - More Better Tonight!'}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px"><button onclick="location.pathname='/admin/keys'" style="background:gold;color:#000;padding:16px;border:none;border-radius:50px;font-weight:900">Keys BUTTON - More Better</button><button onclick="location.pathname='/buy'" style="background:#00ff88;color:#000;padding:16px;border:none;border-radius:50px;font-weight:900">Buy - More Better</button><button onclick="supabaseClient.auth.signOut().then(()=>{localStorage.clear(); location.pathname='/admin/login'})" style="background:#333;color:#fff;padding:16px;border:none;border-radius:50px;font-weight:900">Logout</button></div>

  window.togglePanel=function(id){const el=document.getElementById(id); el.style.display=el.style.display==='none'?'block':'none';}; window.toggleRec=function(id){const el=document.getElementById('rec-'+id); el.style.display=el.style.display==='none'?'block':'none';}; setTimeout(()=>loadAllSignedVoices(),800);
}

async function renderUserDashboardReal(){
  const user=await getCurrentUser(); 
  if(!user){location.pathname='/user/login'; return;} 
  if(user.profile?.is_chairman){location.pathname='/admin/dashboard'; return;}
  const {data:recs}=await supabaseClient.from('recordings').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
  const records=recs||[];
  const lang=getLang(); 
  const texts=TEXTS_DATA[lang]||TEXTS_DATA.pidgin; 
  const current=texts[records.length % texts.length];

  document.getElementById('app').innerHTML=`
    <div style="background:#111; border:1px solid #00ff88; border-radius:30px; padding:6px; display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
      <small style="color:#888; font-size:10px; padding-left:10px">Your Voice</small>
      <span style="background:#00ff88; color:#000; padding:4px 14px; border-radius:20px; font-weight:900; font-size:13px">${records.length} / 1000</span>
    </div>

    <div style="text-align:center; margin-bottom:8px">
      <small style="color:#00ff88; font-size:11px; background:#111; border:1px solid #333; padding:5px 12px; border-radius:20px">🎙️ Abeg use quiet place, no noise - make admin approve 👍</small>
    </div>

    <div class="card" style="border:2px solid #00ff88; padding:12px">
      <div class="textbox" id="curTxt" style="font-size:18px">${current}</div>
      <button id="readBtn" class="btn green" onclick="startReadRecord()">🎙️ START RECORD</button>
      <button id="stopReadBtn" class="btn red" style="display:none" onclick="stopReadRecord()">⏹️ STOP</button>
      
      <div id="readStatus" style="display:none; background:#000; padding:12px; border-radius:12px; margin-top:12px; border:2px solid gold">
        <p style="text-align:center; margin:5px; font-size:13px">🎧 Check am well - <span id="readTimer">0s</span></p>
        <audio id="readAudioPreview" controls style="width:100%; display:none; margin:10px 0"></audio>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px">
          <button id="deleteReadBtn" class="btn" style="background:#222; color:#ff3b3b; border:2px solid #ff3b3b; display:none" onclick="deleteReadRecord()">🗑️ DELETE & RECORD AGAIN</button>
          <button id="saveReadBtn" class="btn gold" style="display:none" onclick="saveReadRecord()">💾 SAVE</button>
        </div>
        <p id="saveReadMsg" style="text-align:center; margin-top:8px; font-size:12px; font-weight:800"></p>
      </div>
    </div>
    
    <div style="text-align:center; margin-top:10px">
      <small style="color:#555; font-size:10px">${user.email}</small><br>
      <button class="btn gray" style="width:auto; padding:8px 16px; font-size:11px; border-radius:20px; margin-top:6px" onclick="localStorage.clear(); supabaseClient.auth.signOut().then(()=>location.pathname='/user/login')">Logout</button>
    </div>
  `;
}

async function renderKeysPage(){
  const {data:{session}}=await supabaseClient.auth.getSession(); if(!session){location.pathname='/admin/login'; return;}
  const {data:keys}=await supabaseClient.from('api_keys').select('*').order('created_at',{ascending:false});
  document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid gold"><h2>KEYS - More Better - FREE+PAID - Email Only Tonight</h2><button class="btn gold" onclick="location.pathname='/admin/dashboard'">Dashboard - More Better</button></div><div class="card"><h3>All Keys ${keys?.length||0} - More Better - Automatic from Supabase</h3>${(keys||[]).map(k=>`<div style="background:#181818;padding:14px;border-radius:12px;margin:10px 0"><div style="display:flex;justify-content:space-between"><div><b>${k.name}</b><br><small>${k.email} - ${k.key_prefix}...</small></div><small style="background:${!k.is_active?'gold':'#00ff88'};color:#000;padding:4px 8px;border-radius:10px">${!k.is_active?'PENDING':'ACTIVE - '+k.credits_remaining+' - More Better'}</small></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:10px"><button onclick="deductCredit('${k.id}',10)" style="background:#ff8c00;color:#fff;padding:10px;border:none;border-radius:8px">-10 - More Better</button><button onclick="addCredit('${k.id}',100)" style="background:#00ff88;color:#000;padding:10px;border:none;border-radius:8px">+100 - More Better</button><button onclick="resetTo100('${k.id}')" style="background:gold;color:#000;padding:10px;border:none;border-radius:8px">SET 100 - More Better</button><button onclick="deleteKey('${k.id}')" style="background:#000;color:#ff3b3b;border:2px solid #ff3b3b;padding:10px;border-radius:8px">DEL</button></div></div>`).join('')||'No keys - More Better Tonight'}</div>`;
  window.resetTo100=async function(id){await supabaseClient.from('api_keys').update({credits_remaining:100,credits_total:100,credits_used:0}).eq('id',id); location.reload();};
  window.deleteKey=async function(id){if(!confirm('DEL - More Better?'))return; await supabaseClient.from('api_keys').delete().eq('id',id); location.reload();};
}
async function router(){
const path=location.pathname;
if(path==='/user/login'){renderLoginUser(); return;}
if(path==='/admin/login'){renderLoginAdmin(); return;}
if(path==='/buy'){renderBuyPage(); return;}
if(path==='/admin/keys'){renderKeysPage(); return;}
if(path==='/admin/dashboard'){renderAdminDashboard(); return;}
if(path==='/user/dashboard'){renderUserDashboardReal(); return;}
const easyEmail=localStorage.getItem('easy_email'); if(easyEmail){location.pathname='/user/dashboard'; return;}
const {data:{session}}=await supabaseClient.auth.getSession();
if(session){const {data:prof}=await supabaseClient.from('profiles').select('is_chairman').eq('id',session.user.id).single(); if(prof?.is_chairman){location.pathname='/admin/dashboard';}else{location.pathname='/user/dashboard';}} else {renderLoginUser();}
}
router();
})();
</script>
