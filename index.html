<script>
(function(){

var PAYSTACK_PUBLIC_KEY="pk_test_3bd0892e4059268380e4bfb68b93c0d7229eee31";

var PACKAGES={

  '5k':{voices:5000,amount:25000,label:'Popular 5k Credits ₦25k'},
  '10k':{voices:10000,amount:50000,label:'10k Credits ₦50k'}

var currentPackage={packageId:'1k',voices:1000,amount:5000};

function renderBuyPage(){
  document.getElementById('app').innerHTML=
  '<div class="card" style="border:3px solid gold;text-align:center"><h1 style="color:gold;margin:0">🛒 BUY API KEY</h1><p style="font-size:12px;color:#aaa">Agreed Prices - Free 100 ₦0 | 1k ₦5k | 2k ₦10k | Popular 5k ₦25k | 10k ₦50k</p><p style="font-size:11px;color:#0f8">Popular 5k fixed from ₦22k to ₦25k - Server validates in kobo</p></div>'+
  '<div class="card" style="border:3px solid #00ff88"><h3>🆓 FREE - 100 credits ₦0</h3><input id="buy_name_free" placeholder="Name"><input id="buy_email_free" placeholder="Email"><button class="btn green" onclick="doBuyFree()">🆓 Collect Free 100 Credits</button><p id="buy_free_msg"></p><div id="buyFreeBox" style="display:none;background:#fff;color:#000;padding:12px;border-radius:12px"><code id="buyFreeKeyText" style="word-break:break-all;background:#000;color:#0f8;padding:8px;display:block;border-radius:6px"></code></div></div>'+
  '<div class="card" style="border:3px solid gold"><h3>💳 PAID - Agreed Prices</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div style="background:#111;padding:10px;border-radius:10px;text-align:center;border:1px solid #0f8">Starter<br>1,000<br>₦5,000<br><button class="btn green" onclick="buyPublic(\'1k\')">Buy 1k</button></div><div style="background:#111;padding:10px;border-radius:10px;text-align:center;border:1px solid #fff">2,000<br>2,000<br>₦10,000<br><button class="btn gray" onclick="buyPublic(\'2k\')">Buy 2k</button></div><div style="background:#1a1500;padding:10px;border-radius:10px;text-align:center;border:2px solid gold">Popular<br>5,000<br>₦25,000<br><button class="btn gold" onclick="buyPublic(\'5k\')">Buy 5k Popular</button></div><div style="background:#001a33;padding:10px;border-radius:10px;text-align:center;border:1px solid #0af">10,000<br>10,000<br>₦50,000<br><button class="btn blue" onclick="buyPublic(\'10k\')">Buy 10k</button></div></div><input id="buy_name_paid" placeholder="Name" style="margin-top:10px"><input id="buy_email_paid" placeholder="Email"><div id="buyPayBox" style="display:none;background:#000;padding:12px;border-radius:12px;border:2px dashed gold;margin-top:10px"><h3 id="buyPayTitle">Ready</h3><button class="btn green" onclick="payPublic()">💳 Pay with Paystack</button><p id="buy_paid_msg"></p><div id="buyPaidBox" style="display:none;background:#0f8;color:#000;padding:12px;border-radius:12px"><code id="buyPaidKeyText" style="word-break:break-all;background:#000;color:#0f8;padding:8px;display:block;border-radius:6px"></code><div id="buyPaidInfo" style="background:#000;color:#0f8;padding:8px;border-radius:6px;margin-top:6px"></div></div></div></div>'+
  '<div class="card"><a class="btn gold" href="/api/login">Go API Login</a><a class="btn gray" href="/user/login">Worker Login</a><a class="btn gray" href="/admin/login">Chairman Login - tapbomba.ai@gmail.com</a></div>';
}
function renderApiKeyLogin(){
  document.getElementById('app').innerHTML='<div class="card" style="border:2px solid #0f8"><h2>🔑 API LOGIN</h2><input id="apiKeyInput" placeholder="mnp_..."><button class="btn green" onclick="doApiKeyLogin()">LOGIN</button><p id="apiLoginMsg" style="background:#000;padding:10px;border-radius:8px;margin-top:8px;min-height:30px"></p><a class="btn gold" href="/buy">Go /buy - Get Key</a></div>';
}
function renderLoginUser(){
  document.getElementById('app').innerHTML='<div class="card" style="border:2px solid #0f8"><h2>🎙️ WORKER LOGIN</h2><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="btn green" onclick="doLogin(\'user\')">LOGIN</button><p id="msg"></p><a class="btn gold" href="/buy">Go /buy</a></div>';
}
function renderLoginAdmin(){
  document.getElementById('app').innerHTML='<div class="card" style="border:2px solid gold"><h2>👑 CHAIRMAN LOGIN - '+CHAIRMAN_EMAIL+'</h2><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="btn gold" onclick="doLogin(\'admin\')">LOGIN AS CHAIRMAN</button><p id="msg"></p></div>';
}
window.buyPublic=function(pid){
  var pkg=PACKAGES[pid];
  if(!pkg||pkg.amount===0){alert('Use free button');return;}
  currentPackage={packageId:pid,voices:pkg.voices,amount:pkg.amount};
  document.getElementById('buyPayBox').style.display='block';
  document.getElementById('buyPayTitle').innerText=pkg.label+' - Pay ₦'+pkg.amount.toLocaleString();
  document.getElementById('buyPayBox').scrollIntoView({behavior:'smooth'});
};
window.doBuyFree=async function(){
  var nameEl=document.getElementById('buy_name_free');
  var emailEl=document.getElementById('buy_email_free');
  var name=nameEl? nameEl.value.trim() : 'Free User';
  var email=emailEl? emailEl.value.trim() : '';
  var msg=document.getElementById('buy_free_msg');
  msg.innerText='Collecting Free 100...';
  try{
    var res=await fetch('/api/free/collect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,email:email})});
    var text=await res.text();
    var data;
    try{ data=JSON.parse(text); }catch(e){ msg.innerText='❌ Backend returned HTML not JSON - File api/free/collect.js not deployed. Got: '+text.substring(0,120); return; }
    if(!res.ok) throw new Error(data.error||'Failed');
    document.getElementById('buyFreeKeyText').innerText=data.full_key;
    document.getElementById('buyFreeBox').style.display='block';
    msg.innerText='✅ 100 credits created!';
  }catch(e){ msg.innerText='❌ '+e.message; }
};
window.payPublic=function(){
  var emailEl=document.getElementById('buy_email_paid');
  var email=emailEl? emailEl.value.trim() : '';
  if(!email||email.indexOf('@')===-1){ email=prompt('Enter email:')||''; }
  if(!email||email.indexOf('@')===-1){ alert('Valid email required'); return; }
  var pkg=PACKAGES[currentPackage.packageId];
  if(!pkg){ alert('Select package first'); return; }
  var msg=document.getElementById('buy_paid_msg');
  msg.innerText='Opening Paystack ₦'+pkg.amount+'...';
  try{
    var handler=PaystackPop.setup({
      key:PAYSTACK_PUBLIC_KEY,email:email,amount:pkg.amount*100,currency:'NGN',
      ref:'SECURE_'+currentPackage.packageId+'_'+Date.now(),
      callback:function(res){
        msg.innerText='Payment OK! Verifying backend validates ₦'+pkg.amount+' in kobo...';
        fetch('/api/paystack/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:res.reference,email:email,name:document.getElementById('buy_name_paid').value.trim()||'Paid User',packageId:currentPackage.packageId})})
        .then(function(r){ return r.text().then(function(t){ var d; try{ d=JSON.parse(t); }catch(e){ throw new Error('Backend returned HTML not JSON - File api/paystack/verify.js not deployed'); } if(!r.ok) throw new Error(d.error||'Verify failed'); return d; }); })
        .then(function(vd){
          document.getElementById('buyPaidKeyText').innerText=vd.full_key;
          document.getElementById('buyPaidInfo').innerText=vd.package+' - '+vd.credits+' credits - ₦'+vd.amount_naira;
          document.getElementById('buyPaidBox').style.display='block';
          msg.innerText='✅ Verified! Pending Chairman '+CHAIRMAN_EMAIL;
        }).catch(function(e){ msg.innerText='❌ Verify fail: '+e.message; });
      },
      onClose:function(){ msg.innerText='Paystack closed'; }
    });
    handler.openIframe();
  }catch(e){ msg.innerText='❌ '+e.message; }
};
window.doApiKeyLogin=async function(){
  var rawEl=document.getElementById('apiKeyInput');
  var raw=rawEl? rawEl.value.trim() : '';
  var msg=document.getElementById('apiLoginMsg');
  if(!raw){ msg.innerText='Enter key'; return; }
  msg.innerText='Checking via /api/api-key/login ...';
  try{
    var res=await fetch('/api/api-key/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiKey:raw})});
    var text=await res.text();
    var data;
    try{ data=JSON.parse(text); }catch(e){ msg.innerText='❌ Backend returned HTML not JSON - File api/api-key/login.js not deployed. Preview: '+text.substring(0,150); return; }
    if(!res.ok||!data.success){ msg.innerText='❌ '+(data.error||'Invalid'); return; }
    localStorage.setItem('api_key',raw);
    localStorage.setItem('api_key_prefix',raw.substring(0,18));
    msg.innerText='✅ '+data.message+' Credits:'+data.credits_remaining+' Going dashboard...';
    setTimeout(function(){ location.pathname='/api/dashboard'; },800);
  }catch(e){ msg.innerText='❌ '+e.message; }
};
window.doLogin=async function(type){
  var eEl=document.getElementById('email');
  var pEl=document.getElementById('pass');
  var e=eEl? eEl.value.trim() : '';
  var p=pEl? pEl.value : '';
  var msg=document.getElementById('msg');
  if(!e||!p){ msg.innerText='Fill email and password'; return; }
  msg.innerText='Checking...';
  try{
    var result=await supabaseClient.auth.signInWithPassword({email:e,password:p});
    if(result.error){ msg.innerText=result.error.message; return; }
    var sess=await supabaseClient.auth.getSession();
    var session=sess.data.session;
    if(!session){ msg.innerText='No session'; return; }
    var profRes=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single();
    var prof=profRes.data;
    if(!prof){
      var np={id:session.user.id,email:e,display_name:e.split('@')[0],total_words:0,recordings_count:0,status:'not_started',is_chairman:false};
      var ins=await supabaseClient.from('profiles').insert([np]);
      if(ins.error){ msg.innerText='Profile error: '+ins.error.message; return; }
      prof=np;
    }
    if(type==='admin'){
      if(prof.email!==CHAIRMAN_EMAIL||!prof.is_chairman){ document.getElementById('app').innerHTML='<h1>🚫 BLOCKED - Only '+CHAIRMAN_EMAIL+'</h1>'; return; }
      location.href='/admin/dashboard';
    }else{
      location.href='/user/dashboard';
    }
  }catch(err){ msg.innerText='❌ '+err.message; }
};
async function renderApiDashboard(){
  var rawKey=localStorage.getItem('api_key')||'';
  if(!rawKey){ document.getElementById('app').innerHTML='<div class="card"><h3>No key - Go /buy</h3><a class="btn gold" href="/buy">Go Buy</a></div>'; return; }
  document.getElementById('app').innerHTML='<div class="card"><h3>Checking backend...</h3><p>Key: '+rawKey.substring(0,18)+'...</p><p id="apiCheckMsg">Loading...</p></div>';
  try{
    var res=await fetch('/api/api-key/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiKey:rawKey})});
    var text=await res.text();
    var result;
    try{ result=JSON.parse(text); }catch(e){ document.getElementById('app').innerHTML='<div class="card" style="border:2px solid #f33"><h3>❌ Backend returned HTML not JSON</h3><p>File api/api-key/login.js not deployed or vercel.json still exists</p><p style="font-size:10px;background:#000;padding:8px;word-break:break-all">'+text.substring(0,300)+'</p><button class="btn gray" onclick="localStorage.clear();location.pathname=\'/api/login\'">Clear & Login Again</button></div>'; return; }
    if(!res.ok||!result.success){ document.getElementById('app').innerHTML='<div class="card"><h3>❌ '+(result.error||'Key not found')+'</h3><button class="btn gray" onclick="localStorage.clear();location.pathname=\'/api/login\'">Clear & Login Again</button></div>'; return; }
    var key=result.key;
    if(!key.is_active){ document.getElementById('app').innerHTML='<div class="card" style="border:2px solid gold"><h3>⏳ PENDING APPROVAL - Chairman '+CHAIRMAN_EMAIL+' must approve</h3><p>'+key.name+' - '+key.credits_remaining+' credits</p><button class="btn gray" onclick="localStorage.clear();location.pathname=\'/api/login\'">Logout</button></div>'; return; }
    document.getElementById('app').innerHTML='<div class="card" style="border:2px solid #0f8"><h2>🔑 DASHBOARD - '+key.credits_remaining+' LEFT</h2><p>'+key.name+' - '+key.key_prefix+'</p><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div style="background:#0f8;color:#000;padding:12px;border-radius:10px;text-align:center"><b>'+key.credits_remaining+'</b><br>LEFT</div><div style="background:#222;padding:12px;border-radius:10px;text-align:center"><b>'+key.credits_used+'</b><br>USED</div><div style="background:gold;color:#000;padding:12px;border-radius:10px;text-align:center"><b>'+key.credits_total+'</b><br>TOTAL</div></div><p>API: '+API_ENDPOINT+'</p><button class="btn gray" onclick="localStorage.clear();location.pathname=\'/buy\'">Logout</button></div>';
  }catch(e){ document.getElementById('app').innerHTML='<div class="card"><h3>❌ '+e.message+'</h3><button class="btn gray" onclick="localStorage.clear();location.pathname=\'/api/login\'">Clear & Login Again</button></div>'; }
}
async function router(){
  try{
    var path=location.pathname;
    console.log('Router path:',path);
    if(path.indexOf('/buy')!==-1||path==='/'||path===''){ renderBuyPage(); return; }
    if(path.indexOf('/api/login')!==-1){ renderApiKeyLogin(); return; }
    if(path.indexOf('/api/dashboard')!==-1){ await renderApiDashboard(); return; }
    if(path.indexOf('/user/login')!==-1){ renderLoginUser(); return; }
    if(path.indexOf('/admin/login')!==-1){ renderLoginAdmin(); return; }
    if(path.indexOf('/admin/dashboard')!==-1||path.indexOf('/user/dashboard')!==-1){
      var sessCheck=await supabaseClient.auth.getSession();
      if(!sessCheck.data.session){ location.pathname='/user/login'; return; }
      document.getElementById('app').innerHTML='<div class="card"><h3>Dashboard - Session OK for '+sessCheck.data.session.user.email+'</h3><p>Go <a href="/buy" style="color:gold">/buy</a> | <a href="/api/login" style="color:#0f8">/api/login</a></p></div>';
      return;
    }
    renderBuyPage();
  }catch(err){
    console.error('Router error',err);
    document.getElementById('app').innerHTML='<div class="card" style="border:2px solid #f33"><h3>❌ Router error - '+err.message+'</h3><p>Check console</p><a class="btn gold" href="/buy">Go /buy</a></div>';
  }
}
router();
})();
</script>
