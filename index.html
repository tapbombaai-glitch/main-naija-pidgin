async function doGenFreeWorker(){const n=document.getElementById('kf').value||'Free Key';document.getElementById('fm').innerText='Generating...';try{const raw=genFree();const hash=await hashKeyClient(raw);const pre=raw.substring(0,18);const {data:{session}}=await supabaseClient.auth.getSession();await supabaseClient.from('api_keys').insert([{user_id:session.user.id,name:n,key_hash:hash,key_prefix:pre,is_active:true}]);document.getElementById('ft').innerText=raw;document.getElementById('fb').style.display='block';document.getElementById('fm').innerText='✅ Free Key! Copy + Download! Reloading...';setTimeout(()=>location.reload(),2000);}catch(e){document.getElementById('fm').innerText='❌ '+e.message;}}
function downloadFreeW(){const t=document.getElementById('ft').innerText;const b=new Blob([t],{type:'text/plain'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='sk_free_key.txt';a.click();}
window.doGenFreeWorker=doGenFreeWorker;window.downloadFreeW=downloadFreeW;
async function renderClientDash(session){
const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single();
if(profile?.is_chairman){location.pathname='/chairman/dashboard';return;}
const {data:keys}=await supabaseClient.from('api_keys').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false});
const myLive=(keys||[]).filter(k=>k.key_prefix?.startsWith('sk_live_'));
document.getElementById('app').innerHTML=`
<div class="card" style="border:2px solid #3b82f6"><h2>💰 PAID CLIENT - Email Login Done! Now Card Number Flow!</h2><div class="price-banner">You get ${myLive.length} paid keys - ₦${myLive.length*5000}</div><div class="nav"><button class="btn blue" onclick="location.pathname='/client/dashboard'">Dashboard</button><button class="btn gold" onclick="document.getElementById('buyBox').style.display='block'">Buy New ₦5,000</button><button class="btn gray" onclick="location.pathname='/'">Home</button></div>
<div class="step">✅ Email login done! Now you see Paid option!</div>
</div>
<div class="card" id="buyBox" style="border:3px solid gold;background:#1a1a00"><h3>💰 PAID - Key Name + Email + Card Number + Amount + Pay + Download!</h3>
<div class="white-box">
<label>Step 1: Key Name - Put key name once you click Paid!</label>
<input id="kpc" placeholder="Type key name e.g. Bomber" value="Bomber">
<label>Step 2: Email - Must put email before card!</label>
<input id="client_email_paid" type="email" placeholder="Email e.g. bomber@gmail.com" value="bomber@gmail.com">
<label>Step 3: Amount - ₦5,000</label>
<input value="₦5,000" disabled style="background:#eee">
<button class="btn gold" style="background:black;color:gold;border:3px solid gold;font-size:18px" onclick="payClient()">💳 Click to Receive Key - Card Number Form Go Open! - Feed Card Number → Amount → Pay → Download!</button>
<p id="pmc" style="color:gold"></p>
<div id="pbc" style="display:none;background:#00ff88;color:black;padding:15px;border-radius:10px;word-break:break-all;margin-top:15px"><b>Your sk_live_ Key:</b><br><code id="ptc"></code><br><br><button class="btn gold" style="background:black;color:gold" onclick="navigator.clipboard.writeText(document.getElementById('ptc').innerText).then(()=>alert('Copied!'))">Copy</button><button class="btn gold" style="background:white;color:black" onclick="downloadPaidC()">Download .txt</button></div>
</div></div>
<div class="card"><h3>Your Paid Keys - Download!</h3>${myLive.map(k=>`<div class="card" style="background:#0a0f2e"><b>${k.name}</b><br>${k.key_prefix}...<br>${new Date(k.created_at).toLocaleString()}</div>`).join('')||'<p>No paid keys yet</p>'}</div>`;
}
async function payClient(){
  const nameInput = document.getElementById('kpc')?.value.trim() || '';
  const emailInput = document.getElementById('client_email_paid')?.value.trim() || '';
  if(!nameInput){alert('Put Key Name!'); return;}
  if(!emailInput || !emailInput.includes('@')){alert('Put Email before card number!'); return;}
  try{
    if(typeof PaystackPop === 'undefined') throw new Error("Paystack never load");
    const h=PaystackPop.setup({key:PAYSTACK_PUBLIC_KEY,email:emailInput,amount:500000,currency:'NGN',ref:'Pidgin_Client_'+Date.now(),callback:async function(r){alert("✅ Paid ₦5,000! Card number accepted! Ref: "+r.reference);try{const raw=genPaid();const hash=await hashKeyClient(raw);const pre=raw.substring(0,18);const {data:{session}}=await supabaseClient.auth.getSession();await supabaseClient.from('api_keys').insert([{user_id:session.user.id,name:nameInput,key_hash:hash,key_prefix:pre,is_active:true,payment_ref:r.reference}]);document.getElementById('ptc').innerText=raw;document.getElementById('pbc').style.display='block';document.getElementById('pmc').innerText='✅ Paid! Key generated! Download .txt file! Reloading...';setTimeout(()=>location.reload(),2000);}catch(e){document.getElementById('pmc').innerText='❌ '+e.message;}},onClose:function(){alert('Card form closed');}});h.openIframe();
  }catch(e){alert("❌ "+e.message+" - Fallback generating!"); const raw=genPaid();const hash=await hashKeyClient(raw);const pre=raw.substring(0,18);const {data:{session}}=await supabaseClient.auth.getSession();await supabaseClient.from('api_keys').insert([{user_id:session.user.id,name:nameInput,key_hash:hash,key_prefix:pre,is_active:true,payment_ref:"fallback"}]);document.getElementById('ptc').innerText=raw;document.getElementById('pbc').style.display='block';}
}
function downloadPaidC(){const t=document.getElementById('ptc').innerText;const b=new Blob([t],{type:'text/plain'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='sk_live_key.txt';a.click();}
window.payClient=payClient;window.downloadPaidC=downloadPaidC;
(async function boot(){
try{
const path=location.pathname;
if(path==='/'||path==='/index.html'||path==='/home'){renderLanding();return;}
if(path==='/chairman/login'||path==='/admin/login'){await renderLoginAdmin();return;}
if(path==='/worker/login'||path==='/user/login'){await renderLoginWorker();return;}
if(path==='/client/login'){await renderLoginClient();return;}
const {data:{session}}=await supabaseClient.auth.getSession();
if(!session){
if(path.startsWith('/chairman')||path.startsWith('/admin')){location.pathname='/chairman/login';return;}
if(path.startsWith('/worker')){location.pathname='/worker/login';return;}
if(path.startsWith('/client')){location.pathname='/client/login';return;}
renderLanding();return;
}
if(path==='/chairman/keys'||path==='/admin/keys'){await renderKeysPage(session);return;}
if(path==='/chairman/dashboard'||path==='/admin/dashboard'){await renderChairmanDashboard(session);return;}
if(path==='/worker/dashboard'||path==='/user/dashboard'){await renderWorkerDash(session);return;}
if(path==='/worker/keys'){await renderWorkerKeys(session);return;}
if(path==='/client/dashboard'){await renderClientDash(session);return;}
renderLanding();
}catch(err){document.getElementById('app').innerHTML='<div class="card"><h2>Error</h2><p>'+err.message+'</p><button class="btn gray" onclick="location.pathname=\'/\'">Home</button></div>';}
})();
})();
</script></body></html>
