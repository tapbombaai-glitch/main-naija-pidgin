/* ========== CLEAN VOICE ENGINE ==========
   Noise reduction + AGC + clarity EQ + compression + limiter + silence trim.
   Natural Pidgin voice. Only cleaned audio is played and uploaded.
*/
async function cleanVoice(inputBlob){
  try{
    const arrayBuffer=await inputBlob.arrayBuffer();
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    const ctx=new AudioCtx();
    let decoded;
    try{decoded=await ctx.decodeAudioData(arrayBuffer.slice(0));}
    catch(e){await ctx.close();return inputBlob;}

    const ch=decoded.numberOfChannels;
    const len=decoded.length;
    const sr=decoded.sampleRate;
    const mono=new Float32Array(len);
    if(ch===1){mono.set(decoded.getChannelData(0));}
    else{
      for(let i=0;i<len;i++){
        let s=0;for(let c=0;c<ch;c++)s+=decoded.getChannelData(c)[i];
        mono[i]=s/ch;
      }
    }

    // 1. High-pass \~80 Hz
    (function highPass(samples,sampleRate,cutoff){
      const rc=1/(2*Math.PI*cutoff),dt=1/sampleRate,a=rc/(rc+dt);
      let prevIn=0,prevOut=0;
      for(let i=0;i<samples.length;i++){
        const x=samples[i];
        const y=a*(prevOut+x-prevIn);
        samples[i]=y;prevIn=x;prevOut=y;
      }
    })(mono,sr,80);

    // 2. Soft noise gate
    (function softGate(samples,thr){
      const floor=thr*0.25;
      for(let i=0;i<samples.length;i++){
        const a=Math.abs(samples[i]);
        if(a<thr){
          const t=a/thr;
          samples[i]*=Math.max(t*t,floor/(thr||1e-6));
        }
      }
    })(mono,0.010);

    // 3. Speech presence boost
    (function speechEQ(samples,sampleRate){
      const hpC=1800,lpC=3500,boost=1.45;
      const rcHp=1/(2*Math.PI*hpC),dt=1/sampleRate,aHp=rcHp/(rcHp+dt);
      const rcLp=1/(2*Math.PI*lpC),aLp=dt/(rcLp+dt);
      let prevIn=0,prevHp=0,prevLp=0;
      for(let i=0;i<samples.length;i++){
        const x=samples[i];
        const hp=aHp*(prevHp+x-prevIn);prevIn=x;prevHp=hp;
        const lp=prevLp+aLp*(x-prevLp);prevLp=lp;
        samples[i]=x+(hp-lp*0.35)*(boost-1)+lp*0.04;
      }
    })(mono,sr);

    // 4. Soft compressor + makeup gain
    (function compress(samples){
      const threshold=0.28,ratio=4,attack=0.012,release=0.09;
      let env=0;
      const atk=Math.exp(-1/(attack*48000)),rel=Math.exp(-1/(release*48000));
      for(let i=0;i<samples.length;i++){
        const input=Math.abs(samples[i]);
        if(input>env)env=atk*env+(1-atk)*input;
        else env=rel*env+(1-rel)*input;
        let gain=1;
        if(env>threshold){
          const over=env-threshold;
          const knee=threshold*0.35;
          let gr;
          if(over<knee){const x=over/knee;gr=((1/ratio-1)*x*x*0.5)*over;}
          else gr=(1/ratio-1)*(over-knee*0.5);
          gain=Math.max(0.18,Math.min(1,(threshold+over+gr)/(env||1e-9)));
        }
        samples[i]*=gain;
      }
      let sum=0,count=0;
      for(let i=0;i<samples.length;i++){
        const a=Math.abs(samples[i]);
        if(a>0.012){sum+=a;count++;}
      }
      if(count>0){
        const avg=sum/count;
        const makeup=Math.min(4.5,Math.max(1.0,0.22/(avg||0.01)));
        for(let i=0;i<samples.length;i++)samples[i]*=makeup;
      }
    })(mono);

    // 5. Soft limiter
    (function limiter(samples,ceiling){
      const knee=0.07;
      for(let i=0;i<samples.length;i++){
        let s=samples[i];const a=Math.abs(s);
        if(a>ceiling-knee){
          const sign=s>=0?1:-1;
          if(a>=ceiling)s=sign*ceiling;
          else{
            const t=(a-(ceiling-knee))/knee;
            s=sign*Math.min(ceiling-knee+knee*(1-Math.exp(-t*2.2)),ceiling);
          }
        }
        samples[i]=s;
      }
    })(mono,0.96);

    // 6. Normalize peak
    (function normalize(samples,target){
      let peak=0;
      for(let i=0;i<samples.length;i++){const a=Math.abs(samples[i]);if(a>peak)peak=a;}
      if(peak<1e-6)return;
      const g=Math.min(target/peak,7);
      for(let i=0;i<samples.length;i++)samples[i]*=g;
    })(mono,0.88);

    // 7. Trim silence
    const trimmed=(function trim(samples,sampleRate,thr,padSec){
      const pad=Math.floor(padSec*sampleRate);
      let start=0,end=samples.length-1;
      while(start<samples.length&&Math.abs(samples[start])<thr)start++;
      while(end>start&&Math.abs(samples[end])<thr)end--;
      start=Math.max(0,start-pad);
      end=Math.min(samples.length-1,end+pad);
      if(end<=start)return samples.slice(0,Math.min(samples.length,sampleRate));
      return samples.slice(start,end+1);
    })(mono,sr,0.016,0.12);

    const wav=encodeWav(trimmed,sr);
    await ctx.close();
    return wav;
  }catch(e){
    console.warn('Clean voice fallback:',e);
    return inputBlob;
  }
}

function encodeWav(samples,sampleRate){
  const numChannels=1,bitsPerSample=16;
  const blockAlign=(numChannels*bitsPerSample)/8;
  const byteRate=sampleRate*blockAlign;
  const dataSize=samples.length*blockAlign;
  const buffer=new ArrayBuffer(44+dataSize);
  const view=new DataView(buffer);
  function ws(o,s){for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));}
  ws(0,'RIFF');view.setUint32(4,36+dataSize,true);ws(8,'WAVE');ws(12,'fmt ');
  view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,numChannels,true);
  view.setUint32(24,sampleRate,true);view.setUint32(28,byteRate,true);
  view.setUint16(32,blockAlign,true);view.setUint16(34,bitsPerSample,true);
  ws(36,'data');view.setUint32(40,dataSize,true);
  let off=44;
  for(let i=0;i<samples.length;i++){
    const s=Math.max(-1,Math.min(1,samples[i]));
    view.setInt16(off,s<0?s*0x8000:s*0x7fff,true);off+=2;
  }
  return new Blob([buffer],{type:'audio/wav'});
}

async function startR(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true,
        channelCount:{ideal:1},
        sampleRate:{ideal:48000}
      }
    });
    userState.chunks=[];
    const mimeType=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t));
    userState.recorder=mimeType
      ? new MediaRecorder(stream,{mimeType,audioBitsPerSecond:128000})
      : new MediaRecorder(stream);
    userState.recorder.ondataavailable=e=>{if(e.data.size>0)userState.chunks.push(e.data);};
    userState.recorder.onstop=async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      const rawBlob=new Blob(userState.chunks,{type:userState.recorder.mimeType||'audio/webm'});
      if(rawBlob.size===0){
        alert('No audio captured. Try again.');
        startB.style.display='block';
        stopB.style.display='none';
        return;
      }
      const statusEl=document.getElementById('cleanStatus');
      statusEl.style.display='block';
      statusEl.innerHTML=`<div class="clean-badge processing">⏳ Cleaning voice… noise reduction, loud & clear</div>`;
      startB.style.display='none';
      stopB.style.display='none';

      const cleaned=await cleanVoice(rawBlob);
      userState.blob=cleaned;
      if(userState.url)URL.revokeObjectURL(userState.url);
      userState.url=URL.createObjectURL(cleaned);

      statusEl.style.display='none';
      document.getElementById('prev').style.display='block';
      aud.src=userState.url;
      aud.load();
    };
    userState.recorder.start(1000);
    startB.style.display='none';
    stopB.style.display='block';
    userState._stream=stream;
  }catch(e){
    const msg=e.name==='NotAllowedError'
      ? 'Allow microphone permission, then try again.'
      : 'Allow microphone: '+e.message;
    alert(msg);
  }
}

function stopR(){
  if(userState.recorder&&userState.recorder.state==='recording'){
    userState.recorder.stop();
  }
  if(userState._stream){
    userState._stream.getTracks().forEach(t=>t.stop());
  }
}

function playP(){aud.play();}

function again(){
  document.getElementById('prev').style.display='none';
  document.getElementById('cleanStatus').style.display='none';
  startB.style.display='block';
  if(userState.url){URL.revokeObjectURL(userState.url);userState.url=null;}
  userState.blob=null;
}

async function saveR(){
  saveB.disabled=true;
  saveB.innerText='Uploading...';
  const text=document.querySelector('.textbox').innerText;
  const wc=countW(text);
  const {data:{session}}=await supabaseClient.auth.getSession();
  const num=userState.list.length+1;
  const isWav=userState.blob&&userState.blob.type&&userState.blob.type.includes('wav');
  const fname=`\( {String(num).padStart(3,'0')}_pidgin_recording. \){isWav?'wav':'webm'}`;
  const path=`\( {session.user.id}/ \){fname}`;
  try{
    const {error:upErr}=await supabaseClient.storage.from('pidgin-recordings').upload(path,userState.blob,{
      contentType:isWav?'audio/wav':'audio/webm',
      upsert:false
    });
    if(upErr)throw upErr;
    const {data:urlD}=supabaseClient.storage.from('pidgin-recordings').getPublicUrl(path);
    const {error:dbErr}=await supabaseClient.from('recordings').insert([{
      user_id:session.user.id,
      recording_number:num,
      pidgin_text:text,
      word_count:wc,
      audio_path:path,
      audio_url:urlD.publicUrl,
      file_name:fname
    }]);
    if(dbErr)throw dbErr;
    await supabaseClient.from('profiles').update({
      total_words:userState.total+wc,
      recordings_count:num,
      status:userState.total+wc>=1000?'completed':'recording'
    }).eq('id',session.user.id);
    smsg.innerText='✅ SAVED (cleaned voice)!';
    nextB.style.display='block';
    document.getElementById('prev').style.display='none';
    setTimeout(()=>location.reload(),1200);
  }catch(e){
    smsg.innerText='❌ '+e.message;
    saveB.disabled=false;
    saveB.innerText='💾 SAVE';
  }
}

async function downloadMine(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  const {data:recs}=await supabaseClient.from('recordings').select('*').eq('user_id',session.user.id);
  const zip=new JSZip();
  const folder=zip.folder('my_recordings');
  let trans='';
  for(const r of recs){
    trans+=`${r.file_name} | ${r.word_count} | ${r.pidgin_text}\n`;
    const b=await fetch(r.audio_url).then(rr=>rr.blob());
    folder.file(r.file_name,b);
  }
  folder.file('transcript.txt',trans);
  const blob=await zip.generateAsync({type:'blob'});
  const u=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=u;a.download='MY_RECORDINGS.zip';a.click();
}

    <button class="btn gold" onclick="location.pathname='/admin/dashboard'">Dashboard</button>
    <button class="btn gray" onclick="location.pathname='/admin/users'">All Users</button>
    <button class="btn gray" onclick="supabaseClient.auth.signOut().then(()=>location.pathname='/admin/login')">Logout</button>
  </div>
</div>
<div class="card">
  <h3>Recent Users</h3>
  \( {users.slice(0,5).map(u=>`<div class="user-row" onclick="location.pathname='/admin/users/ \){u.id}'"><div><b>\( {u.display_name}</b><br><small> \){u.email}<br>${u.total_words||0}/1000 ${u.total_words>=1000?'✅':''}</small></div><div>➡️</div></div>`).join('')}
  <button class="btn gray" onclick="location.pathname='/admin/users'">View All Users</button>
</div>
<div id="userDetail"></div>`;
}

async function renderAdminUsers(session){
  const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single();
  if(!profile?.is_chairman){
    document.getElementById('app').innerHTML='<div class="card"><h2>⛔ ACCESS DENIED</h2></div>';
    return;
  }
  const {data:users}=await supabaseClient.from('profiles').select('*').order('total_words',{ascending:false});
  document.getElementById('app').innerHTML=`
<div class="card">
  <h2>👥 ALL USERS - ${users.length}</h2>
  <div class="nav">
    <button class="btn gold" onclick="location.pathname='/admin/dashboard'">Dashboard</button>
    <button class="btn gray" onclick="location.pathname='/admin/users'">Refresh</button>
    <button class="btn gray" onclick="supabaseClient.auth.signOut().then(()=>location.pathname='/admin/login')">Logout</button>
  </div>
  \( {users.map((u,i)=>`<div class="user-row" onclick="location.pathname='/admin/users/ \){u.id}'"><div><b>${i+1}. \( {u.display_name}</b><br><small> \){u.email}</small><br><small>${u.total_words||0} / 1000 ${u.total_words>=1000?'✅':u.total_words>0?'🎙️':'⚪'} | ${u.recordings_count||0} recs | ${u.status}</small></div><div>➡️</div></div>`).join('')}
</div>`;
}

async function renderAdminUserDetail(session,uid){
  const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single();
  if(!profile?.is_chairman){
    document.getElementById('app').innerHTML='<div class="card"><h2>⛔ ACCESS DENIED</h2></div>';
    return;
  }
  const {data:user}=await supabaseClient.from('profiles').select('*').eq('id',uid).single();
  const {data:recs}=await supabaseClient.from('recordings').select('*').eq('user_id',uid).order('recording_number');
  document.getElementById('app').innerHTML=`
<div class="card" style="border:2px solid gold">
  <h3>👤 ${user.display_name}</h3>
  <p><b>Email:</b> ${user.email}<br><b>User ID:</b> ${user.id}<br><b>Total Words:</b> ${user.total_words||0}/1000<br><b>Recordings:</b> ${recs.length}<br><b>Remaining:</b> ${Math.max(0,1000-(user.total_words||0))}<br><b>Status:</b> ${user.status}<br><b>Date:</b> ${new Date(user.created_at).toLocaleString()}</p>
  <button class="btn gray" onclick="location.pathname='/admin/users'">⬅️ Back to Users</button>
  <button class="btn gold" onclick="downloadUser('${uid}')">📦 Download This User All</button>
</div>
<div class="card">
  <h3>🎙️ Recordings - ${recs.length}</h3>
  \( {recs.map(r=>`<div class="card" style="background:#181818"><b> \){r.file_name}</b><br><div class="textbox" style="font-size:14px">${r.pidgin_text}</div><small>Words: ${r.word_count} | \( {new Date(r.created_at).toLocaleString()}</small><br><button class="btn green" onclick="new Audio(' \){r.audio_url}').play()">▶️ Play Audio</button></div>`).join('')||'No recordings'}
</div>`;
}

async function downloadUser(uid){
  const {data:recs}=await supabaseClient.from('recordings').select('*').eq('user_id',uid);
  const zip=new JSZip();
  const folder=zip.folder('user_'+uid);
  let trans='';
  for(const r of recs){
    trans+=`${r.file_name} | ${r.word_count} | ${r.pidgin_text}\n`;
    const b=await fetch(r.audio_url).then(rr=>rr.blob());
    folder.file(r.file_name,b);
  }
  folder.file('transcript.txt',trans);
  const blob=await zip.generateAsync({type:'blob'});
  const u=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=u;a.download='USER_'+uid+'.zip';a.click();
}
window.downloadUser=downloadUser;

(async()=>{
  const path=location.pathname;
  if(path==='/admin/login')return renderLoginAdmin();
  if(path==='/user/login')return renderLoginUser();
  if(path==='/login'){location.pathname='/user/login';return;}
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session){
    if(path.startsWith('/admin')){location.pathname='/admin/login';return;}
    else{location.pathname='/user/login';return;}
  }
  if(path==='/admin/dashboard')return renderAdminDashboard(session);
  if(path==='/admin/users')return renderAdminUsers(session);
  if(path.startsWith('/admin/users/')){const uid=path.split('/').pop();return renderAdminUserDetail(session,uid);}
  if(path==='/user/dashboard')return renderUserDashboard(session);
  if(path==='/user/recordings')return renderUserRecordings(session);
  if(path==='/'||path==='/user'){location.pathname='/user/dashboard';return;}
  if(path==='/admin'||path==='/admin/'){location.pathname='/admin/dashboard';return;}
  location.pathname='/user/dashboard';
})();
</script>
