*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:system-ui;padding:12px;padding-bottom:120px}
.card{background:#111;border:1px solid #333;border-radius:16px;padding:16px;margin:14px 0}
.btn{width:100%;padding:14px;border:none;border-radius:40px;font-weight:800;font-size:14px;margin:6px 0;cursor:pointer;min-height:48px}
.green{background:#00ff88;color:#000}
.red{background:#ff3b3b;color:#fff}
.gray{background:#333;color:#fff}
.gold{background:gold;color:#000}
.blue{background:#00aaff;color:#fff}

.fill{height:100%;background:#00ff88;transition:0.4s}

.price-card{background:#1a1a1a;border-radius:14px;padding:16px;text-align:center;border:2px solid #333}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stat-box{background:#1a1a1a;padding:14px;border-radius:12px;text-align:center;border-left:4px solid #00ff88}
.stat-box.gold-b{border-left-color:gold}

  if(!confirm('🗑️ CHAIRMAN DELETE: Delete this recording?\n\nYes = delete DB record only (keep audio in storage for safety)\nNo = cancel\n\nFor PERMANENT audio deletion, use Delete Permanent button'))return;

window.deleteRecordingPermanent=async function(id, fileName){
  if(!confirm('⚠️ PERMANENT DELETE: This will delete BOTH database AND audio file from Supabase Storage!\n\nAre you 100% sure?'))return;
  if(!confirm('Final confirm: Delete audio '+fileName+' permanently?'))return;
  try{
    if(fileName){
      const {error:storageError}=await supabaseClient.storage.from('voices').remove([fileName]);
      if(storageError)console.warn('Storage delete warning:', storageError.message);

    if(error)throw error;

async function renderApiDashboard(){
  const rawKey=localStorage.getItem('api_key')||'';
  const prefix=localStorage.getItem('api_key_prefix')||'';
  if(!rawKey){document.getElementById('app').innerHTML=`<div class="card"><h3>No key - Go /buy</h3><button class="btn gold" onclick="location.pathname='/buy'">Go Buy</button></div>`; return;}
  document.getElementById('app').innerHTML=`<div class="card"><h3>Checking ${prefix}...</h3></div>`;
  try{
    const hash=await hashKeyClient(rawKey);
    const {data:key,error}=await supabaseClient.from('api_keys').select('*').eq('key_hash',hash).single();
    if(error||!key){document.getElementById('app').innerHTML=`<div class="card"><h3>❌ Key not found</h3><button class="btn gold" onclick="location.pathname='/buy'">Buy New</button></div>`; return;}
    if(!key.is_active){document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid gold"><h3>⏳ PENDING APPROVAL</h3><p>Chairman must approve</p><p>${key.key_prefix||prefix}... - ${key.name||''}</p><button class="btn gold" onclick="location.pathname='/buy'">Go Buy Page</button></div>`; return;}
    if((key.credits_remaining||0)<=0){document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid #ff3b3b"><h3>⚠️ No credits left</h3><p>${key.credits_remaining||0} left</p><button class="btn gold" onclick="location.pathname='/buy'">Buy More</button></div>`; return;}
    document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid #00ff88"><h2>🔑 API DASHBOARD - ${key.credits_remaining} LEFT</h2><b>${key.name||'API Customer'}</b><br><small>${key.key_prefix||prefix}...</small><div style="background:#000;padding:10px;border-radius:10px;margin:10px 0;border:2px dashed gold"><b>🔗 YOUR API LINK</b><br><code>${API_ENDPOINT}</code><br><small>Header: x-api-key: YOUR_KEY</small></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px"><div style="background:#00ff88;color:#000;padding:12px;border-radius:10px;text-align:center"><b>${key.credits_remaining||0}</b><br>LEFT</div><div style="background:#222;padding:12px;border-radius:10px;text-align:center"><b>${key.credits_used||0}</b><br>USED</div><div style="background:gold;color:#000;padding:12px;border-radius:10px;text-align:center"><b>${key.credits_total||0}</b><br>TOTAL</div></div></div>`;
  }catch(e){document.getElementById('app').innerHTML=`<div class="card"><h3>❌ ${e.message}</h3></div>`;}
}
function renderApiKeyLogin(){document.getElementById('app').innerHTML=`<div class="card" style="max-width:500px;margin:20px auto;border:2px solid #00ff88"><h1 style="text-align:center">🔑 API LOGIN</h1><input id="apiKeyInput" placeholder="sk_free_ or sk_live_"><button class="btn green" onclick="doApiKeyLogin()">LOGIN</button><p id="apiLoginMsg"></p></div>`;}
async function doApiKeyLogin(){const raw=document.getElementById('apiKeyInput').value.trim(); const msg=document.getElementById('apiLoginMsg'); if(!raw){msg.innerText='Enter key'; return;} msg.innerText='Checking...'; try{const hash=await hashKeyClient(raw); const {data,error}=await supabaseClient.from('api_keys').select('*').eq('key_hash',hash).single(); if(error||!data){msg.innerText='❌ Invalid'; return;} localStorage.setItem('api_key',raw); localStorage.setItem('api_key_prefix',raw.substring(0,18)); location.pathname='/api/dashboard';}catch(e){msg.innerText='❌ '+e.message;}}
async function router(){const path=location.pathname; const hash=location.hash; if(hash && hash.includes('type=recovery')){renderResetPassword(); return;} const params=new URLSearchParams(location.search); if(params.get('type')==='recovery' || location.href.includes('recovery')){renderResetPassword(); return;} if(path==='/admin/login'){renderLoginAdmin(); return;} if(path==='/user/login'){renderLoginUser(); return;} if(path==='/buy'){renderBuyPage(); return;} if(path==='/admin/keys'){renderKeysPage(); return;} if(path==='/api/login'){renderApiKeyLogin(); return;} if(path==='/api/dashboard'){renderApiDashboard(); return;} if(path==='/admin/dashboard'){const {data:{session}}=await supabaseClient.auth.getSession(); if(!session){location.pathname='/admin/login'; return;} renderAdminDashboard(session); return;} if(path==='/user/dashboard'){const {data:{session}}=await supabaseClient.auth.getSession(); if(!session){location.pathname='/user/login'; return;} renderUserDashboardReal(session); return;} const {data:{session}}=await supabaseClient.auth.getSession(); if(session){const {data:prof}=await supabaseClient.from('profiles').select('is_chairman').eq('id',session.user.id).single(); if(prof?.is_chairman){location.pathname='/admin/dashboard';}else{location.pathname='/user/dashboard';}} else {renderLoginUser();}}
router();
})();
