      ${(allRecs||[]).slice(0,80).map((r,i)=>`<div style="background:#181818;padding:12px;border-radius:12px;margin:10px 0;border-left:4px solid ${r.admin_status==='pending'?'gold':r.admin_status==='approved'?'#00ff88':'#ff3b3b'}"><div style="display:flex;justify-content:space-between"><b>#${r.recording_number} ${r.language} - ${r.admin_status.toUpperCase()}</b><small>${r.user_id?.substring(0,6)}</small></div><small>${(r.transcription||r.pidgin_text||'').substring(0,150)}</small><br><audio id="admin-audio-${i}" data-file="${r.file_name}" controls preload="none" style="height:40px;width:100%;margin:8px 0;background:#000;border-radius:8px"></audio><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:6px"><button onclick="approveRecording('${r.id}')" style="background:#00ff88;color:#000;padding:10px;border:none;border-radius:8px;font-weight:900">✅ APPROVE</button><button onclick="rejectRecording('${r.id}')" style="background:#ff3b3b;color:#fff;padding:10px;border:none;border-radius:8px">❌ Reject</button><button onclick="copyVoiceId('${r.file_name}')" style="background:gold;color:#000;padding:10px;border:none;border-radius:8px">ID CODE</button></div><div style="margin-top:8px"><button onclick="deleteRecording('${r.id}','${r.file_name}')" style="background:#000;color:#ff3b3b;padding:12px;border:none;border-radius:30px;border:2px solid #ff3b3b;width:100%;font-weight:900">🗑️ DELETE</button></div></div>`).join('')}
    </div>`;
  window.postAnnouncement=async function(){const title=document.getElementById('annTitle').value.trim();const msg=document.getElementById('annMsg').value.trim();if(!title||!msg){alert('Fill title & message');return;}try{const {error}=await supabaseClient.from('announcements').insert([{title:title,message:msg}]);if(error)throw error;alert('✅ Announcement posted!');location.reload();}catch(e){alert('❌ Failed: '+e.message);}};
  setTimeout(()=>loadAllSignedVoices(),800);
}
async function renderKeysPage(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session){location.pathname='/admin/login';return;}const {data:keys}=await supabaseClient.from('api_keys').select('*').order('created_at',{ascending:false});document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid gold"><h2>🔑 ADMIN KEYS - V6.5 ✅</h2><p style="background:#002b18;padding:8px;border-radius:8px">🎯 SET 100 + DELETE KEY + Ann DELETE</p><button class="btn gold" onclick="location.pathname='/admin/dashboard'">Dashboard</button></div><div class="card"><h3>All Keys ${keys?.length||0}</h3>${(keys||[]).map(k=>`<div style="background:#181818;padding:14px;border-radius:12px;margin:10px 0;border:2px solid #333"><div style="display:flex;justify-content:space-between"><div><b>${k.name||'Key'}</b><br><small>${k.email}</small><br><small>${k.key_prefix}... ${k.payment_ref}</small></div><small style="background:#00ff88;color:#000;padding:6px 10px;border-radius:10px;font-weight:900">${k.credits_remaining} left</small></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-top:12px"><button onclick="deductCredit('${k.id}',10)" style="background:#ff3b3b;color:#fff;padding:10px;border:none;border-radius:8px">➖10</button><button onclick="addCredit('${k.id}',100)" style="background:#00ff88;color:#000;padding:10px;border:none;border-radius:8px">➕100</button><button onclick="resetTo100('${k.id}')" style="background:gold;color:#000;padding:10px;border:none;border-radius:8px;font-weight:900">🎯 SET 100</button><button onclick="deleteKey('${k.id}')" style="background:#000;color:#ff3b3b;padding:10px;border:2px solid #ff3b3b;border-radius:8px">🗑️ DEL</button></div></div>`).join('')}</div>`;}
function renderBuyPage(){document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid gold;text-align:center"><h1 style="color:gold;margin:0">🛒 BUY API KEY - V6.5</h1><p style="background:#002b18;padding:6px;border-radius:8px">✅ FREE mpj_live_100_ 100 credits + Ann DELETE</p></div><div class="card" style="border:3px solid #00ff88;background:#001a00"><h2 style="color:#00ff88;text-align:center;margin:0">🆓 FREE</h2><input id="buy_name_free" placeholder="Your Name"><input id="buy_email_free" placeholder="Email"><button class="btn green" onclick="doBuyFreeSecure()">🆓 COLLECT FREE 100 CREDITS</button><p id="buy_free_msg"></p><div id="buyFreeBox" style="display:none;background:#fff;color:#000;padding:16px;border-radius:12px;border:3px solid #00ff88"><b>✅ FREE Key</b><br><code id="buyFreeKeyText" style="word-break:break-all;background:#000;color:#00ff88;padding:8px;display:block;border-radius:6px;margin-top:8px"></code><br><button onclick="copyLink(document.getElementById('buyFreeKeyText').innerText)" style="padding:12px;background:#000;color:#00ff88;border:none;border-radius:30px;width:100%;font-weight:900">COPY KEY</button></div></div><div class="card" style="border:3px solid gold"><h2 style="text-align:center;color:gold;margin:0">💳 PAID</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0"><div class="price-card" style="border-color:#00ff88"><b>Starter</b><br>1k<br><span style="color:#00ff88;font-weight:900">₦5,000</span><br><button class="btn green" onclick="buyPublic('1k')">Buy 1k</button></div><div class="price-card" style="border-color:gold;background:#1a1500"><b>Popular</b><br>5k<br><span style="color:gold;font-weight:900">₦22,000</span><br><button class="btn gold" onclick="buyPublic('5k')">Buy 5k</button></div></div><input id="buy_name_paid" placeholder="Name"><input id="buy_email_paid" placeholder="Email"><div id="buyPayBox" style="display:none;background:#000;padding:15px;border-radius:12px;border:3px dashed gold"><h3 id="buyPayTitle" style="color:gold">Ready</h3><button class="btn green" onclick="payPublicSecure()">💳 TAP TO PAY</button><div id="buyPaidBox" style="display:none;background:#00ff88;color:#000;padding:16px;border-radius:12px;margin-top:10px"><b>✅ PAID - Pending Chairman:</b><br><code id="buyPaidKeyText" style="word-break:break-all;background:#000;color:#00ff88;padding:8px;display:block;border-radius:6px;margin-top:8px"></code><br><div id="buyPaidInfo" style="background:#000;color:#00ff88;padding:8px;border-radius:6px;margin-top:8px"></div><button onclick="copyLink(document.getElementById('buyPaidKeyText').innerText)" style="padding:12px;background:#000;color:#00ff88;border:none;border-radius:30px;width:100%;font-weight:900">COPY KEY</button></div><p id="buy_paid_msg"></p></div></div>`;
window.buyPublic=function(packageId){currentPackage={packageId:packageId};document.getElementById('buyPayBox').style.display='block';document.getElementById('buyPayTitle').innerText=packageId;};
window.doBuyFreeSecure=async function(){const name=document.getElementById('buy_name_free').value.trim()||'BOMBA';const email=document.getElementById('buy_email_free').value.trim();const msg=document.getElementById('buy_free_msg');if(!email.includes('@')){msg.innerText='Enter email';return;}msg.innerText='Collecting...';try{const fullKey='mpj_live_100_'+Math.random().toString(36).substring(2,10)+Math.random().toString(36).substring(2,10);const keyHash=await hashKeyClient(fullKey);const prefix=fullKey.substring(0,16);const {data:exists}=await supabaseClient.from('api_keys').select('id, api_key').eq('email',email).limit(1);if(exists&&exists.length>0){document.getElementById('buyFreeKeyText').innerText=exists[0].api_key;document.getElementById('buyFreeBox').style.display='block';msg.innerText='Already get key';return;}const {error}=await supabaseClient.from('api_keys').insert([{email:email,name:name,api_key:fullKey,key_hash:keyHash,key_prefix:prefix,credits_remaining:100,credits_total:100,credits_used:0,is_active:true,payment_ref:'FREE-100-V6.5'}]);if(error)throw error;document.getElementById('buyFreeKeyText').innerText=fullKey;document.getElementById('buyFreeBox').style.display='block';msg.innerText='✅ FREE 100 Collected!';localStorage.setItem('api_key',fullKey);}catch(e){msg.innerText='❌ '+e.message;}};
window.payPublicSecure=function(){alert('Paystack connect');};
}

async function router(){const path=location.pathname;if(path==='/admin/login'){renderLoginAdmin();return;}if(path==='/user/login'){renderLoginUser();return;}if(path==='/buy'){renderBuyPage();return;}if(path==='/admin/keys'){renderKeysPage();return;}if(path==='/admin/dashboard'){const {data:{session}}=await supabaseClient.auth.getSession();if(!session){location.pathname='/admin/login';return;}renderAdminDashboard(session);return;}const {data:{session}}=await supabaseClient.auth.getSession();if(session){location.pathname='/admin/dashboard';}else{renderLoginUser();}}
router();
})();
