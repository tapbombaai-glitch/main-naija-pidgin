// FIXED LOGIN - GENERAL USER + 1 ADMIN ONLY - NO LOOP
async function doLogin(type){
  const e=document.getElementById('email').value.trim(); 
  const p=document.getElementById('pass').value; 
  const msg=document.getElementById('msg'); 
  if(!e||!p){msg.innerText='Fill'; return;} 
  msg.innerText='Checking...'; 
  const {error}=await supabaseClient.auth.signInWithPassword({email:e,password:p}); 
  if(error){msg.innerText=error.message; return;} 
  const {data:{session}}=await supabaseClient.auth.getSession(); 
  let {data:prof}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single(); 
  if(!prof){
    const newProf={id:session.user.id,email:e,display_name:e.split('@')[0],total_words:0,recordings_count:0,status:'not_started',is_chairman:false}; 
    const {error:insErr}=await supabaseClient.from('profiles').insert([newProf]); 
    if(insErr){msg.innerText='Profile error: '+insErr.message; return;} 
    prof=newProf;
  } 
  if(type==='admin'){
    if(prof?.email !== CHAIRMAN_EMAIL || !prof?.is_chairman){
      document.getElementById('app').innerHTML='<h1>🚫 BLOCKED</h1><p>Only '+CHAIRMAN_EMAIL+' na chairman. This check dey also enforced by Supabase RLS for backend.</p>'; 
      return;
    } 
    location.href='/admin/dashboard';
  }else{
    location.href='/user/dashboard';
  }
}

function renderBuyPage(){document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid gold;text-align:center"><h1 style="color:gold;margin:0">🛒 BUY API KEY - GENERAL</h1></div><div class="card" style="border:3px solid #00ff88;background:#001a00"><h2 style="color:#00ff88;text-align:center;margin:0">🆓 FREE</h2><input id="buy_name_free" placeholder="Your Name"><input id="buy_email_free" placeholder="Email optional"><button class="btn green" onclick="doBuyFreeSecure()">🆓 COLLECT FREE 100 CREDITS</button><p id="buy_free_msg"></p><div id="buyFreeBox" style="display:none;background:#fff;color:#000;padding:16px;border-radius:12px;border:3px solid #00ff88"><b>✅ FREE Key</b><br><code id="buyFreeKeyText" style="word-break:break-all;background:#000;color:#00ff88;padding:8px;display:block;border-radius:6px;margin-top:8px"></code><br><button onclick="copyLink(document.getElementById('buyFreeKeyText').innerText)" style="padding:12px;background:#000;color:#00ff88;border:none;border-radius:30px;width:100%;font-weight:900">COPY KEY</button></div></div><div class="card" style="border:3px solid gold"><h2 style="text-align:center;color:gold;margin:0">💳 PAID</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0"><div class="price-card" style="border-color:#00ff88"><b>Starter</b><br>1k<br><span style="color:#00ff88;font-weight:900">₦5,000</span><br><button class="btn green" onclick="buyPublic('1k')">Buy 1k</button></div><div class="price-card" style="border-color:gold;background:#1a1500"><b>Popular</b><br>5k<br><span style="color:gold;font-weight:900">₦22,000</span><br><button class="btn gold" onclick="buyPublic('5k')">Buy 5k</button></div></div><input id="buy_name_paid" placeholder="Name"><input id="buy_email_paid" placeholder="Email"><div id="buyPayBox" style="display:none;background:#000;padding:15px;border-radius:12px;border:3px dashed gold"><h3 id="buyPayTitle" style="color:gold">Ready</h3><button class="btn green" onclick="payPublicSecure()">💳 TAP TO PAY</button><div id="buyPaidBox" style="display:none;background:#00ff88;color:#000;padding:16px;border-radius:12px;margin-top:10px"><b>✅ PAID - Pending Chairman:</b><br><code id="buyPaidKeyText" style="word-break:break-all;background:#000;color:#00ff88;padding:8px;display:block;border-radius:6px;margin-top:8px"></code><br><div id="buyPaidInfo" style="background:#000;color:#00ff88;padding:8px;border-radius:6px;margin-top:8px"></div><button onclick="copyLink(document.getElementById('buyPaidKeyText').innerText)" style="padding:12px;background:#000;color:#00ff88;border:none;border-radius:30px;width:100%;font-weight:900">COPY KEY</button></div><p id="buy_paid_msg"></p></div></div>`; window.buyPublic=function(packageId){const pkg=PACKAGES[packageId]; if(!pkg){alert('Invalid package'); return;} currentPackage={packageId:packageId,voices:pkg.voices,amount:pkg.amount}; document.getElementById('buyPayBox').style.display='block'; document.getElementById('buyPayTitle').innerText=`${pkg.label} - Pay ₦${pkg.amount.toLocaleString()}`; document.getElementById('buyPayBox').scrollIntoView({behavior:'smooth'});}; window.doBuyFreeSecure=async function(){const name=document.getElementById('buy_name_free').value.trim()||'Free User'; const email=document.getElementById('buy_email_free').value.trim(); document.getElementById('buy_free_msg').innerText='Collecting...'; try{const res=await fetch('/api/free/collect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email})}); const data=await res.json(); if(!res.ok)throw new Error(data.error||'Failed'); document.getElementById('buyFreeKeyText').innerText=data.full_key; document.getElementById('buyFreeBox').style.display='block'; document.getElementById('buy_free_msg').innerText='✅ Server created!';}catch(e){document.getElementById('buy_free_msg').innerText='❌ '+e.message;}}; window.payPublicSecure=function(){let email=document.getElementById('buy_email_paid').value.trim(); if(!email||!email.includes('@')){email=prompt('Enter email:')||'';} if(!email||!email.includes('@')){alert('Valid email required'); return;} const msg=document.getElementById('buy_paid_msg'); const pkg=PACKAGES[currentPackage.packageId]; if(!pkg){alert('Select package first'); return;} msg.innerText='Opening Paystack...'; try{const handler=PaystackPop.setup({key:PAYSTACK_PUBLIC_KEY,email:email,amount:pkg.amount*100,currency:'NGN',ref:'SECURE_'+currentPackage.packageId+'_'+Date.now(),callback:async function(res){msg.innerText='Payment OK! Verifying...'; try{const verifyRes=await fetch('/api/paystack/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:res.reference,email:email,name:document.getElementById('buy_name_paid').value.trim()||'Paid User',packageId:currentPackage.packageId})}); const verifyData=await verifyRes.json(); if(!verifyRes.ok)throw new Error(verifyData.error||'Verification failed'); document.getElementById('buyPaidKeyText').innerText=verifyData.full_key; document.getElementById('buyPaidInfo').innerText=`${verifyData.package} - ${verifyData.credits} credits - Ref ${res.reference}`; document.getElementById('buyPaidBox').style.display='block'; msg.innerText=`✅ ${verifyData.package} Verified! PENDING Chairman.`;}catch(e){msg.innerText='❌ Verification failed: '+e.message;}},onClose:function(){msg.innerText='Paystack closed';}}); handler.openIframe();}catch(e){msg.innerText='❌ '+e.message;}};}

// FIXED USER DASHBOARD - GENERAL FOR EVERYBODY - NO LOOP
async function renderUserDashboardReal(session){
  const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single();
  // FIXED: NO REDIRECT LOOP - If chairman mistakenly enters user panel, show notice with button, no auto-loop
  let chairmanNotice='';
  if(profile?.email === CHAIRMAN_EMAIL && profile?.is_chairman){
    chairmanNotice=`<div class="card" style="border:3px solid gold;background:#1a1500;text-align:center"><b>👑 You be Chairman (${CHAIRMAN_EMAIL})</b><br><button class="btn gold" onclick="location.pathname='/admin/dashboard'">Go to Chairman Dashboard</button></div>`;
  }
  const {data:recs,error:recError}=await supabaseClient.from('recordings').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false});
  const records=recs||[]; const totalRecordings=records.length; const approved=records.filter(r=>String(r.admin_status||'').toLowerCase()==='approved').length; const pending=records.filter(r=>String(r.admin_status||'').toLowerCase()==='pending').length; const rejected=records.filter(r=>String(r.admin_status||'').toLowerCase()==='rejected').length; const totalWords=records.reduce((sum,r)=>sum+(Number(r.word_count)||0),0); const today=new Date(); const todayYear=today.getFullYear(); const todayMonth=today.getMonth(); const todayDate=today.getDate(); const todayRecordings=records.filter(r=>{if(!r.created_at)return false; const d=new Date(r.created_at); return d.getFullYear()===todayYear && d.getMonth()===todayMonth && d.getDate()===todayDate;}).length; const wordValue=(totalWords/1000)*2500; const accountNumber=profile?.account_number || ('MNP-'+String(session.user.id).replace(/-/g,'').substring(0,8).toUpperCase()); const lang=getLang(); const texts=TEXTS_DATA[lang]||TEXTS_DATA.pidgin; const current=texts[records.length%texts.length]; const pct=Math.min(100,(totalWords/1000)*100); const ann=await fetchAnn();
  document.getElementById('app').innerHTML=`
    ${ann?`<div class="announce">📢 ${ann.title||'ANNOUNCEMENT'}<br><small>${String(ann.message||'').substring(0,180)}</small></div>`:`<div class="announce">💃 MAIN NAIJA PIDGIN - GENERAL WORKER</div>`}
    ${chairmanNotice}
    <div class="header">
      <div style="font-size:20px;font-weight:900">WELCOME, ${(profile?.display_name||'WORKER').toUpperCase()}</div>
      <div style="background:#00ff88;color:#000;padding:10px;border-radius:12px;margin:10px 0;font-weight:900;">👤 ACCOUNT NUMBER<br><span style="font-size:22px">${accountNumber}</span></div>
      <select id="langSelect" onchange="changeLanguage(this.value)" style="background:gold;color:black;font-weight:900;padding:10px;margin-top:8px"><option value="pidgin" ${lang==='pidgin'?'selected':''}>Pidgin</option><option value="hausa" ${lang==='hausa'?'selected':''}>Hausa</option><option value="igbo" ${lang==='igbo'?'selected':''}>Igbo</option><option value="yoruba" ${lang==='yoruba'?'selected':''}>Yoruba</option></select>
      <div style="margin-top:10px">${totalWords} / 1000 WORDS</div>
      <div class="progress"><div class="fill" style="width:${pct}%"></div></div>
    </div>
    <div class="card" style="border:2px solid #00ff88">
      <h3 style="margin-top:0">📊 MY WORK - GENERAL</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div style="background:#222;padding:14px;border-radius:12px;text-align:center;"><b style="font-size:25px">${totalRecordings}</b><br>🎙️ TOTAL</div>
        <div style="background:#222;padding:14px;border-radius:12px;text-align:center;"><b style="font-size:25px">${todayRecordings}</b><br>📅 TODAY</div>
        <div style="background:#002b18;padding:14px;border-radius:12px;text-align:center;"><b style="font-size:25px">${approved}</b><br>✅ APPROVED</div>
        <div style="background:#332900;padding:14px;border-radius:12px;text-align:center;"><b style="font-size:25px">${pending}</b><br>⏳ PENDING</div>
        <div style="background:#300000;padding:14px;border-radius:12px;text-align:center;"><b style="font-size:25px">${rejected}</b><br>❌ REJECTED</div>
        <div style="background:#1a1a1a;padding:14px;border-radius:12px;text-align:center;"><b style="font-size:20px">${totalWords}</b><br>📝 WORDS</div>
      </div>
      <div style="margin-top:10px;background:gold;color:#000;padding:12px;border-radius:12px;text-align:center;font-weight:900;">💰 WORD VALUE: ₦${wordValue.toLocaleString('en-NG',{minimumFractionDigits:0,maximumFractionDigits:0})}<br><small>1,000 WORDS = ₦2,500</small></div>
    </div>
    <div class="card" style="border:3px solid #00ff88"><h3>📖 READ</h3><div class="textbox" id="curTxt">${current}</div><button id="readBtn" class="btn green" onclick="startReadRecord()">🎙️ START READ</button><button id="stopReadBtn" class="btn red" style="display:none" onclick="stopReadRecord()">⏹️ STOP</button><div id="readStatus" style="display:none;background:black;padding:12px;border-radius:10px;margin-top:10px"><p>🔴 Recording <span id="readTimer">0s</span></p><audio id="readAudioPreview" controls style="width:100%;display:none"></audio><button id="saveReadBtn" class="btn blue" style="display:none" onclick="saveReadRecord()">💾 SAVE</button><p id="saveReadMsg"></p></div></div>
    <div class="card" style="border:3px solid gold;background:#1a1a00"><h3>🎤 FREE TALK</h3><label style="display:flex;gap:8px;align-items:center;background:#000;padding:8px;border-radius:8px"><input type="checkbox" id="isWhatsAppCheck" style="width:20px"> 📱 WhatsApp Group?</label><button id="freeTalkBtn" class="btn gold" onclick="toggleFreeTalk()">🎙️ START FREE TALK</button><button id="stopFreeTalkBtn" class="btn red" style="display:none" onclick="stopFreeTalk()">⏹️ STOP</button><div id="freeTalkStatus" style="display:none;background:black;padding:12px;border-radius:10px"><p>🔴 Recording <span id="freeTimer">0s</span></p><audio id="freeAudioPreview" controls style="width:100%;display:none"></audio><button onclick="deleteFreeTalk()" style="background:#ff3b3b;color:#fff;padding:8px 12px;border:none;border-radius:20px;margin-top:8px">🗑️ Delete & Re-record</button></div><div id="freeTalkTranscribe" style="display:none;margin-top:12px;background:#111;padding:12px;border-radius:10px;border:2px solid #00ff88"><textarea id="freeTranscription" placeholder="Type wetin you talk..." rows="3"></textarea><button class="btn green" onclick="saveFreeTalk()">💾 SAVE</button><p id="saveFreeMsg"></p></div></div>
    <div class="card" style="border:2px solid #00ff88"><h3>🎧 MY RECORDINGS ${totalRecordings}</h3>${records.map((r,i)=>`<div style="background:#181818;padding:12px;border-radius:12px;margin:10px 0;border-left:4px solid ${r.admin_status==='approved'?'#00ff88':r.admin_status==='rejected'?'#ff3b3b':'gold'}"><b>#${r.recording_number} ${r.language} - ${r.admin_status} ${r.is_whatsapp_group?'📱':''}</b><br><small>${(r.transcription||r.pidgin_text||'').substring(0,120)}</small><br><audio id="user-audio-${i}" data-file="${r.file_name}" controls style="height:32px;width:100%;margin:6px 0"></audio></div>`).join('') || 'No recordings yet!'}</div>`;
  setTimeout(()=>loadAllSignedVoices(),600);
}
async function renderApiDashboard(){const rawKey=localStorage.getItem('api_key')||''; const prefix=localStorage.getItem('api_key_prefix')||''; if(!rawKey){document.getElementById('app').innerHTML=`<div class="card"><h3>No key - Go /buy</h3><button class="btn gold" onclick="location.pathname='/buy'">Go Buy</button></div>`; return;} document.getElementById('app').innerHTML=`<div class="card"><h3>Checking ${prefix}...</h3></div>`; try{const hash=await hashKeyClient(rawKey); const {data:key,error}=await supabaseClient.from('api_keys').select('*').eq('key_hash',hash).single(); if(error||!key){document.getElementById('app').innerHTML=`<div class="card"><h3>❌ Key not found</h3><button class="btn gold" onclick="location.pathname='/buy'">Buy New</button></div>`; return;} if(!key.is_active){document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid gold"><h3>⏳ PENDING APPROVAL</h3><p>Chairman must approve</p><p>${key.key_prefix||prefix}... - ${key.name||''}</p><button class="btn gold" onclick="location.pathname='/buy'">Go Buy Page</button></div>`; return;} if((key.credits_remaining||0)<=0){document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid #ff3b3b"><h3>⚠️ No credits left</h3><p>${key.credits_remaining||0} left</p><button class="btn gold" onclick="location.pathname='/buy'">Buy More</button></div>`; return;} document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid #00ff88"><h2>🔑 API DASHBOARD - ${key.credits_remaining} LEFT</h2><b>${key.name||'API Customer'}</b><br><small>${key.key_prefix||prefix}...</small><div style="background:#000;padding:10px;border-radius:10px;margin:10px 0;border:2px dashed gold"><b>🔗 YOUR API LINK</b><br><code>${API_ENDPOINT}</code><br><small>Header: x-api-key: YOUR_KEY</small><br><button onclick="copyApiLink()" style="background:gold;color:#000;padding:8px 12px;border:none;border-radius:20px;font-weight:900;margin-top:6px">🔗 Copy API Link</button><button onclick="copyLink('${rawKey}')" style="background:#00ff88;color:#000;padding:8px 12px;border:none;border-radius:20px;font-weight:900">Copy Key</button></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px"><div style="background:#00ff88;color:#000;padding:12px;border-radius:10px;text-align:center"><b>${key.credits_remaining||0}</b><br>LEFT</div><div style="background:#222;padding:12px;border-radius:10px;text-align:center"><b>${key.credits_used||0}</b><br>USED</div><div style="background:gold;color:#000;padding:12px;border-radius:10px;text-align:center"><b>${key.credits_total||0}</b><br>TOTAL</div></div><button class="btn gray" onclick="localStorage.removeItem('api_key');localStorage.removeItem('api_key_prefix');location.pathname='/buy'" style="margin-top:10px">Logout</button></div><div class="card"><h3>🎙️ Secure API Test</h3><button class="btn green" onclick="testSecureApi()" style="padding:18px">🔒 TEST SECURE API</button><p id="secureApiResult" style="background:#000;padding:10px;border-radius:10px;margin-top:10px"></p></div>`; window.testSecureApi=async function(){if(!confirm('Test secure API? This will consume 1 credit.')){return;} const resEl=document.getElementById('secureApiResult'); resEl.innerText='Calling...'; try{const res=await fetch('/api/v1/voice',{method:'GET',headers:{'x-api-key':rawKey}}); const data=await res.json(); if(!res.ok)throw new Error(data.error||'API failed'); const remaining=Number(data.credits_remaining); const mins=Number(data.expires_in_minutes||60); resEl.innerHTML=`✅ Success!<br>Credits left: ${remaining}<br>Voice: ${data.voice?.text?data.voice.text.substring(0,150):'Voice returned'}<br><audio controls src="${data.voice?.audio_url||''}" style="width:100%;margin-top:8px"></audio><br><small>Expires in ${mins} mins</small>`; setTimeout(()=>location.reload(),4000);}catch(e){resEl.innerText='❌ Failed: '+e.message;}}; }catch(e){document.getElementById('app').innerHTML=`<div class="card"><h3>❌ ${e.message}</h3></div>`;}}
function renderApiKeyLogin(){document.getElementById('app').innerHTML=`<div class="card" style="max-width:500px;margin:20px auto;border:2px solid #00ff88"><h1 style="text-align:center">🔑 API LOGIN</h1><input id="apiKeyInput" placeholder="sk_free_ or sk_live_"><button class="btn green" onclick="doApiKeyLogin()">LOGIN</button><p id="apiLoginMsg"></p></div>`;}
async function doApiKeyLogin(){const raw=document.getElementById('apiKeyInput').value.trim(); const msg=document.getElementById('apiLoginMsg'); if(!raw){msg.innerText='Enter key'; return;} msg.innerText='Checking...'; try{const hash=await hashKeyClient(raw); const {data,error}=await supabaseClient.from('api_keys').select('*').eq('key_hash',hash).single(); if(error||!data){msg.innerText='❌ Invalid'; return;} localStorage.setItem('api_key',raw); localStorage.setItem('api_key_prefix',raw.substring(0,18)); location.pathname='/api/dashboard';}catch(e){msg.innerText='❌ '+e.message;}}
async function router(){const path=location.pathname; const hash=location.hash; if(hash && hash.includes('type=recovery')){renderResetPassword(); return;} const params=new URLSearchParams(location.search); if(params.get('type')==='recovery' || location.href.includes('recovery')){renderResetPassword(); return;} if(path==='/admin/login'){renderLoginAdmin(); return;} if(path==='/user/login'){renderLoginUser(); return;} if(path==='/buy'){renderBuyPage(); return;} if(path==='/admin/keys'){renderKeysPage(); return;} if(path==='/api/login'){renderApiKeyLogin(); return;} if(path==='/api/dashboard'){renderApiDashboard(); return;} if(path==='/admin/dashboard'){const {data:{session}}=await supabaseClient.auth.getSession(); if(!session){location.pathname='/admin/login'; return;} renderAdminDashboard(session); return;} if(path==='/user/dashboard'){const {data:{session}}=await supabaseClient.auth.getSession(); if(!session){location.pathname='/user/login'; return;} renderUserDashboardReal(session); return;} const {data:{session}}=await supabaseClient.auth.getSession(); if(session){const {data:prof}=await supabaseClient.from('profiles').select('email,is_chairman').eq('id',session.user.id).single(); if(prof?.email===CHAIRMAN_EMAIL && prof?.is_chairman){location.pathname='/admin/dashboard';}else{location.pathname='/user/dashboard';}} else {renderLoginUser();}}
router();
})();
</script>
