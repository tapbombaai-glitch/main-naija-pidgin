// FIX Issue #2 HTML Safety - Escape all DB values before innerHTML!
function escapeHtml(str){
  if(!str) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

window.loadSignedVoice=async function(fileName,audioId){ 
  try{ 
    if(!fileName) return;

// FIX Issue #2 Credit safety - Atomic via backend endpoint /api/admin/credits - Not just read+update!
window.deductCredit=async function(id,amt){ 
  if(!confirm('Deduct '+amt+' credits? Atomic via backend?')) return; 
  try{ 
    // Try secure backend endpoint first - Atomic!
    try{
      var res=await fetch('/api/admin/credits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'deduct',keyId:id,amount:amt})});
      var txt=await res.text(); var dat; try{ dat=JSON.parse(txt); }catch(e){ throw new Error('Backend not deployed - Fallback to direct'); }
      if(!res.ok) throw new Error(dat.error||'Backend deduct failed');
      alert('✅ Deducted '+amt+' via atomic backend! Remaining: '+dat.credits_remaining); location.reload(); return;
    }catch(be){
      console.warn('Backend credits endpoint not available, fallback to direct Supabase - Not fully atomic (Issue #2)', be.message);
      // Fallback - Old method with gt check - Not fully atomic for concurrent requests!
      var g=await supabaseClient.from('api_keys').select('*').eq('id',id).single(); if(g.error) throw g.error; var k=g.data; 
      if((k.credits_remaining||0)<amt){ alert('Only '+k.credits_remaining+' left'); return; } 
      var upd=await supabaseClient.from('api_keys').update({credits_remaining:k.credits_remaining-amt,credits_used:(k.credits_used||0)+amt}).eq('id',id).gt('credits_remaining',amt-1).select('id'); 
      if(upd.error) throw upd.error; 
      if(!upd.data||upd.data.length===0){ alert('Atomic check failed - Concurrent update or RLS blocked - Use backend /api/admin/credits for true atomic!'); return; } 
      alert('✅ Deducted '+amt+' (fallback - not fully atomic - Deploy /api/admin/credits for atomic!)'); location.reload();
    }
  }catch(e){ alert('❌ Deduct failed: '+escapeHtml(e.message)); } 
};

    if(!res.ok||!result.success){ document.getElementById('app').innerHTML='<div class="card"><h3>❌ '+(result.error?escapeHtml(result.error):'Key not found')+'</h3><button class="btn gold" onclick="location.pathname=\'/buy\'">Buy New</button><button class="btn gray" onclick="localStorage.clear();location.pathname=\'/api/login\'">Clear</button></div>'; return; }
    var key=result.key || result;

    if((key.credits_remaining||0)<=0){ document.getElementById('app').innerHTML='<div class="card" style="border:3px solid #f33"><h3>⚠️ No credits left</h3><p>'+escapeHtml(String(key.credits_remaining))+' left</p><a class="btn gold" href="/buy" style="text-decoration:none;display:block;text-align:center">Buy More</a></div>'; return; }

ssue #4)</h3><p style="font-size:11px;color:#aaa">Test expects voice.signedUrl - Depends on backend api/v1/voice.js response - We leave untouched per permission - loadAllSignedVoices() must return valid authorized URL</p><button class="btn green" onclick="testSecureApi()">🎧 TEST /api/v1/voice (uses 1 credit - Hear voice)</button><div id="secureApiResult" style="background:#000;padding:12px;border-radius:12px;margin-top:12px;min-height:60px;word-break:break-word">Click TEST - Backend api/v1/voice.js untouched - Must return voice.signedUrl</div></div>';
    window.testSecureApi=async function(){

        try{ d=JSON.parse(t); }catch(e){ el.innerHTML='❌ Backend returned HTML not JSON - File api/v1/voice.js not deployed<br><small style="font-size:10px;word-break:break-all;background:#222;padding:8px;display:block;margin-top:8px">'+escapeHtml(t.substring(0,400))+'</small>'; return; }

async function router(){
  try{
    var path=location.pathname;
    if(path.indexOf('/admin/login')!==-1){ renderLoginAdmin(); return; }
    if(path.indexOf('/user/login')!==-1){ renderLoginUser(); return; }
    if(path.indexOf('/buy')!==-1||path==='/'||path===''){ renderBuyPage(); return; }
    if(path.indexOf('/admin/keys')!==-1){ await renderKeysPage(); return; }
    if(path.indexOf('/api/login')!==-1){ renderApiKeyLogin(); return; }
    if(path.indexOf('/api/dashboard')!==-1){ await renderApiDashboard(); return; }
    if(path.indexOf('/admin/dashboard')!==-1){
      var sess=await supabaseClient.auth.getSession(); if(!sess.data.session){ location.pathname='/admin/login'; return; } await renderAdminDashboard(sess.data.session); return;
    }
    if(path.indexOf('/user/dashboard')!==-1){
      var sess2=await supabaseClient.auth.getSession(); if(!sess2.data.session){ location.pathname='/user/login'; return; } await renderUserDashboardReal(sess2.data.session); return;
    }
    var sessCheck=await supabaseClient.auth.getSession();
    if(sessCheck.data.session){
      var profCheck=await supabaseClient.from('profiles').select('email,is_chairman').eq('id',sessCheck.data.session.user.id).single();
      if(profCheck.data&&profCheck.data.email===CHAIRMAN_EMAIL&&profCheck.data.is_chairman){ location.pathname='/admin/dashboard'; }else{ location.pathname='/user/dashboard'; }
    }else{ renderLoginUser(); }
  }catch(err){
    document.getElementById('app').innerHTML='<div class="card"><h3>❌ Router error '+escapeHtml(err.message)+'</h3><a class="btn gold" href="/buy">Go /buy</a></div>';
  }
}
router();
})();
