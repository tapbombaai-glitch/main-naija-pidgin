"btn gold" onclick="buyPackage(10000,45000)">Buy 10k</button></div><div class="price-card" style="border:2px solid #00aaff"><b>20k</b><br><span style="color:#00aaff;font-weight:900">₦80k</span><br><button class="btn blue" onclick="buyPackage(20000,80000)">Buy 20k</button></div></div><input id="key_name_paid" placeholder="Company"><input id="paid_email" placeholder="Customer Email"><div id="payBox" style="display:none;background:#000;padding:15px;border-radius:12px;border:2px dashed #00ff88;margin-top:10px"><h3 id="payTitle" style="color:gold">Paying...</h3><button class="btn green" onclick="payWithPaystackCard()">💳 Pay Paystack</button><div id="paidKeyBox" style="display:none;background:#00ff88;color:#000;padding:12px;border-radius:10px;margin-top:12px"><code id="paidKeyText" style="word-break:break-all"></code><br><button onclick="copyLink(document.getElementById(\'paidKeyText\').innerText)" style="margin-top:8px;padding:10px;background:#000;color:#00ff88;border:none;border-radius:6px;font-weight:900;width:100%">COPY PAID KEY</button></div><p id="paid_msg"></p></div></div><div class="card"><h3>All Keys - '+(keys?.length||0)+'</h3>'+(keys||[]).map(k=>'<div style="background:#181818;padding:14px;border-radius:12px;margin:10px 0;border:2px solid '+((k.credits_remaining||0)<=10?'#ff3b3b':'#333')+'"><b>'+k.name+'</b><br><small>'+k.key_prefix+'... - '+(k.credits_remaining||0)+' left</small><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px"><button onclick="deductCredit(\''+k.id+'\',1)" style="background:#ff3b3b;color:#fff;padding:10px;border:none;border-radius:8px;font-weight:900">➖ DEDUCT 1</button><button onclick="addCredit(\''+k.id+'\',100)" style="background:#00ff88;color:#000;padding:10px;border:none;border-radius:8px;font-weight:900">➕ ADD 100</button></div></div>').join('')+'</div>';
window.buyPackage=function(v,a){currentPackage={voices:v,amount:a};document.getElementById('payBox').style.display='block';document.getElementById('payTitle').innerText='Pay ₦'+a.toLocaleString()+' for '+v.toLocaleString()+' credits';}
window.doGenerateFreeKey=async function(){const name=document.getElementById('key_name_free').value.trim()||'Free';document.getElementById('free_msg').innerText='Generating...';const raw=genFree();const hash=await hashKeyClient(raw);const prefix=raw.substring(0,18);const {data:{session}}=await supabaseClient.auth.getSession();await supabaseClient.from('api_keys').insert([{user_id:session.user.id,name:name+' - 100 credits FREE',key_hash:hash,key_prefix:prefix,is_active:true,payment_ref:'FREE_100',credits_total:100,credits_used:0,credits_remaining:100,voices_package:100}]);document.getElementById('freeKeyText').innerText=raw;document.getElementById('freeKeyBox').style.display='block';document.getElementById('free_msg').innerText='FREE key ready!';}
window.payWithPaystackCard=function(){let email=document.getElementById('paid_email')?.value.trim();if(!email||!email.includes('@')){email=prompt("Customer email:")||"";}if(!email||!email.includes('@')){alert('Valid email');return;}const msgEl=document.getElementById('paid_msg');const amount=currentPackage.amount;const voices=currentPackage.voices;msgEl.innerText='Loading Paystack...';try{const handler=PaystackPop.setup({key:PAYSTACK_PUBLIC_KEY,email:email,amount:amount*100,currency:'NGN',ref:'BOMBA_'+voices+'_'+Date.now(),callback:async function(res){msgEl.innerText='Paid! Ref:'+res.reference;const name=document.getElementById('key_name_paid').value.trim()||'Company';const raw=genPaid();const hash=await hashKeyClient(raw);const prefix=raw.substring(0,18);const {data:{session}}=await supabaseClient.auth.getSession();await supabaseClient.from('api_keys').insert([{user_id:session.user.id,name:name+' - '+voices.toLocaleString()+' credits - ₦'+amount.toLocaleString(),key_hash:hash,key_prefix:prefix,is_active:true,payment_ref:res.reference,credits_total:voices,credits_used:0,credits_remaining:voices,voices_package:voices}]);document.getElementById('paidKeyText').innerText=raw;document.getElementById('paidKeyBox').style.display='block';msgEl.innerText='PAID! '+voices.toLocaleString()+' credits ready!';},onClose:function(){msgEl.innerText='Payment closed';}});handler.openIframe();}catch(e){msgEl.innerText='Error: '+e.message;}}
}
function renderApiKeyLogin(){document.getElementById('app').innerHTML='<div class="card" style="max-width:450px;margin:40px auto;border:3px solid #00ff88;text-align:center"><h1>🔑 API LOGIN</h1><input id="apiKeyInput" placeholder="sk_free_ or sk_live_..."><button class="btn green" onclick="doApiKeyLogin()">LOGIN</button><p id="apiLoginMsg"></p></div>';}
async function doApiKeyLogin(){const raw=document.getElementById('apiKeyInput').value.trim();const msg=document.getElementById('apiLoginMsg');if(!raw){msg.innerText='Enter key!';return;}msg.innerText='Checking...';try{const hash=await hashKeyClient(raw);const {data}=await supabaseClient.from('api_keys').select('*').eq('key_hash',hash).single();if(!data){msg.innerText='Invalid key!';return;}localStorage.setItem('api_key',raw);localStorage.setItem('api_key_prefix',data.key_prefix);localStorage.setItem('api_credits',data.credits_remaining);msg.innerText='SUCCESS! '+data.credits_remaining+' credits';setTimeout(()=>location.pathname='/api/dashboard',1000);}catch(e){msg.innerText='Error: '+e.message;}}
function renderApiDashboard(){const prefix=localStorage.getItem('api_key_prefix')||'sk_...';const credits=localStorage.getItem('api_credits')||'0';document.getElementById('app').innerHTML='<div class="card" style="max-width:500px;margin:20px auto;border:3px solid #00ff88"><h2>✅ API DASHBOARD</h2><div style="background:#00ff88;color:#000;padding:15px;border-radius:12px;font-weight:900">Key: '+prefix+'...<br>Credits Left: '+credits+'</div><button class="btn green" onclick="location.href=\'/admin/dashboard\'">📥 Go Download</button><button class="btn gray" onclick="localStorage.clear();location.pathname=\'/api/login\'">Logout</button></div>';}
window.doApiKeyLogin=doApiKeyLogin;
(async function boot(){
try{
const path=location.pathname;
if(path==='/api/login'){renderApiKeyLogin();return;}
if(path==='/api/dashboard'){renderApiDashboard();return;}
if(path==='/admin/login'){renderLoginAdmin();return;}
if(path==='/user/login'){renderLoginUser();return;}
const {data:{session}}=await supabaseClient.auth.getSession();
if(!session){if(path.startsWith('/admin')){location.pathname='/admin/login';return;}location.pathname='/user/login';return;}
if(path==='/admin/keys'){await renderKeysPage();return;}
if(path==='/admin/dashboard'){await renderAdminDashboard(session);return;}
if(path==='/user/dashboard'){await renderUserDashboard(session);return;}
location.pathname='/user/dashboard';
}catch(e){document.getElementById('app').innerHTML='<h2>ERROR: '+e.message+'</h2>';}
})();
</script></body></html>
