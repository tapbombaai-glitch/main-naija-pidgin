window.deleteRecording=async function(id, fileName){
  if(!confirm('🗑️ CHAIRMAN DELETE: This will remove BOTH database record AND audio file from Storage.\n\nWorker recording will disappear too.\n\nAre you sure?')) return;
  if(!confirm('Final confirm: Delete '+fileName+' permanently?')) return;
  try{
    if(fileName && fileName.length>5){
      const {error:storageError}=await supabaseClient.storage.from('voices').remove([fileName]);
      if(storageError){ console.warn('Storage warning:', storageError.message); }
    }
    const {error:dbError}=await supabaseClient.from('recordings').delete().eq('id',id);
    if(dbError) throw dbError;
    alert('✅ DELETED: Audio file + DB record removed. Worker recording disappears too.');
    location.reload();
  }catch(e){ alert('❌ Delete failed: '+e.message); }
};

async function renderApiDashboard(){
  const rawKey=localStorage.getItem('api_key')||'';
  const prefix=localStorage.getItem('api_key_prefix')||'';
  if(!rawKey){document.getElementById('app').innerHTML=`<div class="card"><h3>❌ No key - Go /buy</h3><button class="btn gold" onclick="location.pathname='/buy'">Go Buy</button></div>`; return;}
  document.getElementById('app').innerHTML=`<div class="card"><h3>Checking ${prefix}...</h3></div>`;
  try{
    let key=null;
    const res1=await supabaseClient.from('api_keys').select('*').eq('api_key',rawKey).single();
    if(res1.data){ key=res1.data; } else { const hash=await hashKeyClient(rawKey); const res2=await supabaseClient.from('api_keys').select('*').eq('key_hash',hash).single(); key=res2.data; }
    if(!key){document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid #ff3b3b"><h3>❌ Key not found</h3><button class="btn gold" onclick="location.pathname='/buy'">Buy New</button></div>`; return;}
    if(!key.is_active){document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid gold"><h3>⏳ PENDING APPROVAL</h3></div>`; return;}
    if((key.credits_remaining||0)<=0){document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid #ff3b3b"><h3>⚠️ No credits left</h3></div>`; return;}
    document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid #00ff88"><h2>🔑 API DASHBOARD - ${key.credits_remaining} LEFT ✅</h2><b>${key.name||'API Customer'}</b><br><small>${key.key_prefix||prefix}...</small><div style="background:#000;padding:10px;border-radius:10px;margin:10px 0;border:2px dashed gold"><b>🔗 YOUR API LINK</b><br><code>${API_ENDPOINT}</code></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div style="background:#00ff88;color:#000;padding:12px;border-radius:10px;text-align:center"><b>${key.credits_remaining||0}</b><br>LEFT</div><div style="background:#222;padding:12px;border-radius:10px;text-align:center"><b>${key.credits_used||0}</b><br>USED</div><div style="background:gold;color:#000;padding:12px;border-radius:10px;text-align:center"><b>${key.credits_total||0}</b><br>TOTAL</div></div></div>`;

}

async function router(){const path=location.pathname; const hash=location.hash; if(hash && hash.includes('type=recovery')){renderResetPassword(); return;} const params=new URLSearchParams(location.search); if(params.get('type')==='recovery' || location.href.includes('recovery')){renderResetPassword(); return;} if(path==='/admin/login'){renderLoginAdmin(); return;} if(path==='/user/login'){renderLoginUser(); return;} if(path==='/buy'){renderBuyPage(); return;} if(path==='/admin/keys'){renderKeysPage(); return;} if(path==='/api/login'){renderApiKeyLogin(); return;} if(path==='/api/dashboard'){renderApiDashboard(); return;} if(path==='/admin/dashboard'){const {data:{session}}=await supabaseClient.auth.getSession(); if(!session){location.pathname='/admin/login'; return;} renderAdminDashboard(session); return;} if(path==='/user/dashboard'){const {data:{session}}=await supabaseClient.auth.getSession(); if(!session){location.pathname='/user/login'; return;} renderUserDashboardReal(session); return;} const {data:{session}}=await supabaseClient.auth.getSession(); if(session){const {data:prof}=await supabaseClient.from('profiles').select('is_chairman').eq('id',session.user.id).single(); if(prof?.is_chairman){location.pathname='/admin/dashboard';}else{location.pathname='/user/dashboard';}} else {renderLoginUser();}}
