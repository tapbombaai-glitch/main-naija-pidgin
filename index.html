window.startReadRecord=async function(){try{const stream=await navigator.mediaDevices.getUserMedia({audio:true}); mediaRecorder=new MediaRecorder(stream); audioChunks=[]; recSec=0; readBlob=null; mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);}; mediaRecorder.onstop=()=>{readBlob=new Blob(audioChunks,{type:'audio/webm'}); const a=document.getElementById('readAudioPreview'); if(a){a.src=URL.createObjectURL(readBlob); a.style.display='block';} const s=document.getElementById('saveReadBtn'); if(s)s.style.display='block'; const d=document.getElementById('deleteReadBtn'); if(d)d.style.display='block';}; mediaRecorder.start(); document.getElementById('readStatus').style.display='block'; document.getElementById('readBtn').style.display='none'; document.getElementById('stopReadBtn').style.display='block'; recTimer=setInterval(()=>{recSec++; document.getElementById('readTimer').innerText=recSec+'s';},1000);}catch(e){alert('Allow mic');}};
window.stopReadRecord=function(){if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(t=>t.stop());} clearInterval(recTimer); document.getElementById('readBtn').style.display='none'; document.getElementById('stopReadBtn').style.display='none'; document.getElementById('saveReadMsg').innerText='🎧 Check sound well - If no clear, delete & record again';};
window.deleteReadRecord=function(){
  readBlob=null; audioChunks=[]; recSec=0;
  const a=document.getElementById('readAudioPreview'); if(a){a.pause(); a.src=''; a.style.display='none';}
  document.getElementById('readStatus').style.display='none';
  document.getElementById('readBtn').style.display='block';
  document.getElementById('stopReadBtn').style.display='none';
  document.getElementById('readTimer').innerText='0s';
  document.getElementById('saveReadMsg').innerText='';
  clearInterval(recTimer);
};

    </div>
    <div style="text-align:center; margin-bottom:8px">
      <small style="color:#00ff88; font-size:11px; background:#111; border:1px solid #333; padding:5px 12px; border-radius:20px">🎙️ Abeg use quiet place, no noise - make admin approve 👍</small>
    </div>
    <div class="card" style="border:2px solid #00ff88; padding:12px">
      <div class="textbox" id="curTxt" style="font-size:18px">${current}</div>
      <button id="readBtn" class="btn green" onclick="startReadRecord()">🎙️ START RECORD</button>
      <button id="stopReadBtn" class="btn red" style="display:none" onclick="stopReadRecord()">⏹️ STOP</button>
      <div id="readStatus" style="display:none; background:#000; padding:12px; border-radius:12px; margin-top:12px; border:2px solid gold">
        <p style="text-align:center; margin:5px; font-size:13px">🎧 Check am well - <span id="readTimer">0s</span></p>
        <audio id="readAudioPreview" controls style="width:100%; display:none; margin:10px 0"></audio>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px">
          <button id="deleteReadBtn" class="btn" style="background:#222; color:#ff3b3b; border:2px solid #ff3b3b; display:none" onclick="deleteReadRecord()">🗑️ DELETE & RECORD AGAIN</button>
          <button id="saveReadBtn" class="btn gold" style="display:none" onclick="saveReadRecord()">💾 SAVE</button>
        </div>
        <p id="saveReadMsg" style="text-align:center; margin-top:8px; font-size:12px; font-weight:800"></p>
      </div>
    </div>
    <div style="text-align:center; margin-top:10px">
      <small style="color:#555; font-size:10px">${user.email}</small><br>
      <button class="btn gray" style="width:auto; padding:8px 16px; font-size:11px; border-radius:20px; margin-top:6px" onclick="localStorage.clear(); supabaseClient.auth.signOut().then(()=>location.pathname='/')">Logout</button>
    </div>
  `;
}

function renderLanding(){
  document.getElementById('app').innerHTML=`
  <div class="card" style="max-width:450px;margin:30px auto;text-align:center;border:3px solid #00ff88">
    <h1 style="margin:10px">🎙️ MAIN NAIJA PIDGIN</h1>
    <div style="background:linear-gradient(90deg,#00ff88,gold);color:#000;padding:14px;border-radius:12px;font-weight:900;margin:12px 0">💰 RECORD VOICE & EARN ₦5,000<br><small>1,000 voices = ₦5,000 - Tonight!</small></div>
    <p style="font-size:12px;color:#aaa">Choose your panel</p>
    <button class="btn green" onclick="location.pathname='/user/login'" style="font-size:18px;padding:18px;margin-top:10px">👷 WORKER - Email Only</button>
    <button class="btn gold" onclick="location.pathname='/admin/login'" style="padding:14px">👑 CHAIRMAN LOGIN</button>
    <button class="btn blue" onclick="location.pathname='/buy'" style="padding:12px">💳 BUY API KEY</button>
  </div>`;
}

async function renderKeysPage(){
  const {data:{session}}=await supabaseClient.auth.getSession(); if(!session){location.pathname='/admin/login'; return;}
  const {data:keys}=await supabaseClient.from('api_keys').select('*').order('created_at',{ascending:false});
  document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid gold"><h2>KEYS</h2><button class="btn gold" onclick="location.pathname='/admin/dashboard'">Dashboard</button></div><div class="card"><h3>All Keys ${keys?.length||0}</h3>${(keys||[]).map(k=>`<div style="background:#181818;padding:14px;border-radius:12px;margin:10px 0">${k.email} - ${k.key_prefix} - ${k.credits_remaining}</div>`).join('')||'No keys'}</div>`;
}

async function router(){
const path=location.pathname;
if(path==='/' || path==='/index.html'){renderLanding(); return;}
if(path==='/user/login'){renderLoginUser(); return;}
if(path==='/admin/login'){renderLoginAdmin(); return;}
if(path==='/buy'){renderBuyPage(); return;}
if(path==='/admin/keys'){renderKeysPage(); return;}
if(path==='/admin/dashboard'){renderAdminDashboard(); return;}
if(path==='/user/dashboard'){renderUserDashboardReal(); return;}
const {data:{session}}=await supabaseClient.auth.getSession();
if(session){
  const {data:prof}=await supabaseClient.from('profiles').select('is_chairman').eq('id',session.user.id).single(); 
  if(prof?.is_chairman){location.pathname='/admin/dashboard';}else{location.pathname='/user/dashboard';}
} else {
  renderLanding();
}
}
router();
})();
</script>
