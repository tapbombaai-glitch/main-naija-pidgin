<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Main Naija Pidgin - V6.3 - FIXED - No Jump</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:system-ui;padding:12px;padding-bottom:120px}
.card{background:#111;border:1px solid #333;border-radius:16px;padding:16px;margin:14px 0}
.btn{width:100%;padding:14px;border:none;border-radius:40px;font-weight:800;font-size:14px;margin:6px 0;cursor:pointer;min-height:48px}
.green{background:#00ff88;color:#000}.red{background:#ff3b3b;color:#fff}.gray{background:#333;color:#fff}.gold{background:gold;color:#000}.blue{background:#00aaff;color:#fff}
.header{border:2px solid #00ff88;border-radius:16px;padding:14px;text-align:center;position:sticky;top:8px;background:#0a0a0a;z-index:20}
.progress{height:12px;background:#222;border-radius:10px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#00ff88;transition:0.4s}
input,select,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid #444;background:#222;color:#fff;margin:8px 0;font-size:16px}
.textbox{background:#1e1e1e;border-left:5px solid #00ff88;padding:16px;border-radius:12px;font-size:17px;min-height:90px}
.announce{background:linear-gradient(90deg,#00ff88,#ffcc00);color:#000;border:3px solid #fff;border-radius:16px;padding:14px;margin:12px 0;font-weight:800}
.price-card{background:#1a1a1a;border-radius:14px;padding:16px;text-align:center;border:2px solid #333}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.stat-box{background:#1a1a1a;padding:14px;border-radius:12px;text-align:center;border-left:4px solid #00ff88}.stat-box.gold-b{border-left-color:gold}.stat-box.red-b{border-left-color:#ff3b3b}
code{word-break:break-all}
</style>
</head>
<body>
<div id="app">Loading V6.3 FIXED...</div>
<script>
(function(){
const SUPABASE_URL="https://rupuxvpupdhlhxgjrbsh.supabase.co";
const SUPABASE_KEY="sb_publishable_DQ27GSl6cVVYy8s5U4ZsFA_ye9e-hpY";
const PAYSTACK_PUBLIC_KEY="pk_live_ce90d591406c8d61ec3c8d3be6e0f5fe49c55d09"
const supabaseClient=supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TEXTS_DATA={pidgin:["Abeg make we start today. I wan tell you say this work na important one.","Today na another beautiful day. How you dey?","Chairman, I don finish the work wey you give me.","Make we go market tomorrow morning.","This Naija Pidgin project na better project."],hausa:["Don Allah mu fara aiki yau."],igbo:["Biko ka anyi malite oru taa."],yoruba:["Jowo ka a bere ise loni."]};
function getLang(){return localStorage.getItem('selected_language')||'pidgin';}
function setLang(l){localStorage.setItem('selected_language',l);}
function countW(t){return t.trim().split(/\s+/).filter(Boolean).length;}
async function hashKeyClient(t){const e=new TextEncoder(); const d=e.encode(t); const h=await crypto.subtle.digest('SHA-256',d); return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');}
window.copyLink=function(t){navigator.clipboard.writeText(t).then(()=>alert('✅ Copied!')).catch(()=>prompt('Copy:',t));};
window.copyVoiceId=function(f){navigator.clipboard.writeText(f).then(()=>alert('✅ Voice ID copied: '+f)).catch(()=>prompt('Copy ID:',f));};
async function fetchAnn(){try{const {data}=await supabaseClient.from('announcements').select('*').order('created_at',{ascending:false}).limit(1).single(); return data;}catch(e){return null;}}
window.loadSignedVoice=async function(fileName,audioId){try{if(!fileName||fileName.length<5)return; const {data}=await supabaseClient.storage.from('voices').createSignedUrl(fileName,3600); if(data?.signedUrl){const el=document.getElementById(audioId); if(el){el.src=data.signedUrl; el.load();}}}catch(e){}};
window.loadAllSignedVoices=function(){document.querySelectorAll('audio[data-file]').forEach(el=>{const file=el.getAttribute('data-file'); if(file&&file.length>5)loadSignedVoice(file,el.id);});};
let mediaRecorder=null,audioChunks=[],freeBlob=null,readBlob=null,recTimer=null,recSec=0;
let currentPackage={packageId:'1k',voices:1000,amount:5000};
const PACKAGES={'1k':{voices:1000,amount:5000,label:'Starter 1k Voices ₦5k'},'5k':{voices:5000,amount:22000,label:'Popular 5k Voices ₦22k'},'10k':{voices:10000,amount:45000,label:'10k Voices ₦45k'},'100k':{voices:100000,amount:350000,label:'100k Voices ₦350k'}};
window.changeLanguage=function(l){setLang(l); location.reload();};
window.startReadRecord=async function(){try{const stream=await navigator.mediaDevices.getUserMedia({audio:true}); mediaRecorder=new MediaRecorder(stream); audioChunks=[]; recSec=0; readBlob=null; mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);}; mediaRecorder.onstop=()=>{readBlob=new Blob(audioChunks,{type:'audio/webm'}); const a=document.getElementById('readAudioPreview'); if(a){a.src=URL.createObjectURL(readBlob); a.style.display='block';} const s=document.getElementById('saveReadBtn'); if(s)s.style.display='block';}; mediaRecorder.start(); document.getElementById('readStatus').style.display='block'; document.getElementById('readBtn').style.display='none'; document.getElementById('stopReadBtn').style.display='block'; recTimer=setInterval(()=>{recSec++; document.getElementById('readTimer').innerText=recSec+'s';},1000);}catch(e){alert('Allow mic');}};
window.stopReadRecord=function(){if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(t=>t.stop());} clearInterval(recTimer); document.getElementById('readBtn').style.display='block'; document.getElementById('stopReadBtn').style.display='none';};
window.saveReadRecord=async function(){const lang=getLang(); const text=document.getElementById('curTxt').innerText; if(!readBlob){alert('Record first'); return;} document.getElementById('saveReadMsg').innerText='Uploading...'; try{const {data:{session}}=await supabaseClient.auth.getSession(); if(!session){location.pathname='/user/login'; return;} const fileName=`${session.user.id}/${Date.now()}_read_${lang}.webm`; await supabaseClient.storage.from('voices').upload(fileName, readBlob, {contentType:'audio/webm'}); const {data:existing}=await supabaseClient.from('recordings').select('id').eq('user_id',session.user.id); await supabaseClient.from('recordings').insert([{user_id:session.user.id,file_name:fileName,pidgin_text:text,word_count:countW(text),language:lang,recording_number:(existing?.length||0)+1,admin_status:'pending'}]); document.getElementById('saveReadMsg').innerText='✅ SAVED!'; setTimeout(()=>location.reload(),1000);}catch(e){document.getElementById('saveReadMsg').innerText='❌ '+e.message;}};

async function renderLoginAdmin(){document.getElementById('app').innerHTML=`<div class="card" style="max-width:450px;margin:30px auto;border:2px solid gold"><h2>👑 CHAIRMAN LOGIN</h2><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="btn gold" onclick="doLogin('admin')">LOGIN</button><p id="msg"></p></div>`;}
async function renderLoginUser(){document.getElementById('app').innerHTML=`<div class="card" style="max-width:450px;margin:30px auto;border:2px solid #00ff88"><h2>🎙️ WORKER LOGIN</h2><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><input id="name" placeholder="Name for signup"><button class="btn green" onclick="doLogin('user')">LOGIN</button><button class="btn gray" onclick="doSignup()">SIGNUP</button><button class="btn gray" onclick="forgotPassword()" style="background:#222;border:1px dashed #00ff88;">🔑 FORGOT PASSWORD?</button><p id="msg" style="background:#000;padding:10px;border-radius:8px;margin-top:10px;"></p></div>`;}

// FIXED doLogin - NO MORE JUMP TO ADMIN FOR USER
async function doLogin(type){
  const e=document.getElementById('email').value.trim(); const p=document.getElementById('pass').value; const msg=document.getElementById('msg'); 
  if(!e||!p){msg.innerText='Fill'; return;} msg.innerText='Checking...'; 
  const {error}=await supabaseClient.auth.signInWithPassword({email:e,password:p}); if(error){msg.innerText=error.message; return;} 
  const {data:{session}}=await supabaseClient.auth.getSession(); 
  let {data:prof}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single(); 
  if(!prof){const newProf={id:session.user.id,email:e,display_name:e.split('@')[0],total_words:0,recordings_count:0,status:'not_started',is_chairman:false}; await supabaseClient.from('profiles').insert([newProf]); prof=newProf;} 
  if(type==='admin'){
    if(!prof?.is_chairman){document.getElementById('app').innerHTML='<h1>🚫 BLOCKED - Not Chairman</h1><button class="btn green" onclick="location.pathname=\'/user/login\'">Go Worker</button>'; return;}
    location.href='/admin/dashboard';
  }else{
    // FIXED: USER LOGIN ALWAYS GO TO USER DASHBOARD - EVEN IF is_chairman=true (for kingselysuoye@gmail.com)
    location.href='/user/dashboard';
  }
}

async function doSignup(){const e=document.getElementById('email').value.trim(); const p=document.getElementById('pass').value; const n=document.getElementById('name').value||e.split('@')[0]; const msg=document.getElementById('msg'); if(!e||!p){msg.innerText='Fill'; return;} msg.innerText='Creating...'; const {data,error}=await supabaseClient.auth.signUp({email:e,password:p}); if(error){msg.innerText=error.message; return;} if(!data.user){msg.innerText='Check email'; return;} await supabaseClient.from('profiles').insert([{id:data.user.id,email:e,display_name:n,total_words:0,recordings_count:0,status:'active',is_chairman:false}]); msg.innerText='✅ Created! Login now';}
window.doLogin=doLogin; window.doSignup=doSignup;
async function forgotPassword(){const email=document.getElementById('email').value.trim(); const msg=document.getElementById('msg'); if(!email){msg.innerText='Enter email first'; return;} msg.innerText='Sending...'; try{const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:'https://main-naija-pidgin.vercel.app/user/login'}); if(error){msg.innerText=error.message; return;} msg.innerText='✅ Check email';}catch(e){msg.innerText='Could not send';}}
window.forgotPassword=forgotPassword;

window.approveRecording=async function(id){if(!confirm('Approve?'))return; await supabaseClient.from('recordings').update({admin_status:'approved'}).eq('id',id); alert('✅ Approved!'); location.reload();};
window.rejectRecording=async function(id){if(!confirm('Reject?'))return; await supabaseClient.from('recordings').update({admin_status:'rejected'}).eq('id',id); location.reload();};
window.deleteRecording=async function(id,file){if(!confirm('DELETE?'))return; if(file)await supabaseClient.storage.from('voices').remove([file]); await supabaseClient.from('recordings').delete().eq('id',id); location.reload();};

async function renderAdminDashboard(session){
  const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single();
  if(!profile?.is_chairman){document.getElementById('app').innerHTML='<h1>🚫 BLOCKED - Not Chairman</h1>'; return;}
  const {data:allRecs}=await supabaseClient.from('recordings').select('*').order('created_at',{ascending:false});
  document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid gold"><h2>👑 CHAIRMAN DASHBOARD - V6.3 FIXED</h2><p>Total Recordings: ${allRecs?.length||0}</p><div style="display:flex;gap:8px"><button class="btn gold" onclick="location.pathname='/admin/keys'">Keys</button><button class="btn gray" onclick="supabaseClient.auth.signOut().then(()=>location.pathname='/admin/login')">Logout</button></div></div><div class="card">${(allRecs||[]).slice(0,50).map((r,i)=>`<div style="background:#181818;padding:12px;border-radius:12px;margin:10px 0"><b>#${r.recording_number} ${r.admin_status.toUpperCase()}</b><br><small>${(r.pidgin_text||'').substring(0,100)}</small><br><audio id="admin-audio-${i}" data-file="${r.file_name}" controls style="width:100%;margin:8px 0"></audio><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px"><button onclick="approveRecording('${r.id}')" style="background:#00ff88;color:#000;padding:10px;border:none;border-radius:8px">✅ APPROVE</button><button onclick="deleteRecording('${r.id}','${r.file_name}')" style="background:#000;color:#ff3b3b;border:2px solid #ff3b3b;padding:10px;border-radius:8px">DELETE</button></div></div>`).join('')||'No recordings'}</div>`;
  setTimeout(()=>loadAllSignedVoices(),800);
}

function renderBuyPage(){document.getElementById('app').innerHTML=`<div class="card"><h1>BUY</h1><button class="btn green" onclick="location.pathname='/user/login'">Go Worker</button></div>`;}
async function renderKeysPage(){const {data:{session}}=await supabaseClient.auth.getSession(); if(!session){location.pathname='/admin/login'; return;} document.getElementById('app').innerHTML=`<div class="card"><h2>KEYS</h2><button class="btn gold" onclick="location.pathname='/admin/dashboard'">Dashboard</button></div>`;}

// FIXED renderUserDashboardReal - NO MORE REDIRECT TO ADMIN
async function renderUserDashboardReal(session){
  const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single();
  // REMOVED: if(profile?.is_chairman){location.pathname='/admin/dashboard'; return;} - THIS WAS BREAKING kingselysuoye@gmail.com
  const {data:recs}=await supabaseClient.from('recordings').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false});
  const records=recs||[]; const totalWords=records.reduce((s,r)=>s+(Number(r.word_count)||0),0); const pct=Math.min(100,(totalWords/1000)*100);
  const lang=getLang(); const texts=TEXTS_DATA[lang]||TEXTS_DATA.pidgin; const current=texts[records.length%texts.length];
  document.getElementById('app').innerHTML=`
    <div class="header"><div style="font-size:18px;font-weight:900">WELCOME, ${(profile?.display_name||'WORKER').toUpperCase()}</div><div style="background:#00ff88;color:#000;padding:8px;border-radius:12px;margin:8px 0;font-weight:900;">${records.length} / 1000 voices</div><div>${totalWords} / 1000 WORDS - ${pct.toFixed(0)}%</div><div class="progress"><div class="fill" style="width:${pct}%"></div></div></div>
    <div class="card" style="border:3px solid #00ff88"><h3>📖 READ</h3><div class="textbox" id="curTxt">${current}</div><button id="readBtn" class="btn green" onclick="startReadRecord()">🎙️ START READ</button><button id="stopReadBtn" class="btn red" style="display:none" onclick="stopReadRecord()">⏹️ STOP</button><div id="readStatus" style="display:none;background:black;padding:12px;border-radius:10px;margin-top:10px"><p>🔴 Recording <span id="readTimer">0s</span></p><audio id="readAudioPreview" controls style="width:100%;display:none"></audio><button id="saveReadBtn" class="btn blue" style="display:none" onclick="saveReadRecord()">💾 SAVE</button><p id="saveReadMsg"></p></div></div>
    <div class="card"><h3>My Recordings ${records.length}</h3>${records.slice(0,20).map((r,i)=>`<div style="background:#181818;padding:10px;border-radius:8px;margin:6px 0"><b>#${r.recording_number} ${r.admin_status}</b> - ${r.pidgin_text?.substring(0,80)}<br><audio id="user-${i}" data-file="${r.file_name}" controls style="width:100%;height:32px"></audio></div>`).join('')||'No recordings yet'}</div>
    <div class="card" style="text-align:center"><small>${profile?.email||''}</small><br><button class="btn gray" onclick="supabaseClient.auth.signOut().then(()=>location.pathname='/user/login')">Logout</button></div>`;
  setTimeout(()=>loadAllSignedVoices(),600);
}

async function router(){
  const path=location.pathname;
  if(path==='/admin/login'){renderLoginAdmin(); return;}
  if(path==='/user/login'){renderLoginUser(); return;}
  if(path==='/buy'){renderBuyPage(); return;}
  if(path==='/admin/keys'){renderKeysPage(); return;}
  if(path==='/admin/dashboard'){const {data:{session}}=await supabaseClient.auth.getSession(); if(!session){location.pathname='/admin/login'; return;} renderAdminDashboard(session); return;}
  if(path==='/user/dashboard'){const {data:{session}}=await supabaseClient.auth.getSession(); if(!session){location.pathname='/user/login'; return;} renderUserDashboardReal(session); return;}
  const {data:{session}}=await supabaseClient.auth.getSession(); 
  if(session){location.pathname='/user/dashboard';} else {renderLoginUser();}
}
router();
})();
</script>
