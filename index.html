  async function hashKeyClient(text){ const e=new TextEncoder(); const d=e.encode(text); const h=await crypto.subtle.digest('SHA-256', d); return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join(''); }

  window.toggleFreeTalk = async function(){
    const status=document.getElementById('freeTalkStatus'), btn=document.getElementById('freeTalkBtn'), stopBtn=document.getElementById('stopFreeTalkBtn');
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});

  window.saveFreeTalk = async function(){
    const trans=document.getElementById('freeTranscription').value.trim();
    const lang=getLang(); const isWhats=document.getElementById('isWhatsAppCheck')?.checked || false;
    const msgEl=document.getElementById('saveFreeMsg');
    if(!trans){ alert('❌ Type wetin you talk - Important!'); return; }
    if(!freeBlob){ alert('❌ Record first!'); return; }
    msgEl.innerText='🔍 Chairman quality check - Checking if sound clear...';
    try{
      const audioContext=new (window.AudioContext||window.webkitAudioContext)();
      const arrayBuffer=await freeBlob.arrayBuffer();
      const audioBuffer=await audioContext.decodeAudioData(arrayBuffer);
      const data=audioBuffer.getChannelData(0);
      let sum=0; for(let i=0;i<data.length;i++) sum+=data[i]*data[i];
      const rms=Math.sqrt(sum/data.length); const vol=rms*1000; const dur=audioBuffer.duration;
      let quality='clear', score=95, status='pending';
      if(vol<5){ quality='too low - no clear'; score=20; status='needs_review'; }
      else if(vol<15){ quality='low'; score=55; status='needs_review'; }
      else if(vol>120){ quality='too loud'; score=50; status='needs_review'; }
      else { quality='clear'; score=95; status='pending'; }
      if(dur<8){ quality='too short'; score=30; status='needs_review'; }
      if(score<60){
        const go=confirm(`⚠️ SOUND NO TOO CLEAR!\nQuality: ${quality.toUpperCase()}\nVol: ${Math.round(vol)}% - Dur: ${Math.round(dur)}s\n\nChairman talk say if sound no clear, e no go accept am!\n\nYou want save anyway or record again clear?\nOK = Save (Chairman fit reject)\nCancel = Record again`);
        if(!go){ msgEl.innerText='❌ Record again - Near speaker - No noise - Talk clear!'; return; }
      }
      msgEl.innerText=`✅ Quality ${quality} - ${Math.round(dur)}s - Uploading...`;
      const fileName=`free_${lang}_${isWhats?'whatsapp':''}_${Date.now()}.webm`;
      const {error:upErr}=await supabaseClient.storage.from('voices').upload(fileName, freeBlob);
      if(upErr) throw upErr;
      const {data:{session}}=await supabaseClient.auth.getSession();
      const {data:existing}=await supabaseClient.from('recordings').select('id').eq('user_id',session.user.id);
      const {error:dbErr}=await supabaseClient.from('recordings').insert([{
        user_id:session.user.id, file_name:fileName, audio_path:fileName,
        pidgin_text:trans, word_count:countW(trans), language:lang,
        recording_number:(existing?.length||0)+1, is_free_talk:true, transcription:trans,
        quality_score:score, quality_status:quality, duration_seconds:Math.round(dur),
        admin_status:status, is_whatsapp_group:isWhats
      }]);
      if(dbErr) throw dbErr;
      await supabaseClient.from('profiles').update({total_words:0, recordings_count:(existing?.length||0)+1}).eq('id',session.user.id);
      msgEl.innerHTML= score>=80 ? `✅ SAVED! Sound CLEAR! ${lang.toUpperCase()} - Chairman go accept! 💵` : `⚠️ Saved but quality ${quality} - Chairman fit reject if no clear!`;
      setTimeout(()=>location.reload(),2000);
    }catch(e){ msgEl.innerText='❌ '+e.message; }
  }

  async function renderLoginAdmin(){ document.getElementById('app').innerHTML=`<div class="card" style="max-width:450px;margin:30px auto;border:2px solid gold"><h2>👑 CHAIRMAN LOGIN</h2><input id="email" placeholder="Chairman Email" value="tapbomba.ai@gmail.com"><input id="pass" type="password" placeholder="Password"><button class="btn gold" onclick="doLogin('admin')">LOGIN</button><p id="msg"></p></div>`; }

    const e=document.getElementById('email').value.trim(), p=document.getElementById('pass').value, n=document.getElementById('name').value||e.split('@')[0], msg=document.getElementById('msg');

  }

  async function renderUserDashboard(session){
    const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single();
    if(profile?.is_chairman){ location.pathname='/admin/dashboard'; return; }
    const {data:recs}=await supabaseClient.from('recordings').select('*').eq('user_id',session.user.id).order('recording_number');
    const total=(recs||[]).reduce((s,r)=>s+r.word_count,0)||0;

    const pct=Math.min(100,(total/1000)*100); const ann=await fetchAnn();

    document.getElementById('app').innerHTML=`
      ${ann?`<div class="announce">📢 ${ann.title}<br><small>${ann.message.substring(0,180)}</small></div>`:`<div class="announce">💃 FINAL - 2 Buttons + WhatsApp Group + Quality!</div>`}

  async function renderAdminDashboard(session){

    const {data:users}=await supabaseClient.from('profiles').select('*').order('total_words',{ascending:false}); const list=users||[]; const totalW=list.reduce((s,u)=>s+(u.total_words||0),0);

    const pending=(recs||[]).filter(r=>r.admin_status==='pending').length; const needsReview=(recs||[]).filter(r=>r.admin_status==='needs_review').length;
    document.getElementById('app').innerHTML=`
      <div class="card" style="border:3px solid gold;background:#1a1a00"><h2>👑 CHAIRMAN FINAL - 2 Buttons + Quality</h2><div class="announce">${anns[0]?.title||'💃 Final - Clear sound only!'}</div>

      <div class="nav"><button class="btn gold" onclick="location.pathname='/admin/keys'">🔑 Keys</button><button class="btn gray" onclick="supabaseClient.auth.signOut().then(()=>location.pathname='/admin/login')">Logout</button></div></div>
      <div class="card"><h3>📢 Create Announcement</h3><input id="annTitle" placeholder="Title - e.g. Clear sound only!"><textarea id="annMessage" placeholder="Message - If sound clear I go accept, if no clear I no go accept!"></textarea><button class="btn green" onclick="createAnnouncement()">🚀 POST</button><p id="annMsg"></p></div>
      <div class="card"><h3>🔍 Recent Recordings - Quality Check - Accept/Reject</h3>${(recs||[]).slice(0,20).map(r=>`<div style="background:#181818;padding:10px;border-radius:8px;margin:6px 0;border-left:5px solid ${r.quality_score>=70?'#00ff88':r.quality_score>=40?'gold':'#ff3b3b'}"><b>#${r.recording_number} ${r.language?.toUpperCase()} ${r.is_free_talk?'🎤 FREE':''} ${r.is_whatsapp_group?'📱 WhatsApp Group':''}</b> - ${r.word_count}w - Score: ${r.quality_score||0} - ${r.quality_status} - ${r.admin_status}<br><small>${(r.transcription||r.pidgin_text||'').substring(0,100)}</small><br><div style="display:flex;gap:6px;margin-top:6px"><button onclick="updateAdminStatus('${r.id}','approved')" style="background:#00ff88;color:#000;padding:6px 12px;border:none;border-radius:6px;font-weight:900">✅ ACCEPT - Clear</button><button onclick="updateAdminStatus('${r.id}','rejected')" style="background:#ff3b3b;color:#fff;padding:6px 12px;border:none;border-radius:6px">❌ REJECT - No clear</button><audio controls src="https://rupuxvpupdhlhxgjrbsh.supabase.co/storage/v1/object/public/voices/${r.file_name}" style="height:30px"></audio></div></div>`).join('')||'No recordings yet'}</div>
      <div class="card"><h3>📊 Users - ${list.length}</h3>${list.slice(0,20).map((u,i)=>`<div style="background:#181818;padding:10px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between"><div><b>${i+1}. ${u.display_name}</b><br><small>${u.email} - ${u.total_words||0} words</small></div><div>₦${(u.recordings_count||0)*10}</div></div>`).join('')||'No users'}</div>
    `;
  }
  window.updateAdminStatus=async function(id,status){ await supabaseClient.from('recordings').update({admin_status:status}).eq('id',id); alert(status==='approved'?'✅ ACCEPTED - Clear sound!':'❌ REJECTED - No clear!'); location.reload(); }
  window.createAnnouncement=async function(){
    const t=document.getElementById('annTitle').value.trim(), m=document.getElementById('annMessage').value.trim(), msg=document.getElementById('annMsg');
    if(!t||!m){ msg.innerText='Fill both!'; return; } msg.innerText='Posting...';
    const {error}=await supabaseClient.from('announcements').insert([{title:t,message:m}]);
    if(error) msg.innerText='❌ '+error.message; else{ msg.innerText='✅ Posted!'; setTimeout(()=>location.reload(),1000); }
  }

  async function renderKeysPage(session){
    const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single();
    if(!profile?.is_chairman){ document.getElementById('app').innerHTML='<h1>🚫 BLOCKED</h1>'; return; }
    const {data:keys}=await supabaseClient.from('api_keys').select('*').order('created_at',{ascending:false});
    document.getElementById('app').innerHTML=`<div class="card" style="border:2px solid gold"><h2>🔑 Keys</h2><div class="nav"><button class="btn gold" onclick="location.pathname='/admin/dashboard'">Dashboard</button></div></div>
      <div class="card" style="border:2px solid #00ff88"><h3>🆓 FREE - sk_free_</h3><input id="key_name_free" placeholder="Name"><button class="btn green" onclick="doGenerateFreeKey()">Generate FREE</button><p id="free_msg"></p><div id="freeKeyBox" style="display:none;background:white;color:black;padding:12px;border-radius:10px"><code id="freeKeyText"></code></div></div>
      <div class="card" style="border:2px solid gold"><h3>💰 PAID - sk_live_ - ₦5,000</h3><input id="key_name_paid" placeholder="Name"><input id="paid_email" placeholder="Email"><button class="btn gold" onclick="showPaidPay()">Buy ₦5k</button><div id="payBox" style="display:none"><button class="btn green" onclick="payWithPaystackCard()">Pay Card</button><div id="paidKeyBox" style="display:none;background:#00ff88;color:black;padding:10px;border-radius:8px;margin-top:10px"><code id="paidKeyText"></code></div><p id="paid_msg"></p></div></div>
      <div class="card"><h3>Keys - ${(keys||[]).length}</h3>${(keys||[]).map(k=>`<div style="background:#181818;padding:10px;border-radius:8px;margin:6px 0"><b>${k.name}</b><br><small>${k.key_prefix}... ${k.is_active?'ACTIVE':'INACTIVE'}</small></div>`).join('')||'No keys'}</div>`;
  }
  async function doGenerateFreeKey(){
    const nameEl=document.getElementById('key_name_free'), msgEl=document.getElementById('free_msg'), box=document.getElementById('freeKeyBox'), textEl=document.getElementById('freeKeyText');
    const name=nameEl.value.trim()||'Free Key'; msgEl.innerText='Generating...';
    try{ const raw=genFree(); const hash=await hashKeyClient(raw); const prefix=raw.substring(0,18); const {data:{session}}=await supabaseClient.auth.getSession(); await supabaseClient.from('api_keys').insert([{user_id:session.user.id,name:name,key_hash:hash,key_prefix:prefix,is_active:true}]); textEl.innerText=raw; box.style.display='block'; msgEl.innerText='✅ FREE!'; }catch(e){ msgEl.innerText='❌ '+e.message; }
  }
  function showPaidPay(){ document.getElementById('payBox').style.display='block'; }
  function payWithPaystackCard(){
    let email=document.getElementById('paid_email')?.value.trim(); if(!email||!email.includes('@')){ email=prompt("Enter email")||""; } if(!email||!email.includes('@')){ alert('Enter valid email'); return; }
    const msgEl=document.getElementById('paid_msg'); msgEl.innerText='Loading Paystack...';
    if(typeof PaystackPop==='undefined'){ const s=document.createElement('script'); s.src='https://js.paystack.co/v1/inline.js'; s.onload=()=>{ msgEl.innerText='Loaded! Click Pay again!'; }; document.head.appendChild(s); return; }
    try{
      const handler=PaystackPop.setup({ key:PAYSTACK_PUBLIC_KEY, email:email, amount:500000, currency:'NGN', ref:'BOMBA_'+Date.now(),
        callback: async function(res){ msgEl.innerText='Paid! Ref:'+res.reference+' Generating...'; try{ const nameEl=document.getElementById('key_name_paid'); const name=nameEl.value.trim()||'Paid Key'; const raw=genPaid(); const hash=await hashKeyClient(raw); const prefix=raw.substring(0,18); const {data:{session}}=await supabaseClient.auth.getSession(); await supabaseClient.from('api_keys').insert([{user_id:session.user.id,name:name,key_hash:hash,key_prefix:prefix,is_active:true,payment_ref:res.reference}]); document.getElementById('paidKeyText').innerText=raw; document.getElementById('paidKeyBox').style.display='block'; msgEl.innerText='✅ PAID!'; }catch(e){ msgEl.innerText='❌ '+e.message; } },
        onClose: function(){ msgEl.innerText='Payment closed'; }
      }); handler.openIframe();
    }catch(e){ msgEl.innerText='❌ '+e.message; }
  }
  window.doGenerateFreeKey=doGenerateFreeKey; window.showPaidPay=showPaidPay; window.payWithPaystackCard=payWithPaystackCard;

  function renderApiKeyLogin(){
    const link=window.location.origin+'/api/login';
    document.getElementById('app').innerHTML=`<div class="card" style="max-width:500px;margin:20px auto;border:3px solid #00ff88"><h1 style="text-align:center">🔑 API LOGIN - Final</h1><div style="background:#1a1a00;border:2px solid gold;padding:12px;border-radius:12px;text-align:center"><input value="${link}" readonly style="flex:1"><button onclick="copyLink('${link}')" style="padding:10px;background:gold;color:#000;font-weight:900;border:none;border-radius:8px">COPY LINK</button></div><div style="border:3px dashed #00ff88;padding:15px;border-radius:15px;background:#0a0a0a;margin:15px 0"><input id="apiKeyInput" placeholder="sk_free_xxx or sk_live_xxx"><button class="btn green" onclick="doApiKeyLogin()">LOGIN</button><p id="apiLoginMsg"></p></div></div>`;
  }
  async function doApiKeyLogin(){
    const raw=document.getElementById('apiKeyInput').value.trim(), msg=document.getElementById('apiLoginMsg');
    if(!raw){ msg.innerText='Enter key!'; return; } msg.innerText='Checking...';
    try{ const hash=await hashKeyClient(raw); const {data,error}=await supabaseClient.from('api_keys').select('*').eq('key_hash',hash).eq('is_active',true).single(); if(error||!data){ msg.innerText='❌ Invalid!'; return; } localStorage.setItem('api_key',raw); localStorage.setItem('api_key_prefix',data.key_prefix); msg.innerText='✅ Success!'; setTimeout(()=>location.pathname='/api/dashboard',800); }catch(e){ msg.innerText='❌ '+e.message; }
  }
  function renderApiDashboard(){ const prefix=localStorage.getItem('api_key_prefix')||''; document.getElementById('app').innerHTML=`<div class="card"><h2>API DASHBOARD - ${prefix}...</h2><p>Filter: ?language=hausa,igbo,yoruba,pidgin&mode=free,read&quality=clear</p><button class="btn gray" onclick="localStorage.removeItem('api_key'); location.pathname='/api/login'">Logout</button></div>`; }
  function renderApiDocs(){ document.getElementById('app').innerHTML=`<div class="card"><h3>API Docs - Final</h3><p>FREE: sk_free_ 100 words | PAID: sk_live_ ₦5000/1000 words | Clear sound only!</p><button class="btn green" onclick="location.pathname='/api/login'">Go API Login</button></div>`; }
  window.renderApiKeyLogin=renderApiKeyLogin; window.doApiKeyLogin=doApiKeyLogin; window.renderApiDashboard=renderApiDashboard;

  (async function boot(){
    const path=location.pathname;
    if(path==='/api/login'||path==='/api-login'){ renderApiKeyLogin(); return; }
    if(path==='/api/dashboard'){ renderApiDashboard(); return; }
    if(path==='/admin/login'){ renderLoginAdmin(); return; }
    if(path==='/user/login'){ renderLoginUser(); return; }
    if(path==='/api-docs'){ renderApiDocs(); return; }
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session){ if(path.startsWith('/admin')){ location.pathname='/admin/login'; return; } if(path==='/api/dashboard'){ location.pathname='/api/login'; return; } location.pathname='/user/login'; return; }
    if(path==='/admin/keys'){ await renderKeysPage(session); return; }
    if(path==='/admin/dashboard'){ await renderAdminDashboard(session); return; }
    if(path==='/user/dashboard'){ await renderUserDashboard(session); return; }
    if(path==='/'||path==='/user'){ location.pathname='/user/dashboard'; return; }
    if(path==='/admin'){ location.pathname='/admin/dashboard'; return; }
    location.pathname='/user/dashboard';
  })();
})();
</script>
</body>
</html>
