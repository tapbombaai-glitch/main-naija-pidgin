}async function doApiKeyLogin(){
const raw=document.getElementById('apiKeyInput').value.trim();const msg=document.getElementById('apiLoginMsg');
if(!raw){msg.innerText='Enter key!';return;}if(!raw.startsWith('sk_')){msg.innerText='Key must start with sk_free_ or sk_live_';return;}
msg.innerText='BRAIN Checking key...';msg.style.color='#ffcc00';
try{
const hash=await hashKeyClient(raw);
const {data,error}=await supabaseClient.from('api_keys').select('*').eq('key_hash',hash).single();
if(error||!data){msg.innerText='Invalid API key!';msg.style.color='#ff3b3b';return;}
if(!data.is_active){msg.innerText='Key expired or deactivated!';msg.style.color='#ff3b3b';return;}
if((data.credits_remaining||0)<=0){msg.innerText='No credit left! Used '+data.credits_used+'/'+data.credits_total+'. Buy new package!';msg.style.color='#ff3b3b';return;}
localStorage.setItem('api_key',raw);localStorage.setItem('api_key_prefix',data.key_prefix);localStorage.setItem('api_credits',data.credits_remaining);
msg.innerHTML='BRAIN SUCCESS!<br><br><div style="background:#00ff88;color:#000;padding:10px;border-radius:10px"><b>'+data.name+'</b><br>'+data.credits_remaining+' credits left<br>'+data.credits_used+' used / '+data.credits_total+' total<br><small>'+data.key_prefix+'...</small></div>';msg.style.color='#00ff88';
setTimeout(()=>location.pathname='/api/dashboard',1500);
}catch(e){msg.innerText='Error: '+e.message;msg.style.color='#ff3b3b';}
}

const {data:{session}}=await supabaseClient.auth.getSession();
if(!session){if(path.startsWith('/admin')){location.pathname='/admin/login';return;}if(path==='/api/dashboard'){location.pathname='/api/login';return;}location.pathname='/user/login';return;}

if(path==='/user/dashboard'){await renderUserDashboard(session);return;}
location.pathname='/user/dashboard';
}catch(e){
document.getElementById('app').innerHTML='<div style="padding:20px;background:#300;color:#fff"><h2>BOOT ERROR: '+e.message+'</h2><pre>'+e.stack+'</pre><button onclick="location.reload()">Reload</button></div>';
}
})();
}catch(outerErr){

}
})();
