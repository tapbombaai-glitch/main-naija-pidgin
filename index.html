window.toggleFreeTalk=async function(){
  try{
    var stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream); audioChunks=[]; recSec=0; freeBlob=null;
    mediaRecorder.ondataavailable=function(e){ if(e.data.size>0) audioChunks.push(e.data); };
    mediaRecorder.onstop=function(){ freeBlob=new Blob(audioChunks,{type:'audio/webm'}); var url=URL.createObjectURL(freeBlob); var a=document.getElementById('freeAudioPreview'); if(a){ a.src=url; a.style.display='block'; } var t=document.getElementById('freeTalkTranscribe'); if(t) t.style.display='block'; };
    mediaRecorder.start(); document.getElementById('freeTalkStatus').style.display='block'; document.getElementById('freeTalkBtn').style.display='none'; document.getElementById('stopFreeTalkBtn').style.display='block';
    recTimer=setInterval(function(){ recSec++; var tm=document.getElementById('freeTimer'); if(tm) tm.innerText=recSec+'s'; if(recSec>=60) stopFreeTalk(); },1000);
  }catch(e){ alert('Allow mic: '+e.message); }
};
window.stopFreeTalk=function(){ if(mediaRecorder&&mediaRecorder.state==='recording'){ mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(function(t){ t.stop(); }); } clearInterval(recTimer); var s=document.getElementById('freeTalkBtn'); var e=document.getElementById('stopFreeTalkBtn'); if(s) s.style.display='block'; if(e) e.style.display='none'; };

};

}

    '<div class="card" style="border:3px solid #00ff88"><h3>📖 READ - COMPLETE</h3><div class="textbox" id="curTxt">'+current+'</div><button id="readBtn" class="btn green" onclick="startReadRecord()">🎙️ START READ</button><button id="stopReadBtn" class="btn red" style="display:none" onclick="stopReadRecord()">⏹️ STOP</button><div id="readStatus" style="display:none;background:black;padding:12px;border-radius:10px;margin-top:10px"><p>🔴 Recording <span id="readTimer">0s</span></p><audio id="readAudioPreview" controls style="width:100%;display:none"></audio><button id="saveReadBtn" class="btn blue" style="display:none" onclick="saveReadRecord()">💾 SAVE READ</button><p id="saveReadMsg"></p></div></div>'+
    '<div class="card" style="border:3px solid gold;background:#1a1a00"><h3>🎤 FREE TALK - COMPLETE</h3><label style="display:flex;gap:8px;align-items:center;background:#000;padding:8px;border-radius:8px"><input type="checkbox" id="isWhatsAppCheck" style="width:20px"> 📱 WhatsApp Group?</label><button id="freeTalkBtn" class="btn gold" onclick="toggleFreeTalk()">🎙️ START FREE TALK</button><button id="stopFreeTalkBtn" class="btn red" style="display:none" onclick="stopFreeTalk()">⏹️ STOP FREE TALK</button><div id="freeTalkStatus" style="display:none;background:black;padding:12px;border-radius:10px"><p>🔴 Recording <span id="freeTimer">0s</span></p><audio id="freeAudioPreview" controls style="width:100%;display:none"></audio><button onclick="deleteFreeTalk()" style="background:#ff3b3b;color:#fff;padding:8px 12px;border:none;border-radius:20px;margin-top:8px">🗑️ Delete & Re-record</button></div><div id="freeTalkTranscribe" style="display:none;margin-top:12px;background:#111;padding:12px;border-radius:10px;border:2px solid #00ff88"><textarea id="freeTranscription" placeholder="Type wetin you talk..." rows="3"></textarea><button class="btn green" onclick="saveFreeTalk()">💾 SAVE FREE TALK</button><p id="saveFreeMsg"></p></div></div>'+
    '<div class="card" style="border:2px solid #00ff88"><h3>🎧 MY RECORDINGS - COMPLETE - '+totalRecordings+'</h3>'+records.map(function(r,i){ return '<div style="background:#181818;padding:12px;border-radius:12px;margin:10px 0;border-left:4px solid '+(r.admin_status==='approved'?'#00ff88':r.admin_status==='rejected'?'#ff3b3b':'gold')+'"><b>#'+r.recording_number+' '+r.language+' - '+r.admin_status+' '+(r.is_whatsapp_group?'📱':'')+'</b><br><small>'+(r.transcription||r.pidgin_text||'').substring(0,120)+'</small><br><audio id="user-audio-'+i+'" data-file="'+r.file_name+'" controls style="height:32px;width:100%;margin:6px 0"></audio></div>'; }).join('')+'</div>';
  setTimeout(function(){ loadAllSignedVoices(); },600);
}

async function renderApiDashboard(){
  var rawKey=localStorage.getItem('api_key')||'';
  if(!rawKey){ document.getElementById('app').innerHTML='<div class="card"><h3>No key - Go /buy</h3><a class="btn gold" href="/buy">Go Buy - Agreed Prices</a></div>'; return; }
  document.getElementById('app').innerHTML='<div class="card"><h3>Checking '+rawKey.substring(0,12)+'... via backend</h3><p>Loading...</p></div>';
  try{
    var res=await fetch('/api/api-key/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiKey:rawKey})});
    var text=await res.text(); var result; try{ result=JSON.parse(text); }catch(e){ document.getElementById('app').innerHTML='<div class="card" style="border:2px solid #f33"><h3>❌ Backend returned HTML not JSON</h3><p>File api/api-key/login.js not deployed</p><p style="font-size:10px;background:#000;padding:8px">'+text.substring(0,300)+'</p><button class="btn gray" onclick="localStorage.clear();location.pathname=\'/api/login\'">Clear & Login Again</button></div>'; return; }
    if(!res.ok||!result.success){ document.getElementById('app').innerHTML='<div class="card"><h3>❌ '+(result.error||'Key not found')+'</h3><button class="btn gold" onclick="location.pathname=\'/buy\'">Buy New</button><button class="btn gray" onclick="localStorage.clear();location.pathname=\'/api/login\'">Clear</button></div>'; return; }
    var key=result.key; if(!key.is_active){ document.getElementById('app').innerHTML='<div class="card" style="border:3px solid gold"><h3>⏳ PENDING APPROVAL</h3><p>Chairman must approve - '+CHAIRMAN_EMAIL+'</p><p>'+key.key_prefix+'... - '+key.name+'</p><p>Credits: '+key.credits_remaining+'</p><button class="btn gold" onclick="location.pathname=\'/buy\'">Go Buy</button><button class="btn gray" onclick="localStorage.clear();location.pathname=\'/api/login\'">Logout</button></div>'; return; }
    if((key.credits_remaining||0)<=0){ document.getElementById('app').innerHTML='<div class="card" style="border:3px solid #f33"><h3>⚠️ No credits left</h3><p>'+key.credits_remaining+' left</p><button class="btn gold" onclick="location.pathname=\'/buy\'">Buy More - Agreed Prices</button></div>'; return; }
    document.getElementById('app').innerHTML='<div class="card" style="border:3px solid #00ff88"><h2>🔑 API DASHBOARD - COMPLETE - '+key.credits_remaining+' LEFT</h2><b>'+key.name+'</b><br><small>'+key.key_prefix+'...</small><div style="background:#000;padding:10px;border-radius:10px;margin:10px 0;border:2px dashed gold"><b>🔗 YOUR API LINK</b><br><code>'+API_ENDPOINT+'</code><br><small>Header: x-api-key: YOUR_KEY</small><br><button onclick="copyApiLink()" style="background:gold;color:#000;padding:8px 12px;border:none;border-radius:20px;font-weight:900;margin-top:6px">Copy API Link</button><button onclick="copyLink(\''+rawKey+'\')" style="background:#00ff88;color:#000;padding:8px 12px;border:none;border-radius:20px;font-weight:900">Copy Key</button></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div style="background:#00ff88;color:#000;padding:12px;border-radius:10px;text-align:center"><b>'+key.credits_remaining+'</b><br>LEFT</div><div style="background:#222;padding:12px;border-radius:10px;text-align:center"><b>'+key.credits_used+'</b><br>USED</div><div style="background:gold;color:#000;padding:12px;border-radius:10px;text-align:center"><b>'+key.credits_total+'</b><br>TOTAL</div></div><button class="btn gray" onclick="localStorage.clear();location.pathname=\'/buy\'">Logout</button></div><div class="card"><h3>🎙️ Secure API Test - Uses 1 credit</h3><button class="btn green" onclick="testSecureApi()">TEST /api/v1/voice (uses 1 credit)</button><p id="secureApiResult" style="background:#000;padding:10px;border-radius:10px"></p></div>';
    window.testSecureApi=async function(){
      if(!confirm('Test uses 1 credit - Continue?')) return;
      var el=document.getElementById('secureApiResult'); el.innerText='Calling /api/v1/voice...';
      try{ var r=await fetch('/api/v1/voice',{headers:{'x-api-key':rawKey}}); var t=await r.text(); var d; try{ d=JSON.parse(t); }catch(e){ el.innerText='❌ Backend returned HTML not JSON - File api/v1/voice.js not deployed. Preview: '+t.substring(0,200); return; } if(!r.ok) throw new Error(d.error||'Fail'); el.innerText='✅ Success! Remaining: '+d.credits_remaining+' - Voice: '+(d.voice&&d.voice.text?d.voice.text.substring(0,100):'OK'); }catch(e){ el.innerText='❌ '+e.message; }
    };
  }catch(e){ document.getElementById('app').innerHTML='<div class="card"><h3>❌ '+e.message+'</h3><button class="btn gray" onclick="localStorage.clear();location.pathname=\'/api/login\'">Clear</button></div>'; }
}
async function router(){
  try{
    var path=location.pathname;
    if(path.indexOf('/admin/login')!==-1){ renderLoginAdmin(); return; }
    if(path.indexOf('/user/login')!==-1){ renderLoginUser(); return; }
    if(path.indexOf('/buy')!==-1||path==='/'||path===''){ renderBuyPage(); return; }
    if(path.indexOf('/admin/keys')!==-1){ await renderKeysPage(); return; }
    if(path.indexOf('/api/login')!==-1){ renderApiKeyLogin(); return; }
    if(path.indexOf('/api/dashboard')!==-1){ await renderApiDashboard(); return; }
    if(path.indexOf('/admin/dashboard')!==-1){
      var sess=await supabaseClient.auth.getSession(); if(!sess.data.session){ location.pathname='/admin/login'; return; } await renderAdminDashboard(sess.data.session); return;
    }
    if(path.indexOf('/user/dashboard')!==-1){
      var sess2=await supabaseClient.auth.getSession(); if(!sess2.data.session){ location.pathname='/user/login'; return; } await renderUserDashboardReal(sess2.data.session); return;
    }
    var sessCheck=await supabaseClient.auth.getSession();
    if(sessCheck.data.session){
      var profCheck=await supabaseClient.from('profiles').select('email,is_chairman').eq('id',sessCheck.data.session.user.id).single();
      if(profCheck.data&&profCheck.data.email===CHAIRMAN_EMAIL&&profCheck.data.is_chairman){ location.pathname='/admin/dashboard'; }else{ location.pathname='/user/dashboard'; }
    }else{ renderLoginUser(); }
  }catch(err){
    document.getElementById('app').innerHTML='<div class="card"><h3>❌ Router error '+err.message+'</h3><a class="btn gold" href="/buy">Go /buy</a></div>';
  }
}
router();
})();
