<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FULL APP - PHONE BRAIN - NO KEY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui;padding:10px;padding-bottom:80px} .card{background:#111;border:1px solid #333;border-radius:16px;padding:16px;margin:12px 0} .btn{width:100%;padding:14px;border:none;border-radius:35px;font-weight:900;font-size:13px;margin:5px 0;cursor:pointer} .green{background:#00ff88;color:#000}.red{background:#ff3b3b;color:#fff}.gray{background:#333;color:#fff}.gold{background:gold;color:#000}.blue{background:#00aaff;color:#fff} .textbox{background:#1e1e1e;border-left:5px solid #00ff88;padding:16px;border-radius:10px;font-size:18px;min-height:80px} .header{border:2px solid #00ff88;border-radius:16px;padding:14px;text-align:center;background:#0a0a0a} .progress{height:14px;background:#222;border-radius:10px;overflow:hidden}.fill{height:100%;background:#00ff88} input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;margin:6px 0} .announce{background:linear-gradient(90deg,#00ff88,#ffcc00);color:#000;border:3px solid #fff;border-radius:16px;padding:12px;margin:12px 0;font-weight:900}</style>
</head><body><div id="app">Loading NEW PHONE BRAIN...</div>
<script>
const SUPABASE_URL="https://rupuxvpupdhlhxgjrbsh.supabase.co";
const SUPABASE_KEY="sb_publishable_DQ27GSl6cVVYy8s5U4ZsFA_ye9e-hpY";
const CHAIRMAN_EMAIL="tapbomba.ai@gmail.com";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const TEXTS_DATA={pidgin:["Abeg make we start today. I wan tell you say this work na important one.","Today na another beautiful day for this country. Sun dey shine.","Chairman, I don finish the work wey you give me yesterday.","How you dey? I dey come your side now now."],hausa:["Don Allah mu fara aiki yau."],igbo:["Biko ka anyi malite oru taa."],yoruba:["Jowo ka a bere ise loni."]};
function getLang(){return localStorage.getItem('selected_language')||'pidgin';}
function setLang(l){localStorage.setItem('selected_language',l);}
function countW(t){return t.trim().split(/\s+/).filter(Boolean).length;}
let mediaRecorder=null,audioChunks=[],freeBlob=null,readBlob=null,recTimer=null,recSec=0;
let phoneSpeechRec=null, finalTranscript='';
window.copyVoiceText=function(){const t=document.getElementById('freeTranscription').value;if(!t){alert('No text, talk first');return;}navigator.clipboard.writeText(t).then(()=>{alert('✅ COPIED! Send to me for WhatsApp!');});}
window.changeLanguage=function(l){setLang(l);location.reload();}

// === NEW PHONE BRAIN - NO KEY - LIVE TYPING ===
window.toggleFreeTalk=async function(){
  finalTranscript='';
  const ta=document.getElementById('freeTranscription');
  const msg=document.getElementById('brainListeningMsg');
  const statusDiv=document.getElementById('freeTalkStatus');
  const transBox=document.getElementById('freeTalkTranscribe');
  try{
    // Start audio recording for saving
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream,{mimeType:'audio/webm'});
    audioChunks=[];recSec=0;freeBlob=null;
    mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
    mediaRecorder.onstop=()=>{
      freeBlob=new Blob(audioChunks,{type:'audio/webm'});
      const url=URL.createObjectURL(freeBlob);
      const aud=document.getElementById('freeAudioPreview');aud.src=url;aud.style.display='block';
      if(phoneSpeechRec){try{phoneSpeechRec.stop();}catch(e){}}
    };
    mediaRecorder.start();

    // Start PHONE LIVE BRAIN - No key needed!
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition){
      msg.innerText='❌ Your phone browser no support live typing. Use Chrome browser!';
    } else {
      phoneSpeechRec = new SpeechRecognition();
      phoneSpeechRec.lang = 'en-NG'; // Nigerian English - understand Pidgin
      phoneSpeechRec.continuous = true;
      phoneSpeechRec.interimResults = true;
      phoneSpeechRec.onstart=()=>{msg.innerText='🧠 PHONE BRAIN dey listen... talk now! E go type LIVE for white box!';};
      phoneSpeechRec.onresult=(event)=>{
        let interim='';
        for(let i=event.resultIndex; i<event.results.length; i++){
          const transcript = event.results[i][0].transcript;
          if(event.results[i].isFinal){finalTranscript += transcript + ' ';} else {interim += transcript;}
        }
        ta.value = finalTranscript + interim;
        ta.style.background='#fff';ta.style.color='#000';
        msg.innerText='✅ PHONE BRAIN dey type LIVE... keep talking!';
      };
      phoneSpeechRec.onerror=(e)=>{msg.innerText='Brain error: '+e.error + ' - but keep talking';};
      phoneSpeechRec.onend=()=>{msg.innerText='✅ BRAIN DON TYPE! Press COPY VOICE!';};
      phoneSpeechRec.start();
    }

    statusDiv.style.display='block';
    transBox.style.display='block';
    document.getElementById('freeTalkBtn').style.display='none';
    document.getElementById('stopFreeTalkBtn').style.display='block';
    recSec=0;
    recTimer=setInterval(()=>{recSec++;document.getElementById('freeTimer').innerText=recSec+'s';if(recSec>=90)window.stopFreeTalk();},1000);
  }catch(e){alert('Allow mic: '+e.message);}
}
window.stopFreeTalk=function(){
  if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();mediaRecorder.stream.getTracks().forEach(t=>t.stop());}
  if(phoneSpeechRec){try{phoneSpeechRec.stop();}catch(e){}}
  clearInterval(recTimer);
  document.getElementById('freeTalkBtn').style.display='block';
  document.getElementById('stopFreeTalkBtn').style.display='none';
  const msg=document.getElementById('brainListeningMsg');
  if(msg)msg.innerText='✅ DONE! White box don type! Press COPY VOICE and SAVE!';
}
window.saveFreeTalk=async function(){
  const trans=document.getElementById('freeTranscription').value.trim();
  const msgEl=document.getElementById('saveFreeMsg');
  if(!trans){alert('Talk first, make brain type');return;}
  if(!freeBlob){alert('Record first');return;}
  msgEl.innerText='Saving...';
  try{
    const fileName='free_'+getLang()+'_'+Date.now()+'.webm';
    await supabaseClient.storage.from('voices').upload(fileName,freeBlob);
    const {data:{session}}=await supabaseClient.auth.getSession();
    const {data:existing}=await supabaseClient.from('recordings').select('id').eq('user_id',session.user.id);
    await supabaseClient.from('recordings').insert([{user_id:session.user.id,file_name:fileName,audio_path:fileName,pidgin_text:trans,word_count:countW(trans),language:getLang(),recording_number:(existing?.length||0)+1,is_free_talk:true,transcription:trans,quality_score:95,quality_status:'clear',admin_status:'pending',duration_seconds:recSec}]);
    msgEl.innerText='SAVED!';setTimeout(()=>location.reload(),1000);
  }catch(e){msgEl.innerText='Error: '+e.message;}
}
window.startReadRecord=async function(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(stream);audioChunks=[];recSec=0;readBlob=null;
    mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
    mediaRecorder.onstop=()=>{readBlob=new Blob(audioChunks,{type:'audio/webm'});const url=URL.createObjectURL(readBlob);const aud=document.getElementById('readAudioPreview');aud.src=url;aud.style.display='block';document.getElementById('saveReadBtn').style.display='block';};
    mediaRecorder.start();
    document.getElementById('readStatus').style.display='block';document.getElementById('readBtn').style.display='none';document.getElementById('stopReadBtn').style.display='block';
    recTimer=setInterval(()=>{recSec++;document.getElementById('readTimer').innerText=recSec+'s';},1000);
  }catch(e){alert('Allow mic');}
}
window.stopReadRecord=function(){if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();mediaRecorder.stream.getTracks().forEach(t=>t.stop());}clearInterval(recTimer);document.getElementById('readBtn').style.display='block';document.getElementById('stopReadBtn').style.display='none';}
window.saveReadRecord=async function(){
  const lang=getLang();const text=document.getElementById('curTxt').innerText;if(!readBlob){alert('Record first');return;}
  document.getElementById('saveReadMsg').innerText='Uploading...';
  try{
    const fileName='read_'+lang+'_'+Date.now()+'.webm';await supabaseClient.storage.from('voices').upload(fileName,readBlob);
    const {data:{session}}=await supabaseClient.auth.getSession();const {data:existing}=await supabaseClient.from('recordings').select('id').eq('user_id',session.user.id);
    await supabaseClient.from('recordings').insert([{user_id:session.user.id,file_name:fileName,audio_path:fileName,pidgin_text:text,word_count:countW(text),language:lang,recording_number:(existing?.length||0)+1,is_free_talk:false,quality_score:90,quality_status:'clear',admin_status:'pending',duration_seconds:recSec}]);
    document.getElementById('saveReadMsg').innerText='SAVED!';setTimeout(()=>location.reload(),1000);
  }catch(e){document.getElementById('saveReadMsg').innerText='Error: '+e.message;}
}
async function renderLoginAdmin(){document.getElementById('app').innerHTML='<div class="card" style="max-width:450px;margin:30px auto;border:2px solid gold"><h2>CHAIRMAN LOGIN</h2><input id="email" placeholder="Email" value="tapbomba.ai@gmail.com"><input id="pass" type="password" placeholder="Password"><button class="btn gold" onclick="doLogin(\'admin\')">LOGIN</button><p id="msg"></p></div>';}
async function renderLoginUser(){document.getElementById('app').innerHTML='<div class="card" style="max-width:450px;margin:30px auto;border:2px solid #00ff88"><h2>WORKER LOGIN</h2><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><input id="name" placeholder="Name"><button class="btn green" onclick="doLogin(\'user\')">LOGIN</button><button class="btn gray" onclick="doSignup()">SIGNUP</button><p id="msg"></p></div>';}
async function doLogin(type){
  const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value,msg=document.getElementById('msg');
  if(!e||!p){msg.innerText='Fill';return;}msg.innerText='Checking...';
  const {error}=await supabaseClient.auth.signInWithPassword({email:e,password:p});if(error){msg.innerText=error.message;return;}
  const {data:{session}}=await supabaseClient.auth.getSession();let {data:prof}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single();
  if(!prof){const isChair=e.toLowerCase()===CHAIRMAN_EMAIL.toLowerCase();const newProf={id:session.user.id,email:e,display_name:e.split('@')[0],total_words:0,recordings_count:0,status:'not_started',is_chairman:isChair};await supabaseClient.from('profiles').insert([newProf]);prof=newProf;}
  if(e.toLowerCase()===CHAIRMAN_EMAIL.toLowerCase()&&!prof.is_chairman){await supabaseClient.from('profiles').update({is_chairman:true}).eq('id',session.user.id);prof.is_chairman=true;}
  if(type==='admin'){if(!prof?.is_chairman){document.getElementById('app').innerHTML='<h1>BLOCKED</h1>';return;}location.href='/admin/dashboard';}else{if(prof?.is_chairman)location.href='/admin/dashboard';else location.href='/user/dashboard';}
}
async function doSignup(){
  const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value,n=document.getElementById('name').value||e.split('@')[0],msg=document.getElementById('msg');
  if(!e||!p){msg.innerText='Fill';return;}msg.innerText='Creating...';
  const {data,error}=await supabaseClient.auth.signUp({email:e,password:p});if(error){msg.innerText=error.message;return;}if(!data.user){msg.innerText='Check email';return;}
  const isChair=e.toLowerCase()===CHAIRMAN_EMAIL.toLowerCase();await supabaseClient.from('profiles').insert([{id:data.user.id,email:e,display_name:n,total_words:0,recordings_count:0,status:'not_started',is_chairman:isChair}]);
  msg.innerText='Created! Login now';
}
window.doLogin=doLogin;window.doSignup=doSignup;
async function renderUserDashboard(session){
  const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single();
  if(profile?.is_chairman){location.pathname='/admin/dashboard';return;}
  const {data:recs}=await supabaseClient.from('recordings').select('*').eq('user_id',session.user.id).order('recording_number');
  const total=(recs||[]).reduce((s,r)=>s+r.word_count,0)||0;const lang=getLang();const texts=TEXTS_DATA[lang]||TEXTS_DATA.pidgin;const current=texts[(recs||[]).length%texts.length];const pct=Math.min(100,(total/1000)*100);
  document.getElementById('app').innerHTML='<div class="announce">🧠 NEW PHONE BRAIN - NO KEY - TYPE LIVE AS YOU TALK!</div><div class="header"><div>WELCOME, '+(profile?.display_name||'WORKER').toUpperCase()+'</div><select onchange="changeLanguage(this.value)" style="background:gold;color:black;font-weight:900;padding:10px;margin-top:8px"><option value="pidgin" '+(lang==='pidgin'?'selected':'')+'>Pidgin</option><option value="hausa" '+(lang==='hausa'?'selected':'')+'>Hausa</option><option value="igbo" '+(lang==='igbo'?'selected':'')+'>Igbo</option><option value="yoruba" '+(lang==='yoruba'?'selected':'')+'>Yoruba</option></select><div>'+total+' / 1000 WORDS</div><div class="progress"><div class="fill" style="width:'+pct+'%"></div></div></div><div class="card" style="border:3px solid #00ff88"><h3>📖 FIRST - READ</h3><div class="textbox" id="curTxt">'+current+'</div><button id="readBtn" class="btn green" onclick="startReadRecord()">🎙️ START READ</button><button id="stopReadBtn" class="btn red" style="display:none" onclick="stopReadRecord()">⏹️ STOP</button><div id="readStatus" style="display:none;background:black;padding:12px;border-radius:10px;margin-top:10px"><p>🔴 Recording <span id="readTimer">0s</span></p><audio id="readAudioPreview" controls style="width:100%;display:none"></audio><button id="saveReadBtn" class="btn blue" style="display:none" onclick="saveReadRecord()">💾 SAVE READ</button><p id="saveReadMsg"></p></div></div><div class="card" style="border:3px solid gold;background:#1a1a00"><h3>🎤 SECOND - FREE TALK + COPY VOICE + LIVE TYPING (NO KEY!)</h3><p style="background:#fff;color:#000;padding:8px;border-radius:8px;font-size:12px;font-weight:900">Use Chrome browser! As you talk, white box go type LIVE!</p><button id="freeTalkBtn" class="btn gold" onclick="toggleFreeTalk()">🎙️ START FREE TALK - BRAIN GO TYPE LIVE!</button><button id="stopFreeTalkBtn" class="btn red" style="display:none" onclick="stopFreeTalk()">⏹️ STOP</button><div id="freeTalkStatus" style="display:none;background:black;padding:12px;border-radius:10px"><p>🔴 Recording + Typing LIVE <span id="freeTimer">0s</span></p><p id="brainListeningMsg" style="color:#00ff88;font-weight:900"></p><audio id="freeAudioPreview" controls style="width:100%;display:none"></audio></div><div id="freeTalkTranscribe" style="display:none;margin-top:12px;background:#111;padding:12px;border-radius:10px;border:2px solid #00ff88"><p style="color:gold;font-weight:900;margin:0 0 6px 0">⬇️ White box - LIVE TYPING:</p><textarea id="freeTranscription" placeholder="Talk now... e go type LIVE here..." rows="5" style="background:#fff;color:#000;font-size:16px;font-weight:700"></textarea><button class="btn blue" onclick="copyVoiceText()" style="background:#00aaff;color:#fff;padding:16px;font-size:16px">📋 COPY VOICE - SEND TO ME</button><button class="btn green" onclick="saveFreeTalk()">💾 SAVE FREE TALK</button><p id="saveFreeMsg"></p></div></div>';
}
async function renderAdminDashboard(session){const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single();if(!profile?.is_chairman){document.getElementById('app').innerHTML='<h1>BLOCKED</h1>';return;}const {data:allRecs}=await supabaseClient.from('recordings').select('*').order('created_at',{ascending:false});const recs=allRecs||[];document.getElementById('app').innerHTML='<div class="card" style="border:3px solid gold"><h2>👑 CHAIRMAN</h2></div><div class="card"><h3>Recordings - '+recs.length+'</h3>'+recs.slice(0,20).map(r=>'<div style="background:#181818;padding:12px;border-radius:12px;margin:10px 0"><b>#'+r.recording_number+' '+(r.language||'').toUpperCase()+'</b><div style="background:#000;padding:6px;border-radius:6px;margin:4px 0;font-size:12px">'+((r.transcription||r.pidgin_text||'').substring(0,150))+'</div></div>').join('')+'</div></div>';}
(async function boot(){
  try{
    const path=location.pathname;
    if(path==='/admin/login'){renderLoginAdmin();return;}
    if(path==='/user/login'){renderLoginUser();return;}
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session){if(path.startsWith('/admin')){location.pathname='/admin/login';return;}location.pathname='/user/login';return;}
    if(path==='/admin/dashboard'){await renderAdminDashboard(session);return;}
    if(path==='/user/dashboard'){await renderUserDashboard(session);return;}
    location.pathname='/user/dashboard';
  }catch(e){document.getElementById('app').innerHTML='<h2>ERROR: '+e.message+'</h2>';}
})();
</script></body></html>
