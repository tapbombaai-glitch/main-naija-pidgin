async function hashKeyClient(t){
  const e=new TextEncoder();
  const d=e.encode(t);
  const h=await crypto.subtle.digest('SHA-256',d);
  return Array.from(new Uint8Array(h))
    .map(b=>b.toString(16).padStart(2,'0'))
    .join('');
}

window.loadSignedVoice=async function(fileName,audioId){
  try{
    const res=await fetch(
      `/api/my-voice?file=${encodeURIComponent(fileName)}`
    );

    const data=await res.json();

    if(!res.ok){
      console.log('Signed voice failed:',data.error||'unknown error');
      return;
    }

    if(data.signedUrl){
      const el=document.getElementById(audioId);

      if(el){
        el.src=data.signedUrl;
      }
    }
  }catch(e){
    console.log('signed url error',e.message);
  }
};

window.toggleFreeTalk=async function(){

  try{

    const stream=await navigator.mediaDevices.getUserMedia({
      audio:true
    });

    mediaRecorder=new MediaRecorder(stream);

    audioChunks=[];
    recSec=0;
    freeBlob=null;

    mediaRecorder.ondataavailable=e=>{
      if(e.data.size>0){
        audioChunks.push(e.data);
      }
    };

    mediaRecorder.onstop=()=>{

      freeBlob=new Blob(
        audioChunks,
        {type:'audio/webm'}
      );

      const url=URL.createObjectURL(freeBlob);

      const audio=document.getElementById('freeAudioPreview');

      if(audio){
        audio.src=url;
        audio.style.display='block';
      }

      const trans=document.getElementById('freeTalkTranscribe');

      if(trans){
        trans.style.display='block';
      }
    };

    mediaRecorder.start();

    document.getElementById('freeTalkStatus').style.display='block';
    document.getElementById('freeTalkBtn').style.display='none';
    document.getElementById('stopFreeTalkBtn').style.display='block';

    recTimer=setInterval(()=>{

      recSec++;

      const timer=document.getElementById('freeTimer');

      if(timer){
        timer.innerText=recSec+'s';
      }

      if(recSec>=60){
        stopFreeTalk();
      }

    },1000);

  }catch(e){

    alert('Allow mic: '+e.message);

  }
};

window.stopFreeTalk=function(){

  if(
    mediaRecorder &&
    mediaRecorder.state==='recording'
  ){

    mediaRecorder.stop();

    mediaRecorder.stream
      .getTracks()
      .forEach(t=>t.stop());
  }

  clearInterval(recTimer);

  const start=document.getElementById('freeTalkBtn');
  const stop=document.getElementById('stopFreeTalkBtn');

  if(start)start.style.display='block';
  if(stop)stop.style.display='none';
};

window.deleteFreeTalk=function(){

  freeBlob=null;

  const audio=document.getElementById('freeAudioPreview');

  if(audio){
    audio.style.display='none';
    audio.src='';
  }

  const trans=document.getElementById('freeTalkTranscribe');

  if(trans){
    trans.style.display='none';
  }

  const input=document.getElementById('freeTranscription');

  if(input){
    input.value='';
  }

  const msg=document.getElementById('saveFreeMsg');

  if(msg){
    msg.innerText='🗑️ Deleted - Record again';
  }
};

      return;

      This matches the intended private Storage policy.
    */

      `${session.user.id}/${Date.now()}_free_${lang}_${isWhats?'whatsapp_':''}.webm`;

      error:upErr

      data:existing,
      error:countErr

      .from('recordings')
      .select('id')

    if(countErr)throw countErr;

    const {
      error:insErr
    }=await supabaseClient
      .from('recordings')
      .insert([{

        user_id:session.user.id,

        file_name:fileName,

        audio_path:fileName,

        pidgin_text:trans,

        word_count:countW(trans),

        language:lang,

        recording_number:
          (existing?.length||0)+1,

        is_free_talk:true,

        transcription:trans,

        quality_score:95,

        quality_status:'clear',

        admin_status:'pending',

        is_whatsapp_group:isWhats

      }]);

    if(insErr)throw insErr;

    msgEl.innerText='✅ SAVED to private bucket!';

    setTimeout(()=>{
      location.reload();
    },1000);

  }catch(e){

    msgEl.innerText='❌ '+e.message;

  }
};

async function doLogin(type){

  const e=
    document.getElementById('email')
      .value.trim();

  const p=
    document.getElementById('pass')
      .value;

  const msg=
    document.getElementById('msg');

  if(!e||!p){

    msg.innerText='Fill';

    return;
  }

  msg.innerText='Checking...';

  const {error}=
    await supabaseClient.auth.signInWithPassword({
      email:e,
      password:p
    });

  if(error){

    msg.innerText=error.message;

    return;
  }

  const {
    data:{session}
  }=await supabaseClient.auth.getSession();

  let {
    data:prof
  }=await supabaseClient
    .from('profiles')
    .select('*')
    .eq('id',session.user.id)
    .single();

  if(!prof){

    const newProf={

      id:session.user.id,

      email:e,

      display_name:
        e.split('@')[0],

      total_words:0,

      recordings_count:0,

      status:'not_started',

      is_chairman:false

    };

    const {
      error:insErr
    }=await supabaseClient
      .from('profiles')
      .insert([newProf]);

    if(insErr){

      msg.innerText=
        'Profile error: '+insErr.message;

      return;
    }

    prof=newProf;
  }

  if(type==='admin'){

    if(!prof?.is_chairman){

      document.getElementById('app').innerHTML=
        '<h1>🚫 BLOCKED - Not Chairman.</h1>';

      return;
    }

    location.href='/admin/dashboard';

  }else{

    if(prof?.is_chairman){

      location.href='/admin/dashboard';

    }else{

      location.href='/user/dashboard';

    }
  }
}

async function doSignup(){

  const e=

          onClose:function(){

            msg.innerText=
              'Paystack closed';

          }

        });

      handler.openIframe();

    }catch(e){

      msg.innerText=
        '❌ '+e.message;

async function renderApiDashboard(){

  const rawKey=
    localStorage.getItem('api_key')||'';

    localStorage.getItem('api_key_prefix')||'';

  if(!rawKey){

    document.getElementById('app').innerHTML=`

      <div class="card">

        <h3>
          No key - Go /buy
        </h3>

        <button
          class="btn gold"
          onclick="location.pathname='/buy'">

          Go Buy

        </button>

      </div>

    `;

    return;
  }

  document.getElementById('app').innerHTML=`

    <div class="card">

      <h3>
        Checking ${prefix}...
        Server verifies
      </h3>

    </div>

  `;

  try{

    /*
      This dashboard lookup is ONLY for displaying
      the customer's key status.

      The actual API request and credit consumption
      are handled by /api/v1/voice on the server.

      Existing keys are NOT modified here.
    */

    const hash=
      await hashKeyClient(rawKey);

    const {
      data:key,
      error
    }=await supabaseClient
      .from('api_keys')
      .select('*')
      .eq('key_hash',hash)
      .single();

    if(error||!key){

      document.getElementById('app')
        .innerHTML=`

          <div class="card">

            <h3>
              ❌ Key not found
            </h3>

            <button
              class="btn gold"
              onclick="location.pathname='/buy'">

              Buy New

            </button>

          </div>

        `;

      return;
    }

    if(!key.is_active){

      document.getElementById('app')
        .innerHTML=`

          <div
            class="card"
            style="border:3px solid gold">

            <h3>
              ⏳ PENDING APPROVAL
            </h3>

            <p>
              Chairman must approve
              this key before API use.
            </p>

            <p>
              ${key.key_prefix||prefix}...
              -
              ${key.name||''}
            </p>

            <p>
              Ref:
              ${key.payment_ref||''}
            </p>

            <button
              class="btn gold"
              onclick="location.pathname='/buy'">

              Go Buy Page

            </button>

            <button
              class="btn gray"
              onclick="
                localStorage.removeItem('api_key');
                localStorage.removeItem('api_key_prefix');
                location.pathname='/buy'">

              Logout

            </button>

          </div>

        `;

      document.getElementById('app')

          <div
            class="card"
            style="border:3px solid #ff3b3b">

            <h3>
              ⚠️ No credits left
              but key is still ACTIVE

            <p>
              ${key.credits_remaining||0}
              left -
              ${key.credits_used||0}/
              ${key.credits_total||0}

            <p>
              Chairman controls
              is_active separately
              from credits.
            </p>

            <button
              class="btn gold"
              onclick="location.pathname='/buy'">

              Buy More

            </button>

            <button
              class="btn gray"
              onclick="
                localStorage.removeItem('api_key');
                localStorage.removeItem('api_key_prefix');
                location.pathname='/buy'">

              Logout

            </button>

        <h2>
          🔑 API DASHBOARD -
          ${key.credits_remaining}
          LEFT -
          SERVER DEDUCTS ONLY
        </h2>

        <b>
          ${key.name||'API Customer'}

        <br>

        <small>
          ${key.key_prefix||prefix}...
        </small>


        <div
          style="
            background:#000;
            padding:10px;
            border-radius:10px;
            margin:10px 0;
            border:2px dashed gold">

          <b>
            🔗 YOUR API LINK
            <br>
            Keep secret key in header,
            NOT in URL
          </b>

          <br>

          <code>
            ${API_ENDPOINT}
          </code>

          <br>

          <small>

            x-api-key: YOUR_KEY
          </small>

          <br>

          <button
            onclick="copyApiLink()"
            style="
              background:gold;
              color:#000;
              padding:8px 12px;
              border:none;
              border-radius:20px;
              font-weight:900;
              margin-top:6px">

            🔗 Copy API Link

          </button>

          <button
            onclick="copyLink('${rawKey}')"
            style="
              background:#00ff88;
              color:#000;
              padding:8px 12px;
              border:none;
              border-radius:20px;
              font-weight:900">

          </button>

        </div>


        <div
          style="
            display:grid;
            grid-template-columns:
              1fr 1fr 1fr;
            gap:8px;
            margin-top:10px">

          <div
            style="
              background:#00ff88;
              color:#000;
              padding:12px;
              border-radius:10px;
              text-align:center">

            <b>
              ${key.credits_remaining||0}
            </b>

            <br>

            LEFT

          </div>

          <div
            style="
              background:#222;
              padding:12px;
              border-radius:10px;
              text-align:center">

            <b>
              ${key.credits_used||0}
            </b>

            <br>

            USED

          </div>

          <div
            style="
              background:gold;
              color:#000;
              padding:12px;
              border-radius:10px;
              text-align:center">

            <b>
              ${key.credits_total||0}
            </b>

            <br>

            TOTAL

          </div>

        </div>


        <button
          class="btn gray"
          onclick="
            localStorage.removeItem('api_key');
            localStorage.removeItem('api_key_prefix');
            location.pathname='/buy'"
          style="margin-top:10px">

          Logout

        </button>

      </div>


      <div class="card">

        <h3>
          🎙️ Secure API Test
        </h3>

        <p
          style="
            font-size:11px;
            color:gold">

          Server verifies the API key,
          selects approved voice,
          creates private signed URL,
          and deducts exactly one credit
          on the server.

        </p>

        <button
          class="btn green"
          onclick="testSecureApi()"
          style="padding:18px">

          🔒 TEST SECURE API
          - Deduct 1 Server-side

        </button>

        <p
          id="secureApiResult"
          style="
            background:#000;
            padding:10px;
            border-radius:10px;
            margin-top:10px">
        </p>

      </div>
    `;


    window.testSecureApi=async function(){

      if(
        !confirm(
          'Test secure API? This will consume 1 credit if successful.'
        )
      ){

        return;
      }

      const resEl=
        document.getElementById(
          'secureApiResult'
        );

      resEl.innerText=
        'Calling secure API...';

      try{

        const res=
          await fetch(
            '/api/v1/voice',
            {
              method:'GET',
              headers:{
                'x-api-key':rawKey
              }
            }
          );

        const data=
          await res.json();

        if(!res.ok){

          throw new Error(
            data.error||
            'API failed'
          );
        }

        const remaining=
          Number(
            data.credits_remaining
          );

        const mins=
          Number(
            data.expires_in_minutes||
            60
          );

        resEl.innerHTML=`

          ✅ Success!

          <br>

          Credits left:
          ${remaining}

          <br>

          Voice:
          ${
            data.voice?.text
            ?data.voice.text.substring(0,150)
            :'Voice returned'
          }

          <br>

          <audio
            controls
            src="${data.voice?.audio_url||''}"
            style="
              width:100%;
              margin-top:8px">
          </audio>

          <br>

          <small>
            Signed URL expires in
            ${mins} minutes.
            Private bucket.
          </small>

        `;

        /*
          Reload after a short delay so the
          displayed credit count comes from
          the database/server result.
        */
        setTimeout(()=>{
          location.reload();
        },4000);

      }catch(e){

        resEl.innerText=
          '❌ Failed: '+e.message;

      }
    };

  }catch(e){

    document.getElementById('app')
      .innerHTML=`

        <div class="card">

          <h3>
            ❌ ${e.message}
          </h3>

        </div>

      `;

  }
}

      .from('api_keys')
      .select('*')
      .eq('key_hash',hash)
      .single();

    if(error||!data){

      msg.innerText=
        '❌ Invalid';
