          <div class="price-card"><b>5k Voices</b><br><span style="color:#ffcc00;font-weight:900">₦22k</span><br><button class="btn" style="background:#ffcc00;color:#000" onclick="buyPublic(5000,22000)">Buy 5k</button></div>
          <div class="price-card"><b>10k</b><br><span style="color:gold;font-weight:900">₦45k</span><br><button class="btn gold" onclick="buyPublic(10000,45000)">Buy 10k</button></div>
          <div class="price-card"><b>15k</b><br><span style="color:#ffcc00;font-weight:900">₦65k</span><br><button class="btn" style="background:#ffcc00;color:#000" onclick="buyPublic(15000,65000)">Buy 15k</button></div>
          <div class="price-card"><b>20k</b><br><span style="color:#00aaff;font-weight:900">₦80k</span><br><button class="btn blue" onclick="buyPublic(20000,80000)">Buy 20k</button></div>
          <div class="price-card" style="grid-column:1/-1"><b>100k</b><br><span style="color:gold;font-weight:900;font-size:20px">₦350k</span><br><button class="btn gold" onclick="buyPublic(100000,350000)">Buy 100k</button></div>
        </div>
        <input id="buy_name_paid" placeholder="Name / Company"><input id="buy_email_paid" placeholder="Email for receipt">
        <div id="buyPayBox" style="display:none;background:#000;padding:15px;border-radius:12px;border:3px dashed gold"><h3 id="buyPayTitle" style="color:gold">Ready</h3><button class="btn green" style="padding:16px" onclick="payPublic()">💳 TAP TO PAY - Put Card Number - Paystack</button><div id="buyPaidBox" style="display:none;background:#00ff88;color:#000;padding:16px;border-radius:12px;margin-top:10px"><b>✅ PAID - Pending Chairman Approval:</b><br><code id="buyPaidKeyText" style="word-break:break-all;background:#000;color:#00ff88;padding:8px;display:block;border-radius:6px;margin-top:8px"></code><br><div id="buyPaidInfo" style="background:#000;color:#00ff88;padding:8px;border-radius:6px;margin-top:8px"></div><button onclick="copyLink(document.getElementById('buyPaidKeyText').innerText)" style="padding:12px;background:#000;color:#00ff88;border:none;border-radius:30px;width:100%;font-weight:900">COPY</button><p style="font-size:11px;color:#000;margin-top:8px">Key saved but PENDING - Chairman go approve for /admin/keys - Then you fit use am!</p></div><p id="buy_paid_msg"></p></div>
      </div>
    `;
    window.buyPublic=function(v,a){currentPackage={voices:v,amount:a};document.getElementById('buyPayBox').style.display='block';document.getElementById('buyPayTitle').innerText=`Pay ₦${a.toLocaleString()} for ${v.toLocaleString()} credits`;document.getElementById('buyPayBox').scrollIntoView({behavior:'smooth'});}
    window.doBuyFree=async function(){
      const name=document.getElementById('buy_name_free').value.trim()||'Free User';const email=document.getElementById('buy_email_free').value.trim();
      document.getElementById('buy_free_msg').innerText='Collecting FREE...';
      try{const raw=genFree();const hash=await hashKeyClient(raw);const prefix=raw.substring(0,18);await supabaseClient.from('api_keys').insert([{name:name+' - FREE 100 PUBLIC '+email,key_hash:hash,key_prefix:prefix,is_active:true,payment_ref:'FREE_100_PUBLIC',credits_total:100,credits_used:0,credits_remaining:100,voices_package:100}]);document.getElementById('buyFreeKeyText').innerText=raw;document.getElementById('buyFreeBox').style.display='block';document.getElementById('buy_free_msg').innerText='✅ Collected! Chairman go see am!';}catch(e){document.getElementById('buy_free_msg').innerText='❌ '+e.message;}
    }
    window.payPublic=function(){
      let email=document.getElementById('buy_email_paid').value.trim();if(!email||!email.includes('@')){email=prompt('Enter email:')||'';}if(!email||!email.includes('@')){alert('Valid email');return;}
      const msg=document.getElementById('buy_paid_msg');const amount=currentPackage.amount;const voices=currentPackage.voices;msg.innerText='Opening Paystack...';
      try{const handler=PaystackPop.setup({key:PAYSTACK_PUBLIC_KEY,email:email,amount:amount*100,currency:'NGN',ref:'BUY_'+voices+'_'+Date.now(),callback:async function(res){msg.innerText='Paid! Saving for Chairman approval...';try{const name=document.getElementById('buy_name_paid').value.trim()||'Paid User';const raw=genPaid();const hash=await hashKeyClient(raw);const prefix=raw.substring(0,18);await supabaseClient.from('api_keys').insert([{name:`${name} - ${voices} credits ₦${amount} ${email} PENDING APPROVAL`,key_hash:hash,key_prefix:prefix,is_active:false,payment_ref:res.reference+`_${voices}_₦${amount}_PENDING`,credits_total:voices,credits_used:0,credits_remaining:voices,voices_package:voices}]);document.getElementById('buyPaidKeyText').innerText=raw;document.getElementById('buyPaidInfo').innerText=`${voices} credits ₦${amount} Ref ${res.reference} PENDING`;document.getElementById('buyPaidBox').style.display='block';msg.innerText='✅ Paid! PENDING approval - Chairman go approve!';}catch(e){msg.innerText='❌ '+e.message;}},onClose:function(){msg.innerText='Closed';}});handler.openIframe();}catch(e){msg.innerText='❌ '+e.message;}
    }
  }

  async function renderApiDashboard(){
    const rawKey=localStorage.getItem('api_key')||'';const prefix=localStorage.getItem('api_key_prefix')||'';
    if(!rawKey){document.getElementById('app').innerHTML=`<div class="card"><h3>No key - Go /buy</h3><button class="btn gold" onclick="location.pathname='/buy'">Go Buy</button></div>`;return;}
    document.getElementById('app').innerHTML=`<div class="card"><h3>Checking ${prefix}...</h3></div>`;
    try{
      const hash=await hashKeyClient(rawKey);const {data:key,error}=await supabaseClient.from('api_keys').select('*').eq('key_hash',hash).single();
      if(error||!key){document.getElementById('app').innerHTML=`<div class="card"><h3>❌ Key not found</h3><button class="btn gold" onclick="location.pathname='/buy'">Buy New</button></div>`;return;}
      if(!key.is_active){document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid gold"><h3>⏳ PENDING APPROVAL</h3><p>Your key ${key.key_prefix}... - ${key.name}</p><p>Chairman never approve yet - Wait small or contact Chairman for /admin/keys approval</p><p>Payment Ref: ${key.payment_ref||''}</p><button class="btn gold" onclick="location.pathname='/buy'">Go Buy Page</button><button class="btn gray" onclick="localStorage.clear();location.pathname='/buy'">Logout</button></div>`;return;}
      if((key.credits_remaining||0)<=0){document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid #ff3b3b"><h3>❌ Expired ${key.credits_remaining||0} left</h3><button class="btn gold" onclick="location.pathname='/buy'">Buy More</button></div>`;return;}
      const {data:allRecs}=await supabaseClient.from('recordings').select('*').eq('admin_status','approved').order('created_at',{ascending:false}).limit(100);
      document.getElementById('app').innerHTML=`<div class="card" style="border:3px solid #00ff88"><h2>🔑 API DASHBOARD - ${key.credits_remaining} LEFT</h2><b>${key.name}</b><br><small>${key.key_prefix}... ${key.payment_ref||''}</small><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px"><div style="background:#00ff88;color:#000;padding:12px;border-radius:10px;text-align:center"><b>${key.credits_remaining}</b><br>LEFT</div><div style="background:#222;padding:12px;border-radius:10px;text-align:center"><b>${key.credits_used||0}</b><br>USED</div><div style="background:gold;color:#000;padding:12px;border-radius:10px;text-align:center"><b>${key.credits_total}</b><br>TOTAL</div></div><button class="btn gray" onclick="localStorage.clear();location.pathname='/buy'" style="margin-top:10px">Logout</button></div><div class="card"><h3>🎙️ Voices ${allRecs?.length||0} - Each -1</h3><input id="apiSearch" placeholder="Search..." oninput="filterApiRecs()"><div id="apiRecsList">${(allRecs||[]).map(r=>`<div class="api-rec-item" style="background:#181818;padding:10px;border-radius:10px;margin:8px 0" data-text="${(r.transcription||r.pidgin_text||'').toLowerCase()}"><b>${r.language} #${r.recording_number}</b><br><small>${(r.transcription||r.pidgin_text||'').substring(0,120)}</small><br><audio controls src="https://rupuxvpupdhlhxgjrbsh.supabase.co/storage/v1/object/public/voices/${r.file_name}" style="height:30px;width:70%"></audio><button onclick="apiDownloadWithDeduct('${r.file_name}','${key.id}')" style="background:#00ff88;color:#000;padding:8px 12px;border:none;border-radius:20px;font-weight:900">📥 -1</button></div>`).join('')||'No approved voices'}</div></div>`;
      window.filterApiRecs=function(){const q=document.getElementById('apiSearch').value.toLowerCase();document.querySelectorAll('.api-rec-item').forEach(el=>{el.style.display=(el.getAttribute('data-text')||'').includes(q)?'block':'none';});}
      window.apiDownloadWithDeduct=async function(f,id){if((key.credits_remaining||0)<=0){alert('No credits');return;}const url=`https://rupuxvpupdhlhxgjrbsh.supabase.co/storage/v1/object/public/voices/${f}`;const a=document.createElement('a');a.href=url;a.download=f;a.target='_blank';document.body.appendChild(a);a.click();a.remove();await supabaseClient.from('api_keys').update({credits_remaining:key.credits_remaining-1,credits_used:(key.credits_used||0)+1,is_active:key.credits_remaining-1>0}).eq('id',id);alert('Downloaded -1');location.reload();}
    }catch(e){document.getElementById('app').innerHTML=`<div class="card"><h3>❌ ${e.message}</h3></div>`;}
  }

  function renderApiKeyLogin(){document.getElementById('app').innerHTML=`<div class="card" style="max-width:500px;margin:20px auto;border:3px solid #00ff88"><h1 style="text-align:center">🔑 API LOGIN</h1><input id="apiKeyInput" placeholder="sk_free_ or sk_live_"><button class="btn green" onclick="doApiKeyLogin()">LOGIN</button><p id="apiLoginMsg"></p><div style="text-align:center;margin-top:12px"><a href="/buy" style="color:gold">Don't have key? Go /buy - Public - Anybody fit enter!</a></div></div>`;}
  async function doApiKeyLogin(){const raw=document.getElementById('apiKeyInput').value.trim(),msg=document.getElementById('apiLoginMsg');if(!raw){msg.innerText='Enter key';return;}msg.innerText='Checking...';try{const hash=await hashKeyClient(raw);const {data,error}=await supabaseClient.from('api_keys').select('*').eq('key_hash',hash).single();if(error||!data){msg.innerText='❌ Invalid';return;}if(!data.is_active){msg.innerText='⏳ PENDING - Chairman never approve - Wait!';return;}localStorage.setItem('api_key',raw);localStorage.setItem('api_key_prefix',data.key_prefix);msg.innerText=`✅ ${data.credits_remaining||0} left - Success!`;setTimeout(()=>location.pathname='/api/dashboard',800);}catch(e){msg.innerText='❌ '+e.message;}}
  window.doApiKeyLogin=doApiKeyLogin;
  (async function boot(){const path=location.pathname;if(path==='/buy'){renderBuyPage();return;}if(path==='/api/login'){renderApiKeyLogin();return;}if(path==='/api/dashboard'){await renderApiDashboard();return;}if(path==='/admin/login'){renderLoginAdmin();return;}if(path==='/user/login'){renderLoginUser();return;}const {data:{session}}=await supabaseClient.auth.getSession();if(!session){if(path.startsWith('/admin')){location.pathname='/admin/login';return;}if(path==='/buy'){renderBuyPage();return;}if(path==='/api/dashboard'){location.pathname='/api/login';return;}location.pathname='/user/login';return;}if(path==='/admin/keys'){await renderKeysPage();return;}if(path==='/admin/dashboard'){await renderAdminDashboard(session);return;}if(path==='/user/dashboard'){await renderUserDashboard(session);return;}location.pathname='/user/dashboard';})();
})();
</script>
</body>
</html>
