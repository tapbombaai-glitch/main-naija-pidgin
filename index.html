  async function renderUserDashboard(session){ const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single(); if(profile?.is_chairman){location.pathname='/admin/dashboard';return;} const {data:recs}=await supabaseClient.from('recordings').select('*').eq('user_id',session.user.id).order('recording_number'); userState.list=recs||[];userState.total=(recs||[]).reduce((s,r)=>s+r.word_count,0)||0; const current=TEXTS[(recs||[]).length % TEXTS.length];const pct=Math.min(100,(userState.total/1000)*100); const earnedSoFar=userState.list.length*PRICE_PER_RECORDING; const totalPotential=100*PRICE_PER_RECORDING; const announcements=await loadAnnouncements(); let announceHTML=`<div class="card" style="border:2px solid gold;background:#1a1a00"><h3>📢 ANNOUNCEMENT</h3>${announcements.length==0?'<p>No announcement</p>':announcements.map(a=>`<div class="announce">📢 ${a.message}<br><small>${new Date(a.created_at).toLocaleString()}</small></div>`).join('')}</div>`; document.getElementById('app').innerHTML=`<div class="header"><div>WELCOME, ${(profile?.display_name||'WORKER').toUpperCase()}</div><h3>🎙️ PIDGIN RECORDING - 100 Sentences</h3><div class="price-banner">💰 RATE: ₦${PRICE_PER_VOICE} PER VOICE = ₦${PRICE_PER_RECORDING} PER RECORD<br>✅ ${userState.list.length} | 💵 ₦${earnedSoFar} | ⏳ Remain ₦${totalPotential-earnedSoFar}</div><div class="big">${userState.total} / 1,000 WORDS</div><div class="progress"><div class="fill" style="width:${pct}%"></div></div><small>${Math.max(0,1000-userState.total)} WORDS REMAIN | ${pct.toFixed(1)}%</small><div class="nav"><button class="btn gray" style="width:auto" onclick="location.pathname='/user/dashboard'">Dashboard</button><button class="btn gray" style="width:auto; background:#222; color:#ff4444; border:1px solid red;" onclick="showChairmanBlockScreen()">🔒 Admin Panel</button><button class="btn gray" style="width:auto" onclick="supabaseClient.auth.signOut().then(()=>location.pathname='/user/login')">Logout</button><button class="btn gray" style="width:auto" onclick="copyLink(window.location.href, 'copyPage')" id="copyPage">📋 COPY LINK</button></div></div>${announceHTML}<div class="card" style="border:2px solid gold;background:#1a1a00"><h3>💰 PAYMENT ACCOUNT - ₦${PRICE_PER_VOICE}!</h3><input id="acc_fullname" placeholder="Full Name"><select id="acc_bank"><option value="">Select Bank</option><option>Opay</option><option>Moniepoint</option><option>PalmPay</option><option>Kuda</option><option>First Bank</option><option>GTBank</option><option>Access Bank</option><option>UBA</option><option>Zenith</option><option>Others</option></select><input id="acc_number" placeholder="Account Number" maxlength="10"><input id="acc_name" placeholder="Account Name"><input id="acc_phone" placeholder="WhatsApp"><button class="btn gold" onclick="saveWorkerAccount()">💾 SAVE ACCOUNT</button><p id="acc_msg"></p></div><div class="card"><small>Text #${(recs||[]).length+1} of 100 - ${countW(current)} words - ₦${PRICE_PER_RECORDING}</small><div class="textbox" id="curTxt">${current}</div><button class="btn gray" style="width:auto;padding:8px 14px;font-size:12px;" onclick="copyLink(document.getElementById('curTxt').innerText, 'copyCurTxt')" id="copyCurTxt">📋 COPY TEXT</button><button class="btn green" id="startB" onclick="startR()">🎙️ RECORD - EARN ₦${PRICE_PER_RECORDING}</button><button class="btn red" id="stopB" style="display:none" onclick="stopR()">⏹️ STOP</button><div id="prev" style="display:none"><div class="clean-badge">✅ Clean Voice Active</div><audio id="aud" controls style="width:100%"></audio><button class="btn gray" onclick="playP()">▶️ PLAY</button><button class="btn gray" onclick="again()">🔄 AGAIN</button><button class="btn green" id="saveB" onclick="saveR()">💾 SAVE & EARN</button><p id="smsg"></p></div><button class="btn green" id="nextB" style="display:none" onclick="location.reload()">NEXT ➡️</button></div>`; setTimeout(loadWorkerAccount,500); }
  async function startR(){ try{ const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:{ideal:1}}}); userState.chunks=[];const mr=new MediaRecorder(stream);mr.ondataavailable=e=>{if(e.data.size>0)userState.chunks.push(e.data);}; mr.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const raw=new Blob(userState.chunks);const cleaned=await cleanVoice(raw);userState.blob=cleaned;if(userState.url)URL.revokeObjectURL(userState.url);userState.url=URL.createObjectURL(cleaned);document.getElementById('prev').style.display='block';document.getElementById('aud').src=userState.url;}; mr.start(1000);document.getElementById('startB').style.display='none';document.getElementById('stopB').style.display='block';userState.recorder=mr;userState._stream=stream; }catch(e){alert('Allow mic: '+e.message);} }
  function stopR(){if(userState.recorder&&userState.recorder.state==='recording')userState.recorder.stop();if(userState._stream)userState._stream.getTracks().forEach(t=>t.stop());}
  function playP(){document.getElementById('aud').play();} function again(){document.getElementById('prev').style.display='none';document.getElementById('startB').style.display='block';}
  async function saveR(){ const saveB=document.getElementById('saveB');saveB.disabled=true;saveB.innerText='Uploading...';const text=document.querySelector('.textbox').innerText;const wc=countW(text); const {data:{session}}=await supabaseClient.auth.getSession();const num=userState.list.length+1;const fname=`${String(num).padStart(3,'0')}_pidgin_recording.wav`;const path=`${session.user.id}/${fname}`; try{const {error:upErr}=await supabaseClient.storage.from('pidgin-recordings').upload(path,userState.blob,{contentType:'audio/wav',upsert:false});if(upErr)throw upErr;const {data:urlD}=supabaseClient.storage.from('pidgin-recordings').getPublicUrl(path);const {error:dbErr}=await supabaseClient.from('recordings').insert([{user_id:session.user.id,recording_number:num,pidgin_text:text,word_count:wc,audio_path:path,audio_url:urlD.publicUrl,file_name:fname}]);if(dbErr)throw dbErr;await supabaseClient.from('profiles').update({total_words:userState.total+wc,recordings_count:num,status:userState.total+wc>=1000?'completed':'recording'}).eq('id',session.user.id);document.getElementById('smsg').innerText='✅ SAVED!';document.getElementById('nextB').style.display='block';setTimeout(()=>location.reload(),1200);}catch(e){document.getElementById('smsg').innerText='❌ '+e.message;saveB.disabled=false;saveB.innerText='💾 SAVE';} }
  window.startR=startR;window.stopR=stopR;window.playP=playP;window.again=again;window.saveR=saveR;window.saveWorkerAccount=saveWorkerAccount;window.viewWorkerAccounts=viewWorkerAccounts;window.postAnnouncement=postAnnouncement;
  async function renderAdminDashboard(session){
    const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single();
    if(!profile?.is_chairman){ showChairmanBlockScreen(); return; }
    const {data:users}=await supabaseClient.from('profiles').select('*').order('total_words',{ascending:false});const list=users||[];const totalW=list.reduce((s,u)=>s+(u.total_words||0),0);const completed=list.filter(u=>u.total_words>=1000).length;const recording=list.filter(u=>u.total_words>0&&u.total_words<1000).length;const notStarted=list.filter(u=>!u.total_words||u.total_words==0).length;const totalRecs=list.reduce((s,u)=>s+(u.recordings_count||0),0);
    const announcements=await loadAnnouncements();
    document.getElementById('app').innerHTML=`<div class="card" style="border:2px solid gold"><h2>👑 CHAIRMAN DASHBOARD - ₦${PRICE_PER_VOICE}</h2><div class="price-banner">💰 RATE: ₦${PRICE_PER_VOICE} per Voice | Total Payout: ₦${list.length*PRICE_PER_VOICE}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="card">Users<br><b class="big">${list.length}</b></div><div class="card">Completed<br><b class="big">${completed}</b></div><div class="card">Recording<br><b class="big">${recording}</b></div><div class="card">Not Started<br><b class="big">${notStarted}</b></div><div class="card">Words<br><b class="big">${totalW.toLocaleString()}</b></div><div class="card">Recordings<br><b class="big">${totalRecs}</b></div></div><div class="nav"><button class="btn gold" style="background:#facc15;color:black" onclick="location.pathname='/admin/keys'">🔑 MY API KEYS - SECRET</button><button class="btn gold" style="background:black;color:#facc15;border:2px solid #facc15" onclick="location.pathname='/api-docs'">📚 PUBLIC API DOCS</button><button class="btn gold" onclick="location.pathname='/admin/dashboard'">Dashboard</button><button class="btn gray" onclick="location.pathname='/admin/users'">All Users</button><button class="btn gray" style="background:gold;color:black" onclick="viewWorkerAccounts()">💳 ACCOUNTS</button><button class="btn gray" onclick="copyLink(window.location.href, 'copyAdminLink')" id="copyAdminLink">📋 COPY LINK</button><button class="btn gray" onclick="supabaseClient.auth.signOut().then(()=>location.pathname='/admin/login')">Logout</button></div></div><div class="card" style="border:2px solid gold;background:#1a1a00"><h3>📢 POST ANNOUNCEMENT</h3><textarea id="announce_text" placeholder="Type announcement..."></textarea><button class="btn gold" onclick="postAnnouncement()">📢 POST</button><div>${announcements.map(a=>`<div class="announce">${a.message}<br><small>${new Date(a.created_at).toLocaleString()} - <button style="background:red;color:white;border:none;border-radius:5px;padding:3px 8px" onclick="deleteAnnounce('${a.id}')">Delete</button></small></div>`).join('')||'No announcement'}</div></div><div class="card" style="border:2px solid gold;background:#1a1a00"><h2>📦 PACKAGE DATASET FOR SALE</h2><button class="btn gold" style="font-size:18px;padding:20px" onclick="exportChairmanDataset()">📦 EXPORT DATASET ZIP</button><p id="exportMsg"></p></div><div class="card"><h3>Recent Users</h3>${list.slice(0,5).map(u=>`<div class="user-row" onclick="location.pathname='/admin/users/${u.id}'"><div><b>${u.display_name}</b><br><small>${u.email}<br>${u.total_words||0}/1000 - ₦${(u.recordings_count||0)*PRICE_PER_RECORDING}</small></div><div>➡️</div></div>`).join('')}<button class="btn gray" onclick="location.pathname='/admin/users'">View All</button></div>`;
  }
  async function deleteAnnounce(id){if(!confirm('Delete?'))return;await supabaseClient.from('announcements').delete().eq('id',id);location.reload();}
  window.deleteAnnounce=deleteAnnounce;
  async function renderAdminUsers(session){
    const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single();
    if(!profile?.is_chairman){ showChairmanBlockScreen(); return; }
    const {data:users}=await supabaseClient.from('profiles').select('*').order('total_words',{ascending:false});
    document.getElementById('app').innerHTML=`<div class="card"><h2>👥 ALL USERS - ${(users||[]).length}</h2><div class="price-banner">💰 RATE: ₦${PRICE_PER_VOICE}</div><div class="nav"><button class="btn gold" onclick="location.pathname='/admin/dashboard'">Dashboard</button><button class="btn gold" onclick="location.pathname='/admin/keys'">🔑 API KEYS</button><button class="btn gray" onclick="viewWorkerAccounts()">💳 ACCOUNTS</button></div>${(users||[]).map((u,i)=>`<div class="user-row" onclick="location.pathname='/admin/users/${u.id}'"><div><b>${i+1}. ${u.display_name}</b><br><small>${u.email}</small><br><small>${u.total_words||0}/1000 | ${u.recordings_count||0} recs = ₦${(u.recordings_count||0)*PRICE_PER_RECORDING}</small></div><div>➡️</div></div>`).join('')}</div>`;
  }
  async function renderAdminUserDetail(session,uid){
    const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single();
    if(!profile?.is_chairman){ showChairmanBlockScreen(); return; }
    const {data:user}=await supabaseClient.from('profiles').select('*').eq('id',uid).single();
    const {data:recs}=await supabaseClient.from('recordings').select('*').eq('user_id',uid).order('recording_number');
    const {data:acc}=await supabaseClient.from('worker_accounts').select('*').eq('user_id',uid).single();
    document.getElementById('app').innerHTML=`<div class="card" style="border:2px solid gold"><h3>👤 ${user.display_name} - ₦${(recs||[]).length*PRICE_PER_RECORDING}</h3><p>${user.email}<br>${user.total_words||0}/1000<br>${(recs||[]).length} recs</p>${acc?`<div class="card" style="background:#1a1a00;border:1px solid gold"><h4>💳 BANK - Pay ₦${(recs||[]).length*PRICE_PER_RECORDING}</h4><b>${acc.full_name}</b><br>${acc.bank_name} - ${acc.account_number}<br>${acc.account_name}</div>`:'<p>No account</p>'}<button class="btn gray" onclick="location.pathname='/admin/users'">⬅️ Back</button></div><div class="card"><h3>Recordings - ${(recs||[]).length}</h3>${(recs||[]).map(r=>`<div class="card" style="background:#181818"><b>${r.file_name}</b><br><div class="textbox" style="font-size:14px">${r.pidgin_text}</div><button class="btn green" style="width:auto;" onclick="new Audio('${r.audio_url}').play()">▶️ Play</button></div>`).join('')||'No recs'}</div>`;
  }
  async function exportChairmanDataset(){
    const msgEl=document.getElementById('exportMsg');try{
      if(msgEl)msgEl.innerText='⏳ Gathering...';
      const {data:allRecs}=await supabaseClient.from('recordings').select('*').order('created_at',{ascending:true});
      if(!allRecs||allRecs.length==0){alert('No recordings yet!');if(msgEl)msgEl.innerText='';return;}
      const {data:profiles}=await supabaseClient.from('profiles').select('id,email,display_name');
      const map={};(profiles||[]).forEach(p=>{map[p.id]=p;});
      const zip=new JSZip();const folder=zip.folder("audios");let csv='audio_file,text,speaker_email,speaker_name,word_count,file_name,price_naira\n';let count=0;
      for(const r of allRecs){count++;if(msgEl)msgEl.innerText=`Packaging ${count}/${allRecs.length}...`;try{const resp=await fetch(r.audio_url);if(!resp.ok)continue;const blob=await resp.blob();const safe=r.file_name.replace(/[^a-zA-Z0-9._-]/g,'_');folder.file(safe,blob);const prof=map[r.user_id];csv+=`audios/${safe},"${(r.pidgin_text||'').replace(/"/g,'""')}",${prof?.email||''},${prof?.display_name||''},${r.word_count||0},${safe},${PRICE_PER_RECORDING}\n`;}catch(e){}}
      zip.file("LICENSE.txt","TAPBOMBA PIDGIN DATASET - Owner: Chairman - Price: ₦"+PRICE_PER_VOICE); zip.file("README.txt",`TAPBOMBA DATASET v1 - ${allRecs.length} recordings`); zip.file("metadata.csv",csv);
      if(msgEl)msgEl.innerText='Building ZIP...'; const content=await zip.generateAsync({type:"blob"},(m)=>{if(msgEl)msgEl.innerText=`Building ${m.percent.toFixed(0)}%`;}); const url=URL.createObjectURL(content);const a=document.createElement('a');a.href=url;a.download=`TAPBOMBA-DATASET-${allRecs.length}.zip`;a.click(); if(msgEl)msgEl.innerText=`✅ DONE! ${allRecs.length} files!`;
    }catch(e){alert('Export failed: '+e.message);if(msgEl)msgEl.innerText='❌ '+e.message;}
  }
  window.exportChairmanDataset=exportChairmanDataset;
  (async function boot(){
    try{
      const path=location.pathname;
      if(path==='/admin/login'){await renderLoginAdmin();return;}
      if(path==='/user/login'){await renderLoginUser();return;}
      if(path==='/user/reset-password' || path==='/reset-password'){await renderResetPassword();return;}
      if(path==='/api-docs'){renderApiDocsPage();return;}
      if(path==='/login'){location.pathname='/user/login';return;}
      if(path==='/keys'){location.pathname='/admin/keys';return;}
      const {data:{session}}=await supabaseClient.auth.getSession();
      if(!session){
        if(path.startsWith('/admin')){ if(path==='/admin/keys'){location.pathname='/admin/login';return;} if(path!=='/api-docs'){location.pathname='/admin/login';return;}}
        if(path.includes('reset-password')){await renderResetPassword();return;}
        if(path==='/api-docs'){renderApiDocsPage();return;}
        location.pathname='/user/login';return;
      }
      if(path.includes('reset-password')){await renderResetPassword();return;}
      if(path==='/admin/keys' || path==='/admin/keys/'){await renderKeysPage(session);return;}
      if(path==='/admin/dashboard'){await renderAdminDashboard(session);return;}
      if(path==='/admin/users'){await renderAdminUsers(session);return;}
      if(path.startsWith('/admin/users/')){const uid=path.split('/').pop();await renderAdminUserDetail(session,uid);return;}
      if(path==='/user/dashboard'){await renderUserDashboard(session);return;}
      if(path==='/'||path==='/user'){location.pathname='/user/dashboard';return;}
      if(path==='/admin'||path==='/admin/'){location.pathname='/admin/dashboard';return;}
      location.pathname='/user/dashboard';
    }catch(err){document.getElementById('app').innerHTML='<div class="card"><h2>Error</h2><p>'+err.message+'</p></div>';}
  })();
})();
</script>
